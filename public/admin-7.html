<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}
body{font-family:Arial,Helvetica,sans-serif;background:#c8d3df;padding:12px;margin:0;color:#1f293d}

#login button{width:100%;background:#1f293d;color:#fff;padding:11px;font-size:15px;font-weight:bold;border-radius:0;margin:0}
#loginError{display:none;margin-top:10px;color:#9b2226;font-weight:bold;font-size:13px}
#app{max-width:900px;margin:0 auto;background:#fff;padding:16px;border:2px solid #8fa0b5;border-radius:0}

.toggleRow{display:flex;align-items:center;gap:10px;margin:8px 0}
.stateOn{color:#16a34a;font-weight:bold}
.stateOff{color:#dc2626;font-weight:bold}

.designPanel{border:2px solid #1f293d;margin:16px 0;background:#f8fafc;padding:12px}
.designPanel summary{font-weight:900;cursor:pointer;font-size:17px;padding:5px}
.designGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:12px}
.designField{font-size:12px;font-weight:bold;display:flex;flex-direction:column;gap:5px}
.designField input[type=text],.designField input[type=number]{width:100%;padding:9px;border:1px solid #94a3b8;box-sizing:border-box}
.designField input[type=color]{width:100%;height:38px;padding:2px;border:1px solid #94a3b8;background:#fff}
.designActions{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.designPreviewWrap{border:2px solid #64748b;background:#e2e8f0;padding:8px;margin-top:12px;overflow:auto}
.designPreviewTop{display:flex;justify-content:space-between;align-items:center;font-weight:bold;margin-bottom:7px}
#designPreview{width:100%;height:520px;border:1px solid #94a3b8;background:#fff}
.designHint{font-size:12px;color:#475569;line-height:1.45}
.designStatus{font-size:13px;margin:8px 0;padding:8px;background:#e0f2fe;color:#075985;display:none}
@media(max-width:520px){.designGrid{grid-template-columns:1fr}#designPreview{height:460px}}

</style>
</head>

<body>
<div class="box">

<div id="login" role="group" aria-label="Admin login">
  <div class="gateLogo">BIN AMEEN TRADER</div>
  <input id="p" type="password" placeholder="ENTER PASSWORD" autocomplete="current-password" aria-label="Admin password">
  <button id="loginBtn" class="dark" type="button" onclick="login()">ENTER</button>

<button class="green" onclick="edit(-1)">＋ NEW ITEM</button>

<details class="designPanel" id="designPanel">
  <summary>🎨 CATALOGUE DESIGN EDITOR — LIVE PREVIEW</summary>
  <p class="designHint">تبدیلی کرتے ہی نیچے Preview اپ ڈیٹ ہوگا۔ SAVE DRAFT صرف ڈیزائن محفوظ کرے گا؛ PUBLISH کرنے پر ہی Public Catalogue تبدیل ہوگا۔</p>
  <div class="designGrid">
    <label class="designField">Catalogue Title<input id="d_siteTitle" type="text" maxlength="48"></label>

    <label class="designField">Text Color<input id="d_textColor" type="color"></label>

    <label class="designField">Border Color<input id="d_borderColor" type="color"></label>
    <label class="designField">Border Radius (0–24 px)<input id="d_borderRadius" type="number" min="0" max="24"></label>
    <label class="designField">Product Image Size (56–160 px)<input id="d_productImageSize" type="number" min="56" max="160"></label>
    <label class="designField">Product Card Padding (3–24 px)<input id="d_cardPadding" type="number" min="3" max="24"></label>
    <label class="designField">Desktop Catalogue Width (480–1400 px)<input id="d_desktopContentWidth" type="number" min="480" max="1400"></label>

    <button class="green" type="button" onclick="saveDesignDraft()">SAVE DRAFT</button>

<div id="editor"></div>
<hr>
<div id="items"></div>

<span>Password Protection:</span>
<span id="protectionState" class="stateOff">OFF</span>
<button id="toggleBtn" class="dark" onclick="togglePublicProtection()">TOGGLE ON/OFF</button>
</div>

<input id="newPubPw" type="password" placeholder="New Public Password">
<input id="confirmPubPw" type="password" placeholder="Confirm Public Password">

<button class="green" onclick="changePublicPassword()">
CHANGE PUBLIC PASSWORD
</button>

</div>

  <script>

let token = '';
let data = [];

function showStatus(message,type='normal'){

    const status=document.getElementById('status');

    status.style.display='block';
    status.textContent=message;

    if(type==='error'){
        status.style.background='#fee2e2';
        status.style.color='#991b1b';
    }else{
        status.style.background='#e0f2fe';
        status.style.color='#075985';
    }
}


/* =========================
   LOGIN
========================= */

function showLoginError(message){
    const error=document.getElementById('loginError');
    error.textContent=message;
    error.style.display='block';
}

async function login(){
    const passwordInput=document.getElementById('p');
    const loginBox=document.getElementById('login');
    const appBox=document.getElementById('app');
    const loginBtn=document.getElementById('loginBtn');
    const password=passwordInput.value.trim();
    const error=document.getElementById('loginError');

    error.textContent='';
    error.style.display='none';

    if(!password){
        showLoginError('Please enter admin password.');
        passwordInput.focus();
        return;
    }

    loginBtn.disabled=true;
    loginBtn.textContent='PLEASE WAIT...';

    try{
        const response=await fetch('/api/login',{
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body:JSON.stringify({password:password})
        });
        const result=await response.json().catch(()=>({}));

        if(!response.ok){
            showLoginError(result.error||result.message||'Incorrect Password');
            passwordInput.value='';
            passwordInput.focus();
            return;
        }

        if(!result.token){
            showLoginError('Login token was not received. Please try again.');
            return;
        }

        token=result.token;
        loginBox.style.display='none';
        appBox.style.display='block';
        showStatus('Login successful. Loading products...');

        await load();
        await loadPublicSettings();
        await loadDesignFromServer();

    }catch(error){
        console.error('LOGIN ERROR:',error);
        showLoginError('Connection error. Please try again.');
    }finally{
        loginBtn.disabled=false;
        loginBtn.textContent='ENTER';
    }
}

// Allow the Enter key to submit the admin password.
document.getElementById('p').addEventListener('keydown',function(event){
    if(event.key==='Enter'){
        event.preventDefault();
        login();
    }
});


/* =========================
   LOAD PRODUCTS
========================= */

async function load(){

    console.log(
        'LOADING PRODUCTS: GET /api/products'
    );

    try{

        const response=await fetch('/api/products',{headers:{'Authorization':'Bearer '+token}});

        console.log(
            'Products response:',
            response.status
        );

        if(!response.ok){

            throw new Error(
                'Products API returned status '+
                response.status
            );
        }

        const result=await response.json();

        console.log(
            'Products received:',
            result
        );

        if(!Array.isArray(result)){

            console.error(
                'Invalid products response:',
                result
            );

            throw new Error(
                'Products data is not an array.'
            );
        }

        data=result;

        renderItems();

        showStatus(
            'Products loaded successfully.'
        );

        setTimeout(()=>{

            const status=
                document.getElementById('status');

            if(status){
                status.style.display='none';
            }

        },2000);

    }catch(error){

        console.error(
            'LOAD PRODUCTS ERROR:',
            error
        );

        showStatus(
            'Products load نہیں ہو سکے: '+
            error.message,
            'error'
        );

        document.getElementById('items').innerHTML=
            '<p>Products load نہیں ہو سکے۔ Console/Logs check کریں۔';
    }
}


/* =========================
   RENDER PRODUCTS
========================= */

function renderItems(){

    const items=document.getElementById('items');

    if(!data.length){

        items.innerHTML=
            '<p>No products found.</p>';

        return;
    }

    items.innerHTML=data.map((x,i)=>`

        <div class="row">

            <b>${escapeHtml(x.name || '')}</b>

            <br>

            ${escapeHtml(x.category || '')}

            <br>

            <button
                class="dark"
                onclick="edit(${i})">
                EDIT
            </button>

            <button
                class="red"
                onclick="del(${x.id})">
                DELETE
            </button>

        </div>

    `).join('');
}


/* =========================
   EDIT / NEW ITEM
========================= */

function edit(i){

    console.log(
        'EDIT FUNCTION CALLED. INDEX:',
        i
    );

    const editor=
        document.getElementById('editor');

    let x;

    if(i<0){

        console.log(
            'Creating NEW product'
        );

        x={
            name:'',
            category:'ACCESSORIES',
            optionTitle:'SIZE',
            img:'',
            variants:[
                {
                    label:'STANDARD',
                    code:'',
                    img:''
                }
            ]
        };

    }else{

        console.log(
            'Editing existing product:',
            data[i]
        );

        x=data[i];
    }

    const variants=
        Array.isArray(x.variants)
        ? x.variants
        : [];

    editor.innerHTML=`

        <div class="row">

            <input
                id="en"
                placeholder="Item name"
                value="${escapeAttr(x.name || '')}">

            <input
                id="ec"
                placeholder="Category"
                value="${escapeAttr(x.category || '')}">

            <input
                id="eo"
                placeholder="Option title"
                value="${escapeAttr(x.optionTitle || 'SIZE')}">

            <input
                id="ei"
                placeholder="Image URL"
                value="${escapeAttr(x.img || '')}">

            <div id="vs">

                ${variants.map(v=>variant(v)).join('')}

            </div>

            <button onclick="addv()">
                ＋ VARIANT
            </button>

            <button
                class="green"
                onclick="save(${i})">
                SAVE
            </button>

            <button
                class="dark"
                onclick="cancelEdit()">
                CANCEL
            </button>

        </div>
    `;
}


/* =========================
   VARIANT
========================= */

function variant(v={}){

    return `

        <div class="row">

            <input
                class="vl"
                placeholder="Size / Color / Type"
                value="${escapeAttr(v.label || '')}">

            <input
                class="vc"
                placeholder="Code"
                value="${escapeAttr(v.code || '')}">

            <input
                class="vi"
                placeholder="Image URL"
                value="${escapeAttr(v.img || '')}">

            <button
                class="red"
                onclick="this.parentElement.remove()">
                REMOVE
            </button>

        </div>
    `;
}


/* =========================
   ADD VARIANT
========================= */

function addv(){

    console.log(
        'ADD VARIANT BUTTON CLICKED'
    );

    const vs=document.getElementById('vs');

    vs.insertAdjacentHTML(
        'beforeend',
        variant()
    );
}


/* =========================
   CANCEL
========================= */

function cancelEdit(){

    console.log(
        'CANCEL EDIT'
    );

    document.getElementById(
        'editor'
    ).innerHTML='';
}


/* =========================
   SAVE PRODUCT
========================= */

async function save(i){

    try{

        if(!token){

            alert(
                'Login session missing. Please login again.'
            );

            return;
        }


        const nameElement=
            document.getElementById('en');

        const categoryElement=
            document.getElementById('ec');

        const optionElement=
            document.getElementById('eo');

        const imageElement=
            document.getElementById('ei');


        if(
            !nameElement ||
            !categoryElement ||
            !optionElement ||
            !imageElement
        ){

            throw new Error(
                'Product form fields not found.'
            );
        }


        const name=
            nameElement.value.trim();

        const category=
            categoryElement.value.trim();

        const optionTitle=
            optionElement.value.trim() ||
            'SIZE';

        const img=
            imageElement.value.trim();


        if(!name){

            alert(
                'Please enter item name.'
            );

            return;
        }


        const variantRows=
            document.querySelectorAll(
                '#vs .row'
            );


        const product={

            name:name,

            category:category,

            optionTitle:optionTitle,

            img:img,

            variants:[
                ...variantRows
            ]
            .map(row=>{

                const inputs=
                    row.querySelectorAll(
                        'input'
                    );

                return{

                    label:
                        inputs[0]
                        ? inputs[0].value.trim()
                        : '',

                    size:
                        inputs[0]
                        ? inputs[0].value.trim()
                        : '',

                    code:
                        inputs[1]
                        ? inputs[1].value.trim()
                        : '',

                    img:
                        inputs[2]
                        ? inputs[2].value.trim()
                        : ''

                };

            })
            .filter(x=>x.label)
        };


        const url=i<0
            ? '/api/products'
            : '/api/products/'+data[i].id;


        const method=
            i<0
            ? 'POST'
            : 'PUT';


        const response=
            await fetch(
                url,
                {

                    method:method,

                    headers:{

                        'Content-Type':
                            'application/json',

                        'Authorization':
                            'Bearer '+token

                    },

                    body:
                        JSON.stringify(product)

                }
            );


        const result=
            await response
            .json()
            .catch(()=>({}));


        if(!response.ok){

            throw new Error(

                result.error ||
                result.message ||
                'Save failed'

            );
        }


        alert(
            'Product saved successfully.'
        );


        document.getElementById(
            'editor'
        ).innerHTML='';


        await load();


    }catch(error){

        console.error(
            'SAVE ERROR:',
            error
        );

        alert(
            'Product save نہیں ہوا: '+
            error.message
        );
    }
}


/* =========================
   DELETE PRODUCT
========================= */

async function del(id){

    if(!confirm('Delete item?')){

        return;
    }


    try{

        if(!token){

            alert(
                'Login session missing. Please login again.'
            );

            return;
        }


        const url=
            '/api/products/'+id;


        const response=
            await fetch(
                url,
                {

                    method:'DELETE',

                    headers:{

                        'Authorization':
                            'Bearer '+token

                    }

                }
            );


        const result=
            await response
            .json()
            .catch(()=>({}));


        if(!response.ok){

            throw new Error(

                result.error ||
                result.message ||
                'Delete failed'

            );
        }


        alert(
            'Product deleted successfully.'
        );


        await load();


    }catch(error){

        console.error(
            'DELETE ERROR:',
            error
        );

        alert(
            'Product delete نہیں ہوا: '+
            error.message
        );
    }
}


/* =========================
   PUBLIC WEBSITE PASSWORD (ADMIN SECTION)
========================= */

function showPubMsg(message,type='normal'){

    const el=document.getElementById('pubMsg');

    el.style.display='block';
    el.textContent=message;

    if(type==='error'){
        el.style.background='#fee2e2';
        el.style.color='#991b1b';
    }else{
        el.style.background='#dcfce7';
        el.style.color='#166534';
    }
}

let currentProtectionOn=false;

async function loadPublicSettings(){

    try{

        const response=await fetch('/api/admin/public-settings',{
            headers:{
                'Authorization':'Bearer '+token
            }
        });

        if(!response.ok){
            throw new Error('Failed to load public settings');
        }

        const result=await response.json();

        currentProtectionOn=!!result.protectionOn;

        updateProtectionStateUI();

    }catch(error){

        console.error('LOAD PUBLIC SETTINGS ERROR:', error);
    }
}

function updateProtectionStateUI(){

    const stateEl=document.getElementById('protectionState');

    if(currentProtectionOn){
        stateEl.textContent='ON';
        stateEl.className='stateOn';
    }else{
        stateEl.textContent='OFF';
        stateEl.className='stateOff';
    }
}

async function togglePublicProtection(){

    try{

        const response=await fetch('/api/admin/public-settings/toggle',{

            method:'POST',

            headers:{
                'Content-Type':'application/json',
                'Authorization':'Bearer '+token
            },

            body:JSON.stringify({
                on: !currentProtectionOn
            })

        });

        const result=await response.json().catch(()=>({}));

        if(!response.ok){
            throw new Error(result.error || 'Toggle failed');
        }

        currentProtectionOn=!!result.protectionOn;

        updateProtectionStateUI();

        showPubMsg(
            'Public password protection is now '+
            (currentProtectionOn ? 'ON' : 'OFF') + '.'
        );

    }catch(error){

        console.error('TOGGLE ERROR:', error);

        showPubMsg('Toggle failed: '+error.message,'error');
    }

}

async function changePublicPassword(){

    const newPw=document.getElementById('newPubPw').value;
    const confirmPw=document.getElementById('confirmPubPw').value;

    if(!newPw || !confirmPw){

        showPubMsg('Passwords cannot be empty.','error');

        return;
    }

    if(newPw !== confirmPw){

        showPubMsg('Passwords do not match.','error');

        return;
    }

    try{

        const response=await fetch('/api/admin/public-settings/change-password',{

            method:'POST',

            headers:{
                'Content-Type':'application/json',
                'Authorization':'Bearer '+token
            },

            body:JSON.stringify({
                newPassword:newPw,
                confirmPassword:confirmPw
            })

        });

        const result=await response.json().catch(()=>({}));

        if(!response.ok){
            throw new Error(result.error || 'Password change failed');
        }

        document.getElementById('newPubPw').value='';
        document.getElementById('confirmPubPw').value='';

        showPubMsg('Public website password updated successfully.');

    }catch(error){

        console.error('CHANGE PUBLIC PASSWORD ERROR:', error);

        showPubMsg('Password change failed: '+error.message,'error');
    }

}



/* ================= CATALOGUE DESIGN EDITOR ================= */
const DESIGN_DEFAULTS={siteTitle:'BIN AMEEN',pageBg:'#c8d3df',headerBg:'#ffffff',primaryColor:'#1f293d',textColor:'#1f293d',cardBg:'#ffffff',borderColor:'#8fa0b5',borderRadius:0,productImageSize:92,cardPadding:7,desktopContentWidth:900,desktopColumns:2};
let designDraft={...DESIGN_DEFAULTS};
let previewDevice='mobile';
function designMessage(message,isError=false){
  const el=document.getElementById('designStatus'); if(!el)return;
  el.style.display='block';el.textContent=message;
  el.style.background=isError?'#fee2e2':'#e0f2fe';el.style.color=isError?'#991b1b':'#075985';
}
function readDesignForm(){
  const value={};
  Object.keys(DESIGN_DEFAULTS).forEach(key=>{
    const el=document.getElementById('d_'+key); if(!el)return;
    value[key]=['borderRadius','productImageSize','cardPadding','desktopContentWidth','desktopColumns'].includes(key)?Number(el.value):el.value;
  });
  return value;
}
function fillDesignForm(value){
  designDraft={...DESIGN_DEFAULTS,...(value||{})};
  Object.keys(DESIGN_DEFAULTS).forEach(key=>{const el=document.getElementById('d_'+key);if(el)el.value=designDraft[key];});
  renderDesignPreview();
}
function safePreviewText(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function renderDesignPreview(){
  designDraft=readDesignForm();
  const p=data.slice(0,5);
  const cards=p.map(x=>`<article class="card"><div class="pic">${x.img?`<img src="${safePreviewText(x.img)}">`:'<span>IMAGE</span>'}</div><div class="info"><span class="code">${safePreviewText((x.variants&&x.variants[0]&&x.variants[0].code)||'ITEM CODE')}</span><b class="name">${safePreviewText(x.name||'PRODUCT NAME')}</b><span class="variantText">${safePreviewText((x.variants&&x.variants[0]&&x.variants[0].label)||'SIZE / TYPE')}</span></div></article>`).join('');
  const d=designDraft;
  const html=`<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;padding:7px;background:${d.pageBg};font-family:Arial;color:${d.textColor}}.wrap{width:100%;max-width:${previewDevice==='mobile'?'480px':d.desktopContentWidth+'px'};margin:auto}#products{display:grid;grid-template-columns:repeat(${previewDevice==='mobile'?1:d.desktopColumns},minmax(0,1fr));gap:8px}header{background:${d.headerBg};border:2px solid ${d.borderColor};padding:8px;text-align:center;border-radius:${d.borderRadius}px;margin-bottom:8px}.logo{font-size:23px;font-weight:900;padding:6px}.phone{display:inline-block;border:2px solid ${d.borderColor};padding:4px 12px;font-weight:bold;margin-top:8px}.cats{display:flex;gap:5px;margin:8px 0;overflow:hidden}.cats span{background:#fff;border:2px solid ${d.borderColor};padding:7px 10px;font-size:12px;white-space:nowrap}.cats span:first-child{background:${d.primaryColor};color:white;border-color:${d.primaryColor}}.search{background:white;border:2px solid ${d.borderColor};padding:10px;margin-bottom:8px}.card{background:${d.cardBg};border:2px solid ${d.borderColor};border-radius:${d.borderRadius}px;padding:${d.cardPadding}px;margin-bottom:8px;display:flex;gap:9px;align-items:center}.pic{width:${d.productImageSize}px;height:${d.productImageSize}px;flex:none;border:1px solid ${d.borderColor};background:white;display:flex;align-items:center;justify-content:center;overflow:hidden}.pic img{width:100%;height:100%;object-fit:contain}.code{font-size:11px;background:#f1f5f9;padding:3px 5px;border:1px solid ${d.borderColor}}.name{display:block;font-size:14px;margin-top:5px}.variantText{display:block;font-size:12px;margin-top:4px;color:#475569}.main{background:${d.primaryColor};color:#fff;border:0;padding:11px;width:100%;font-weight:bold;margin-top:5px}</style></head><body><div class="wrap"><header><div class="logo">${safePreviewText(d.siteTitle||'BIN AMEEN')}</div><div class="phone">BIN AMEEN</div></header><div class="cats"><span>ALL</span><span>ACCESSORIES</span><span>FACE WASH</span><span>HAIR OIL</span></div><div class="search">SEARCH PRODUCTS</div><div id="products">${cards||'<article class="card">Sample Product Preview</article>'}</div><button class="main">VIEW CART / WHATSAPP ORDER</button></div></body></html>`;
  const frame=document.getElementById('designPreview');if(frame){frame.style.width=previewDevice==='mobile'?'100%':Math.max(480,Math.min(1400,Number(d.desktopContentWidth)||900))+'px';frame.srcdoc=html;}
  const label=document.getElementById('previewDeviceLabel');if(label)label.textContent=previewDevice.toUpperCase();
}
function setPreviewDevice(device){previewDevice=device;renderDesignPreview();}
async function loadDesignFromServer(){
  try{
    const response=await fetch('/api/admin/design',{headers:{'Authorization':'Bearer '+token}});
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.error||'Could not load design settings');
    fillDesignForm(result.draft||DESIGN_DEFAULTS);
    designMessage('Saved draft loaded.');
  }catch(error){designMessage('Design load failed: '+error.message,true);}
}
async function saveDesignDraft(){
  try{
    const draft=readDesignForm();
    const response=await fetch('/api/admin/design/draft',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(draft)});
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.error||'Save draft failed');
    fillDesignForm(result.draft||draft);designMessage('Draft saved. Public website is unchanged until you publish.');
  }catch(error){designMessage('Draft save failed: '+error.message,true);}
}
async function publishDesign(){
  if(!confirm('Publish this design to the public Catalogue?'))return;
  try{
    const draft=readDesignForm();
    const saveResponse=await fetch('/api/admin/design/draft',{method:'PUT',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(draft)});
    const saveResult=await saveResponse.json().catch(()=>({}));
    if(!saveResponse.ok)throw new Error(saveResult.error||'Could not save current draft before publishing');
    const response=await fetch('/api/admin/design/publish',{method:'POST',headers:{'Authorization':'Bearer '+token}});
    const result=await response.json().catch(()=>({}));
    if(!response.ok)throw new Error(result.error||'Publish failed');
    fillDesignForm(result.published||designDraft);designMessage('Published successfully. Public Catalogue will use this design.');
  }catch(error){designMessage('Publish failed: '+error.message,true);}
}
document.addEventListener('input',function(event){if(event.target&&event.target.id&&event.target.id.startsWith('d_'))renderDesignPreview();});
document.getElementById('designPanel').addEventListener('toggle',function(){if(this.open)renderDesignPreview();});

/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(value){

    return String(value)

        .replace(
            /&/g,
            '&amp;'
        )

        .replace(
            /</g,
            '&lt;'
        )

        .replace(
            />/g,
            '&gt;'
        )

        .replace(
            /"/g,
            '&quot;'
        )

        .replace(
            /'/g,
            '&#039;'
        );
}


function escapeAttr(value){

    return escapeHtml(value);
}
