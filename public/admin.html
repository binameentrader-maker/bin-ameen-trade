<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BIN AMEEN ADMIN</title>
<style>body{font-family:Arial;background:#c8d3df;padding:12px}.box{max-width:650px;margin:auto;background:#fff;padding:16px;border-radius:12px}input{width:100%;padding:9px;margin:4px 0;box-sizing:border-box}button{padding:9px;margin:3px;border:0;border-radius:6px;font-weight:bold}.green{background:#16a34a;color:#fff}.dark{background:#1f293d;color:#fff}.red{background:#dc2626;color:#fff}.row{border:1px solid #8fa0b5;border-radius:7px;padding:10px;margin:8px 0}</style></head><body><div class=box>
<h2>BIN AMEEN TRADER — ADMIN</h2><div id=login><input id=p type=password placeholder="Admin password"><button class=dark onclick=login()>LOGIN</button></div>
<div id=app style="display:none"><button class=green onclick="edit(-1)">＋ NEW ITEM</button><div id=editor></div><hr><div id=items></div></div></div>
<script>
let token='',data=[];
async function login(){let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});if(!r.ok)return alert('Wrong password');token=(await r.json()).token;login.style.display='none';app.style.display='block';load()}
async function load(){data=await fetch('/api/products').then(r=>r.json());items.innerHTML=data.map((x,i)=>`<div class=row><b>${x.name}</b><br>${x.category}<br><button class=dark onclick="edit(${i})">EDIT</button><button class=red onclick="del(${x.id})">DELETE</button></div>`).join('')}
function edit(i){let x=i<0?{name:'',category:'ACCESSORIES',optionTitle:'SIZE',img:'',variants:[{label:'STANDARD',code:'',img:''}]}:data[i];editor.innerHTML=`<div class=row><input id=en placeholder="Item name" value="${x.name}"><input id=ec placeholder="Category" value="${x.category}"><input id=eo placeholder="Option title" value="${x.optionTitle||'SIZE'}"><input id=ei placeholder="Image URL" value="${x.img||''}"><div id=vs>${x.variants.map(v=>variant(v)).join('')}</div><button onclick="addv()">＋ VARIANT</button><button class=green onclick="save(${i})">SAVE</button></div>`}
function variant(v={label:'',code:'',img:''}){return `<div class=row><input class=vl placeholder="Size / Color / Type" value="${v.label||''}"><input class=vc placeholder="Code" value="${v.code||''}"><input class=vi placeholder="Image URL" value="${v.img||''}"><button class=red onclick="this.parentElement.remove()">REMOVE</button></div>`}
function addv(){vs.insertAdjacentHTML('beforeend',variant())}
async function save(i){let p={name:en.value,category:ec.value,optionTitle:eo.value||'SIZE',img:ei.value,variants:[...document.querySelectorAll('#vs .row')].map(r=>{let a=r.querySelectorAll('input');return{label:a[0].value,size:a[0].value,code:a[1].value,img:a[2].value}}).filter(x=>x.label)};let u=i<0?'/api/products':'/api/products/'+data[i].id;await fetch(u,{method:i<0?'POST':'PUT',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(p)});editor.innerHTML='';load()}
async function del(id){if(confirm('Delete item?')){await fetch('/api/products/'+id,{method:'DELETE',headers:{Authorization:'Bearer '+token}});load()}}
</script></body></html>
