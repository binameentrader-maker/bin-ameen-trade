<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIN AMEEN TRADER</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#c8d3df;
font-family:Arial,Helvetica,sans-serif;
color:#1f293d;
}

body{padding:7px}

.wrap{max-width:480px;margin:auto}

header{
background:#fff;
border:2px solid #8fa0b5;
padding:8px;
margin-bottom:8px;
text-align:center;
}

.logoBox{
border:2px solid #8fa0b5;
padding:6px 4px;
font-size:23px;
font-weight:900;
}

.phoneRow{
display:flex;
align-items:center;
justify-content:center;
margin-top:10px;
position:relative;
}

.phoneLine{
height:2px;
background:#9aa7b9;
position:absolute;
left:35px;
right:35px;
top:50%;
}

.phoneBox{
position:relative;
background:#fff;
border:2px solid #8fa0b5;
padding:4px 12px;
font-size:15px;
font-weight:bold;
z-index:1;
}

button{
border:0;
border-radius:0;
padding:7px;
font-weight:bold;
cursor:pointer;
}

.main{
background:#1f293d!important;
color:#fff;
padding:11px;
font-size:16px;
font-weight:bold;
}

.cats{
display:flex;
gap:5px;
overflow:auto;
margin:8px 0;
}

.cats button{
background:#fff;
border:2px solid #8fa0b5;
white-space:nowrap;
font-size:13px;
padding:7px 12px;
}

.cats button.active{
background:#1f293d;
color:#fff;
}

.search{
width:100%;
padding:10px;
border:2px solid #8fa0b5;
font-size:14px;
margin-bottom:8px;
outline:none;
background:#fff;
}

.card{
background:#fff;
border:2px solid #8fa0b5;
padding:7px;
margin-bottom:8px;
display:flex;
gap:9px;
align-items:center;
}

.pic{
width:92px;
height:92px;
border:1px solid #8fa0b5;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
position:relative;
overflow:hidden;
background:#fff;
cursor:pointer;
}

.pic img{
width:100%;
height:100%;
object-fit:contain;
pointer-events:none;
}

.pic:after{
content:"BIN AMEEN";
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:11px;
font-weight:bold;
color:rgba(31,41,61,.15);
pointer-events:none;
}

.info{
flex:1;
min-width:0;
}

.code{
display:inline-block;
font-size:11px;
font-weight:bold;
background:#f1f5f9;
border:1px solid #8fa0b5;
padding:3px 5px;
color:#475569;
}

.name{
display:block;
font-size:14px;
font-weight:900;
margin-top:4px;
line-height:1.15;
}

.twoVariant{
display:flex;
gap:5px;
flex-wrap:wrap;
margin:5px 0;
}

.variantBtn{
background:#fff;
border:2px solid #8fa0b5;
color:#475569;
font-size:12px;
padding:5px 9px;
}

.variantBtn.selected{
background:#1f293d;
color:#fff;
}

.variantRow{
display:flex;
align-items:center;
gap:4px;
margin:5px 0;
}

.arrowBtn{
background:#475569;
color:#fff;
font-size:17px;
width:34px;
height:31px;
padding:0;
}

.variantLabel{
flex:1;
text-align:center;
font-size:12px;
font-weight:bold;
background:#f8fafc;
border:2px solid #8fa0b5;
padding:6px 3px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.q{
display:flex;
gap:4px;
align-items:center;
}

.q button{
background:#475569;
color:#fff;
font-size:17px;
width:32px;
height:30px;
padding:0;
}

.qtyBox{
min-width:40px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border:2px solid #8fa0b5;
font-size:15px;
}

.cartOverlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:9000;
padding:8px;
align-items:center;
justify-content:center;
}

.cartOverlay.open{
display:flex;
}

.cartbox{
width:min(100%,470px);
max-height:90vh;
overflow:auto;
background:#fff;
border:2px solid #8fa0b5;
padding:10px;
}

.cartHeader{
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #d1d5db;
padding-bottom:7px;
margin-bottom:7px;
}

.cartHeader h3{
margin:0;
font-size:18px;
}

.cartClose{
background:#475569;
color:#fff;
width:35px;
height:35px;
font-size:18px;
padding:0;
}

.item{
padding:8px;
border:1px solid #8fa0b5;
margin:5px 0;
background:#f8fafc;
}

.itemName{
font-weight:bold;
font-size:14px;
}

.itemInfo{
font-size:12px;
margin-top:4px;
}

.cartControls{
display:flex;
gap:5px;
align-items:center;
margin-top:7px;
}

.cartControls button{
background:#475569;
color:#fff;
padding:6px 10px;
}

.removeBtn{
margin-left:auto;
background:#9b2226!important;
}

.total{
font-weight:bold;
margin:10px 0;
padding-top:7px;
border-top:1px solid #d1d5db;
}

/* ================= PRODUCT VIEWER ================= */

.viewer{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.88);
z-index:99999;
align-items:center;
justify-content:center;
padding:8px;
}

.viewer.open{
display:flex;
}

.viewerBox{
position:relative;
width:min(100%,470px);
height:94vh;
background:#fff;
border:2px solid #8fa0b5;
padding:10px;
display:flex;
flex-direction:column;
}

.viewerClose{
position:absolute;
right:6px;
top:6px;
width:38px;
height:38px;
background:#1f293d;
color:#fff;
font-size:20px;
z-index:5;
}

.viewerTitle{
padding:4px 42px 8px 4px;
font-size:16px;
font-weight:900;
line-height:1.2;
text-align:center;
min-height:45px;
}

.viewerImageArea{
position:relative;
flex:1;
min-height:0;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border:1px solid #8fa0b5;
overflow:hidden;
}

.viewerImageArea img{
max-width:100%;
max-height:100%;
width:100%;
height:100%;
object-fit:contain;
pointer-events:none;
}

.viewerWatermark{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:25px;
font-weight:bold;
color:rgba(31,41,61,.16);
white-space:nowrap;
pointer-events:none;
}

.viewerCode{
text-align:center;
font-size:13px;
font-weight:bold;
padding:7px 2px;
}

.viewerVariant{
text-align:center;
font-size:14px;
font-weight:bold;
padding:5px;
}

.viewerNav{
display:flex;
gap:6px;
margin-top:6px;
}

.viewerNav button{
flex:1;
height:42px;
font-size:18px;
background:#475569;
color:#fff;
}

.viewerAdd{
width:100%;
height:44px;
margin-top:6px;
background:#1f293d;
color:#fff;
font-size:16px;
}

.emailFooter{
background:#fff;
border:2px solid #8fa0b5;
padding:9px 5px;
margin-top:6px;
margin-bottom:7px;
text-align:center;
font-size:15px;
font-weight:bold;
color:#475569;
}

.loading{
text-align:center;
padding:15px;
background:#fff;
border:2px solid #8fa0b5;
font-size:14px;
}

.errorBox{
background:#fff;
border:2px solid #9b2226;
padding:14px;
font-size:13px;
line-height:20px;
word-break:break-word;
}

@media(max-width:420px){

body{padding:5px}

.logoBox{font-size:21px}

.card{
padding:6px;
gap:8px;
margin-bottom:7px;
}

.pic{
width:88px;
height:88px;
}

.name{font-size:13px}

.code{font-size:10px}

.variantBtn{
font-size:11px;
padding:5px 7px;
}

.viewerTitle{
font-size:15px;
}

.viewerWatermark{
font-size:21px;
}

}
</style>
</head>

<body>

<div class="wrap">

<header>

<div class="logoBox">
BIN AMEEN TRADER
</div>

<div class="phoneRow">

<div class="phoneLine"></div>

<div class="phoneBox">
☎ 03331390045
</div>

</div>

</header>

<button
class="main"
style="width:100%"
onclick="showCart()"
>
🛒 View Cart (<span id="count">0</span>)
</button>

<div class="cats" id="cats"></div>

<input
class="search"
id="search"
placeholder="Search product name or SKU code..."
autocomplete="off"
>

<div id="list">
<div class="loading">Loading products...</div>
</div>

<div class="emailFooter">
✉ binameentrader@gmail.com
</div>

</div>


<!-- CART -->

<div class="cartOverlay" id="cartOverlay">

<div class="cartbox">

<div class="cartHeader">

<h3>Your Selected Items</h3>

<button
class="cartClose"
onclick="closeCart()"
>
✕
</button>

</div>

<div id="cartItems"></div>

<div class="total">
Total Items: <span id="cartTotal">0</span>
</div>

<button
class="main"
style="width:100%"
onclick="wa()"
>
Send Order on WhatsApp
</button>

</div>
</div>


<!-- PRODUCT SELECTION VIEWER -->

<div class="viewer" id="viewer">

<div class="viewerBox">

<button
class="viewerClose"
onclick="closeViewer()"
>
✕
</button>

<div
class="viewerTitle"
id="viewerTitle"
>
</div>

<div class="viewerImageArea">

<img
id="viewerImg"
src=""
alt="Product"
draggable="false"
>

<div class="viewerWatermark">
BIN AMEEN TRADER
</div>

</div>

<div
class="viewerCode"
id="viewerCode"
>
</div>

<div
class="viewerVariant"
id="viewerVariant"
>
</div>

<div class="viewerNav">

<button onclick="viewerPrev()">
← Previous
</button>

<button onclick="viewerNext()">
Next →
</button>

</div>

<button
class="viewerAdd"
onclick="addViewerToCart()"
>
🛒 Add This Item to Cart
</button>

</div>
</div>


<script>

let products=[];
let sel={};
let cartData={};
let category="ALL";

/* VIEWER STATE */
let viewerProductIndex=0;
let viewerVariantIndex=0;

const catsEl=document.getElementById("cats");
const searchEl=document.getElementById("search");
const listEl=document.getElementById("list");

const cartOverlay=document.getElementById("cartOverlay");
const cartItemsEl=document.getElementById("cartItems");
const countEl=document.getElementById("count");
const cartTotalEl=document.getElementById("cartTotal");

const viewerEl=document.getElementById("viewer");
const viewerImgEl=document.getElementById("viewerImg");
const viewerTitleEl=document.getElementById("viewerTitle");
const viewerCodeEl=document.getElementById("viewerCode");
const viewerVariantEl=document.getElementById("viewerVariant");


/* ================= LOAD PRODUCTS ================= */

async function load(){

listEl.innerHTML=
'<div class="loading">Loading products...</div>';

try{

const response=await fetch(
"/api/products?_"+Date.now(),
{
method:"GET",
cache:"no-store"
}
);

const text=await response.text();

if(!response.ok){

throw new Error(
"API HTTP "+response.status+" — "+text.substring(0,300)
);

}

let data;

try{
data=JSON.parse(text);
}catch(e){
throw new Error(
"API نے JSON کے بجائے دوسرا جواب دیا۔"
);
}

if(!Array.isArray(data)){
throw new Error("Products data درست نہیں ہے۔");
}

products=data;

products.forEach(function(p){

if(!Array.isArray(p.variants)){

p.variants=[{
label:p.label||"",
code:p.code||"",
img:p.img||""
}];

}

sel[p.id]=0;

});

drawCats();
render();

}catch(error){

console.error(error);

listEl.innerHTML=
'<div class="errorBox">'+
'<b>Products Load Error</b><br><br>'+
escapeHTML(error.message)+
'</div>';

}

}


/* ================= ESCAPE ================= */

function escapeHTML(text){

const div=document.createElement("div");

div.textContent=text;

return div.innerHTML;

}


/* ================= CATEGORIES ================= */

function drawCats(){

const set=new Set();

products.forEach(function(p){

if(p.category){
set.add(p.category);
}

});

const categories=["ALL",...set];

catsEl.innerHTML="";

categories.forEach(function(x){

const btn=document.createElement("button");

btn.textContent=
x==="ALL"?"ALL ITEMS":x;

if(x===category){
btn.className="active";
}

btn.onclick=function(){

category=x;

drawCats();
render();

};

catsEl.appendChild(btn);

});

}


/* ================= RENDER ================= */

function render(){

const q=
searchEl.value.toLowerCase().trim();

const filtered=products.filter(function(p){

const name=
String(p.name||"").toLowerCase();

const variants=
Array.isArray(p.variants)
?p.variants:[];

const codeMatch=
variants.some(function(v){

return String(v.code||"")
.toLowerCase()
.includes(q);

});

return(
(category==="ALL"||p.category===category)
&&
(name.includes(q)||codeMatch)
);

});

listEl.innerHTML="";

if(!filtered.length){

listEl.innerHTML=
'<div class="card">No items found</div>';

return;

}

filtered.forEach(function(p){

if(!p.variants.length)return;

let index=sel[p.id]||0;

if(index>=p.variants.length){
index=0;
sel[p.id]=0;
}

const v=p.variants[index];

const key=p.id+"_"+index;

const quantity=
cartData[key]
?cartData[key].qty
:0;


/* CARD */

const card=document.createElement("div");

card.className="card";


/* IMAGE */

const pic=document.createElement("div");

pic.className="pic";

pic.onclick=function(){

/*
IMAGE پر click کرنے سے
PRODUCT VIEWER کھلے گا
*/

openProductViewer(p.id,index);

};


const img=document.createElement("img");

img.src=v.img||p.img||"";
img.alt=p.name||"";
img.draggable=false;

pic.appendChild(img);


/* INFO */

const info=document.createElement("div");

info.className="info";


const code=document.createElement("span");

code.className="code";

code.textContent=
"CODE: "+(v.code||"");


const name=document.createElement("b");

name.className="name";

name.textContent=p.name||"";


/* VARIANTS */

const variantArea=document.createElement("div");

if(p.variants.length===2){

variantArea.className="twoVariant";

p.variants.forEach(function(item,j){

const btn=document.createElement("button");

btn.className="variantBtn";

if(j===index){
btn.classList.add("selected");
}

btn.textContent=item.label||"";

btn.onclick=function(e){

e.stopPropagation();

sel[p.id]=j;

render();

};

variantArea.appendChild(btn);

});

}else{

variantArea.className="variantRow";

const left=document.createElement("button");

left.className="arrowBtn";
left.textContent="‹";

left.onclick=function(e){

e.stopPropagation();

prevVariant(p.id);

};

const label=document.createElement("div");

label.className="variantLabel";

label.textContent=v.label||"";

const right=document.createElement("button");

right.className="arrowBtn";
right.textContent="›";

right.onclick=function(e){

e.stopPropagation();

nextVariant(p.id);

};

variantArea.appendChild(left);
variantArea.appendChild(label);
variantArea.appendChild(right);

}


/* QUANTITY */

const qbox=document.createElement("div");

qbox.className="q";

const minus=document.createElement("button");

minus.textContent="−";

minus.onclick=function(e){

e.stopPropagation();

change(p.id,-1);

};

const qty=document.createElement("div");

qty.className="qtyBox";

qty.textContent=quantity;

const plus=document.createElement("button");

plus.textContent="+";

plus.onclick=function(e){

e.stopPropagation();

change(p.id,1);

};

qbox.appendChild(minus);
qbox.appendChild(qty);
qbox.appendChild(plus);

info.appendChild(code);
info.appendChild(name);
info.appendChild(variantArea);
info.appendChild(qbox);

card.appendChild(pic);
card.appendChild(info);

listEl.appendChild(card);

});

}


/* ================= NORMAL VARIANTS ================= */

function prevVariant(id){

const p=products.find(x=>String(x.id)===String(id));

if(!p)return;

let i=sel[p.id]||0;

i--;

if(i<0){
i=p.variants.length-1;
}

sel[p.id]=i;

render();

}

function nextVariant(id){

const p=products.find(x=>String(x.id)===String(id));

if(!p)return;

let i=sel[p.id]||0;

i++;

if(i>=p.variants.length){
i=0;
}

sel[p.id]=i;

render();

}


/* ================= PRODUCT VIEWER ================= */

/*
یہ اصل selection system ہے۔
Image پر click کرنے سے یہی کھلے گا۔
*/

function openProductViewer(productId,variantIndex){

const index=
products.findIndex(function(p){
return String(p.id)===String(productId);
});

if(index<0)return;

viewerProductIndex=index;
viewerVariantIndex=variantIndex||0;

showViewerProduct();

viewerEl.classList.add("open");

document.body.style.overflow="hidden";

}


function showViewerProduct(){

const p=products[viewerProductIndex];

if(!p)return;

if(!Array.isArray(p.variants)||
!p.variants.length)return;

if(viewerVariantIndex<0){
viewerVariantIndex=p.variants.length-1;
}

if(viewerVariantIndex>=p.variants.length){
viewerVariantIndex=0;
}

const v=p.variants[viewerVariantIndex];


/* FULL PRODUCT NAME */

viewerTitleEl.textContent=
p.name||"";


/* IMAGE */

viewerImgEl.src=
v.img||p.img||"";


/* CODE */

viewerCodeEl.textContent=
v.code
?"CODE: "+v.code
:"";


/* VARIANT */

viewerVariantEl.textContent=
v.label
?v.label
:"";


}


/* ================= VIEWER NEXT ================= */

function viewerNext(){

if(!products.length)return;

const p=products[viewerProductIndex];

if(!p)return;

/*
اگر اسی product کے variants ہیں
تو پہلے اگلا variant
*/

if(
Array.isArray(p.variants) &&
viewerVariantIndex<p.variants.length-1
){

viewerVariantIndex++;

showViewerProduct();

return;

}


/*
ورنہ اگلا PRODUCT
*/

viewerProductIndex++;

if(viewerProductIndex>=products.length){
viewerProductIndex=0;
}

viewerVariantIndex=0;

showViewerProduct();

}


/* ================= VIEWER PREVIOUS ================= */

function viewerPrev(){

if(!products.length)return;

const p=products[viewerProductIndex];

if(!p)return;

/*
اگر پہلے variant موجود ہے
*/

if(viewerVariantIndex>0){

viewerVariantIndex--;

showViewerProduct();

return;

}


/*
ورنہ پچھلا PRODUCT
*/

viewerProductIndex--;

if(viewerProductIndex<0){
viewerProductIndex=products.length-1;
}

const previous=products[viewerProductIndex];

viewerVariantIndex=
previous.variants.length-1;

showViewerProduct();

}


/* ================= ADD VIEWER ITEM TO CART ================= */

function addViewerToCart(){

const p=products[viewerProductIndex];

if(!p)return;

const v=p.variants[viewerVariantIndex];

if(!v)return;

const key=
p.id+"_"+viewerVariantIndex;

if(cartData[key]){

cartData[key].qty++;

}else{

cartData[key]={
name:p.name||"",
variant:v.label||"",
code:v.code||"",
img:v.img||p.img||"",
qty:1
};

}

updateCartCount();

/*
اسی selected variant کو main page پر بھی select کر دیں
*/

sel[p.id]=viewerVariantIndex;

showAddedMessage();

render();

}


/* ================= ADDED MESSAGE ================= */

function showAddedMessage(){

const btn=
document.querySelector(".viewerAdd");

if(!btn)return;

const old=btn.textContent;

btn.textContent="✓ Added to Cart";

btn.style.background="#475569";

setTimeout(function(){

btn.textContent=old;

btn.style.background="";

},1000);

}


/* ================= CLOSE VIEWER ================= */

function closeViewer(){

viewerEl.classList.remove("open");

viewerImgEl.src="";

document.body.style.overflow="";

}


/* ================= VIEWER OUTSIDE CLICK ================= */

viewerEl.addEventListener(
"click",
function(e){

if(e.target===viewerEl){
closeViewer();
}

});


/* ================= QUANTITY ================= */

function change(id,d){

const p=
products.find(x=>String(x.id)===String(id));

if(!p)return;

const index=sel[p.id]||0;

const v=p.variants[index];

const key=p.id+"_"+index;

const newQty=
(cartData[key]?.qty||0)+d;

if(newQty<=0){

delete cartData[key];

}else{

cartData[key]={
name:p.name||"",
variant:v.label||"",
code:v.code||"",
img:v.img||p.img||"",
qty:newQty
};

}

updateCartCount();
render();

if(cartOverlay.classList.contains("open")){
renderCart();
}

}


/* ================= CART COUNT ================= */

function updateCartCount(){

const total=
Object.values(cartData).reduce(
function(sum,item){
return sum+Number(item.qty||0);
},0);

countEl.textContent=total;
cartTotalEl.textContent=total;

}


/* ================= CART ================= */

function showCart(){

renderCart();

cartOverlay.classList.add("open");

document.body.style.overflow="hidden";

}

function closeCart(){

cartOverlay.classList.remove("open");

document.body.style.overflow="";

}


function renderCart(){

const keys=
Object.keys(cartData);

if(!keys.length){

cartItemsEl.innerHTML=
