<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BIN AMEEN TRADER</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#c8d3df;
font-family:Arial,sans-serif;
color:#1f293d;
padding:12px
}

.wrap{
max-width:480px;
margin:auto
}

header,.card{
background:#fff;
border:2px solid #8fa0b5;
border-radius:12px;
padding:12px;
margin-bottom:12px
}

h2{
text-align:center;
margin:4px
}

.cats{
display:flex;
gap:6px;
overflow:auto;
margin:10px 0
}

.cats button,button{
border:0;
border-radius:7px;
padding:9px;
font-weight:bold;
cursor:pointer
}

.cats button{
background:#fff;
border:1px solid #8fa0b5;
white-space:nowrap
}

.active,.main{
background:#1f293d!important;
color:#fff
}

.search{
width:100%;
padding:10px;
border:2px solid #8fa0b5;
border-radius:8px;
margin-bottom:12px
}

.card{
display:flex;
gap:10px;
align-items:center
}

.pic{
width:90px;
height:90px;
border:1px solid #8fa0b5;
border-radius:7px;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
position:relative;
overflow:hidden;
background:#fff;
cursor:pointer;
-webkit-user-select:none;
user-select:none
}

.pic img{
max-width:100%;
max-height:100%;
object-fit:contain;
pointer-events:none;
-webkit-user-drag:none
}

.info{
flex:1;
min-width:0
}

.code,.v{
font-size:12px;
font-weight:bold;
background:#f1f5f9;
padding:4px 7px;
border-radius:5px
}

.name{
display:block;
margin-top:5px
}

.variantRow{
display:flex;
align-items:center;
gap:4px;
margin:6px 0
}

.variantRow button{
background:#475569;
color:#fff;
padding:6px 10px
}

.variantLabel{
flex:1;
text-align:center;
font-size:12px;
font-weight:bold;
background:#f1f5f9;
border-radius:5px;
padding:6px
}

.q{
display:flex;
gap:5px;
align-items:center
}

.q button{
background:#475569;
color:white;
min-width:32px
}


/* =========================
   CART MODAL
========================= */

.cartOverlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:9000;
padding:15px;
overflow:auto
}

.cartOverlay.open{
display:flex;
align-items:center;
justify-content:center
}

.cartbox{
width:min(100%,480px);
max-height:90vh;
overflow:auto;
background:#fff;
border:2px solid #8fa0b5;
border-radius:14px;
padding:14px;
box-shadow:0 10px 35px rgba(0,0,0,.3)
}

.cartHeader{
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #d1d5db;
padding-bottom:8px;
margin-bottom:8px
}

.cartHeader h3{
margin:0
}

.cartClose{
background:#475569;
color:#fff;
width:38px;
height:38px;
padding:0;
font-size:20px
}

.item{
padding:10px;
border:1px solid #8fa0b5;
border-radius:7px;
margin:7px 0;
background:#f8fafc
}

.itemName{
font-weight:bold
}

.itemInfo{
font-size:13px;
margin-top:4px
}

.cartControls{
display:flex;
gap:6px;
align-items:center;
margin-top:8px
}

.cartControls button{
background:#475569;
color:#fff
}

.removeBtn{
margin-left:auto;
background:#a11!important
}

.total{
font-weight:bold;
margin:10px 0;
padding-top:5px;
border-top:1px solid #d1d5db
}


/* =========================
   IMAGE VIEWER
========================= */

.viewer{
display:none;
position:fixed;
z-index:99999;
inset:0;
background:rgba(0,0,0,.82);
align-items:center;
justify-content:center;
padding:15px;
-webkit-user-select:none;
user-select:none
}

.viewer.open{
display:flex
}

.viewerBox{
position:relative;
width:min(95vw,500px);
height:min(85vh,650px);
background:#fff;
border-radius:12px;
padding:15px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden
}

.viewerBox img{
max-width:100%;
max-height:100%;
object-fit:contain;
-webkit-user-drag:none;
user-select:none;
pointer-events:none
}

.closeViewer{
position:absolute;
right:7px;
top:7px;
width:38px;
height:38px;
border-radius:50%;
background:#1f293d;
color:#fff;
font-size:20px;
padding:0;
z-index:2
}

.watermark{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:15px;
font-weight:bold;
color:rgba(31,41,61,.18);
white-space:nowrap;
pointer-events:none
}

.viewerWatermark{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:22px;
font-weight:bold;
color:rgba(31,41,61,.18);
white-space:nowrap;
pointer-events:none
}

.loading{
text-align:center;
padding:20px;
background:#fff;
border:2px solid #8fa0b5;
border-radius:12px
}
</style>
</head>

<body>

<div class="wrap">

<header>
<h2>BIN AMEEN TRADER</h2>
<div style="text-align:center">Call: 03331390045</div>
</header>

<button class="main" style="width:100%" onclick="showCart()">
View Cart (<span id="count">0</span>)
</button>

<div class="cats" id="cats"></div>

<input
class="search"
id="search"
placeholder="Search product name or SKU code..."
>

<div id="list">
<div class="loading">Loading products...</div>
</div>

</div>


<!-- =========================
     CART MODAL
========================= -->

<div class="cartOverlay" id="cartOverlay">

<div class="cartbox">

<div class="cartHeader">
<h3>Your Selected Items</h3>

<button
class="cartClose"
onclick="closeCart()"
>
✕
</button>

</div>

<div id="cartItems"></div>

<div class="total">
Total Items: <span id="cartTotal">0</span>
</div>

<button
class="main"
style="width:100%"
onclick="wa()"
>
Send Order on WhatsApp
</button>

</div>

</div>


<!-- =========================
     IMAGE VIEWER
========================= -->

<div class="viewer" id="viewer">

<div class="viewerBox">

<button
class="closeViewer"
onclick="closeViewer()"
>
✕
</button>

<img
id="viewerImg"
src=""
alt="Product"
draggable="false"
>

<div class="viewerWatermark">
BIN AMEEN TRADER
</div>

</div>

</div>


<script>

let products=[];
let sel={};
let cartData={};
let category="ALL";


/* ELEMENTS */

const catsEl=document.getElementById("cats");
const searchEl=document.getElementById("search");
const listEl=document.getElementById("list");

const cartOverlay=document.getElementById("cartOverlay");
const cartItemsEl=document.getElementById("cartItems");
const countEl=document.getElementById("count");
const cartTotalEl=document.getElementById("cartTotal");

const viewerEl=document.getElementById("viewer");
const viewerImgEl=document.getElementById("viewerImg");


/* =========================
   LOAD PRODUCTS
========================= */

async function load(){

try{

const response=await fetch("/api/products");

if(!response.ok){
throw new Error("API error");
}

const data=await response.json();

if(!Array.isArray(data)){
throw new Error("Invalid products data");
}

products=data;

products.forEach(function(p){
sel[p.id]=0;
});

drawCats();
render();

}catch(error){

console.error(error);

listEl.innerHTML=
'<div class="card">Unable to load products.</div>';

}

}


/* =========================
   CATEGORIES
========================= */

function drawCats(){

const categorySet=new Set();

products.forEach(function(p){

if(p.category){
categorySet.add(p.category);
}

});

const categories=["ALL",...categorySet];

catsEl.innerHTML="";

categories.forEach(function(x){

const btn=document.createElement("button");

btn.textContent=
x==="ALL" ? "ALL ITEMS" : x;

if(x===category){
btn.className="active";
}

btn.onclick=function(){

category=x;

drawCats();
render();

};

catsEl.appendChild(btn);

});

}


/* =========================
   RENDER PRODUCTS
========================= */

function render(){

const q=searchEl.value.toLowerCase().trim();

const filtered=products.filter(function(p){

const name=String(p.name||"").toLowerCase();

const variants=
Array.isArray(p.variants)
?p.variants
:[];

const codeMatch=variants.some(function(v){

return String(v.code||"")
.toLowerCase()
.includes(q);

});

return (
(category==="ALL"||p.category===category)
&&
(name.includes(q)||codeMatch)
);

});


listEl.innerHTML="";

if(!filtered.length){

listEl.innerHTML=
'<div class="card">No items found</div>';

return;

}


filtered.forEach(function(p){

if(!Array.isArray(p.variants)||!p.variants.length){
return;
}

let index=sel[p.id]||0;

if(index>=p.variants.length){
index=0;
sel[p.id]=0;
}

const v=p.variants[index];

const key=p.id+"_"+v.label;

const quantity=
cartData[key]
?cartData[key].qty
:0;


/* CARD */

const card=document.createElement("div");

card.className="card";


/* IMAGE */

const pic=document.createElement("div");

pic.className="pic";

pic.onclick=function(){

openViewer(v.img||p.img||"");

};


const img=document.createElement("img");

img.src=v.img||p.img||"";
img.alt=p.name||"";
img.draggable=false;

pic.appendChild(img);


/* WATERMARK */

const wm=document.createElement("div");

wm.className="watermark";
wm.textContent="BIN AMEEN TRADER";

pic.appendChild(wm);


/* INFO */

const info=document.createElement("div");

info.className="info";


const code=document.createElement("span");

code.className="code";

code.textContent=
"CODE: "+(v.code||"");


const name=document.createElement("b");

name.className="name";

name.textContent=p.name||"";


/* VARIANT */

const variantRow=document.createElement("div");

variantRow.className="variantRow";


const leftBtn=document.createElement("button");

leftBtn.textContent="‹";

leftBtn.onclick=function(e){

e.stopPropagation();

prevVariant(p.id);

};


const label=document.createElement("div");

label.className="variantLabel";

label.textContent=v.label||"";


const rightBtn=document.createElement("button");

rightBtn.textContent="›";

rightBtn.onclick=function(e){

e.stopPropagation();

nextVariant(p.id);

};


variantRow.appendChild(leftBtn);
variantRow.appendChild(label);
variantRow.appendChild(rightBtn);


/* QUANTITY */

const qbox=document.createElement("div");

qbox.className="q";


const minus=document.createElement("button");

minus.textContent="−";

minus.onclick=function(){

change(p.id,-1);

};


const qty=document.createElement("b");

qty.textContent=quantity;


const plus=document.createElement("button");

plus.textContent="+";

plus.onclick=function(){

change(p.id,1);

};


qbox.appendChild(minus);
qbox.appendChild(qty);
qbox.appendChild(plus);


/* ADD */

info.appendChild(code);
info.appendChild(name);
info.appendChild(variantRow);
info.appendChild(qbox);

card.appendChild(pic);
card.appendChild(info);

listEl.appendChild(card);

});

}


/* =========================
   PREVIOUS VARIANT
========================= */

function prevVariant(id){

const p=products.find(function(x){
return x.id===id;
});

if(!p||!p.variants||!p.variants.length){
return;
}

let i=sel[id]||0;

i--;

if(i<0){
i=p.variants.length-1;
}

sel[id]=i;

render();

}


/* =========================
   NEXT VARIANT
========================= */

function nextVariant(id){

const p=products.find(function(x){
return x.id===id;
});

if(!p||!p.variants||!p.variants.length){
return;
}

let i=sel[id]||0;

i++;

if(i>=p.variants.length){
i=0;
}

sel[id]=i;

render();

}


/* =========================
   PRODUCT QUANTITY
========================= */

function change(id,d){

const p=products.find(function(x){
return x.id===id;
});

if(!p||!p.variants||!p.variants.length){
return;
}

const v=p.variants[sel[id]||0];

const key=p.id+"_"+v.label;

let newQty=
(cartData[key]?.qty||0)+d;

if(newQty<=0){

delete cartData[key];

}else{

cartData[key]={
name:p.name,
variant:v.label,
code:v.code||"",
img:v.img||p.img||"",
qty:newQty
};

}

updateCartCount();

render();

if(cartOverlay.classList.contains("open")){
renderCart();
}

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

const total=
Object.values(cartData)
.reduce(function(sum,item){
return sum+item.qty;
},0);

countEl.textContent=total;
cartTotalEl.textContent=total;

}


/* =========================
   OPEN CART
========================= */

function showCart(){

renderCart();

cartOverlay.classList.add("open");

document.body.style.overflow="hidden";

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

cartOverlay.classList.remove("open");

document.body.style.overflow="";

}


/* =========================
   CART CONTENT
========================= */

function renderCart(){

const keys=Object.keys(cartData);

if(!keys.length){

cartItemsEl.innerHTML=
'<div class="item">Cart is empty</div>';

updateCartCount();

return;

}

cartItemsEl.innerHTML="";


keys.forEach(function(key){

const x=cartData[key];

const item=document.createElement("div");

item.className="item";


const name=document.createElement("div");

name.className="itemName";

name.textContent=x.name;


const info=document.createElement("div");

info.className="itemInfo";

info.textContent=
x.variant+
" | Code: "+
x.code;


const controls=document.createElement("div");

controls.className="cartControls";


const minus=document.createElement("button");

minus.textContent="−";

minus.onclick=function(){

cartChange(key,-1);

};


const qty=document.createElement("b");

qty.textContent=x.qty;


const plus=document.createElement("button");

plus.textContent="+";

plus.onclick=function(){

cartChange(key,1);

};


const remove=document.createElement("button");

remove.className="removeBtn";

remove.textContent="Remove";

remove.onclick=function(){

removeCart(key);

};


controls.appendChild(minus);
controls.appendChild(qty);
controls.appendChild(plus);
controls.appendChild(remove);

item.appendChild(name);
item.appendChild(info);
item.appendChild(controls);

cartItemsEl.appendChild(item);

});

updateCartCount();

}


/* =========================
   CART QUANTITY
========================= */

function cartChange(key,d){

if(!cartData[key]){
return;
}

cartData[key].qty+=d;

if(cartData[key].qty<=0){
delete cartData[key];
}

renderCart();
render();

}


/* =========================
   REMOVE ITEM
========================= */

function removeCart(key){

delete cartData[key];

renderCart();
render();

}


/* =========================
   IMAGE VIEWER
========================= */

function openViewer(src){

if(!src){
return;
}

viewerImgEl.src=src;

viewerEl.classList.add("open");

document.body.style.overflow="hidden";

}


/* =========================
   CLOSE IMAGE VIEWER
========================= */

function closeViewer(){

viewerEl.classList.remove("open");

viewerImgEl.src="";

document.body.style.overflow="";

}


/* CLICK OUTSIDE IMAGE */

viewerEl.addEventListener("click",function(e){

if(e.target===viewerEl){
closeViewer();
}

});


/* PREVENT IMAGE CONTEXT MENU */

document.addEventListener("contextmenu",function(e){

if(
e.target.tagName==="IMG" ||
e.target.closest(".pic") ||
e.target.closest(".viewerBox")
){

e.preventDefault();

}

});


/* PREVENT IMAGE DRAG */

document.addEventListener("dragstart",function(e){

if(e.target.tagName==="IMG"){
e.preventDefault();
}

});


/* =========================
   WHATSAPP ORDER
========================= */

function wa(){

const keys=Object.keys(cartData);

if(!keys.length){

alert("Cart is empty");

return;

}


/*
IMPORTANT:
Use actual \n line breaks.
Do NOT use \\n.
*/

let message=
"*NEW ORDER - BIN AMEEN TRADER*\n\n";


keys.forEach(function(key,index){

const x=cartData[key];

message+=
(index+1)+
". *"+
x.name+
"* ("+
x.variant+
")\n"+
"   Code: "+
x.code+
" | Qty: *"+
x.qty+
"*\n\n";

});


window.open(
"https://wa.me/923331390045?text="+
encodeURIComponent(message),
"_blank"
);

}


/* =========================
   SEARCH
========================= */

searchEl.addEventListener("input",render);


/* =========================
   CLOSE CART BY OUTSIDE TAP
========================= */

cartOverlay.addEventListener("click",function(e){

if(e.target===cartOverlay){
closeCart();
}

});


/* START */

load();

</script>

</body>
</html>
