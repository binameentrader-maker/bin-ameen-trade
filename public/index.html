<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIN AMEEN TRADER</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
padding:8px;
background:#c8d3df;
font-family:Arial,sans-serif;
color:#1f293d
}

.wrap{
max-width:480px;
margin:auto
}

header{
background:#fff;
border:2px solid #8fa0b5;
border-radius:3px;
padding:9px;
margin-bottom:8px;
text-align:center
}

header h2{
margin:2px 0;
font-size:21px
}

header div{
font-size:14px
}

.cart-top{
width:100%;
background:#1f293d;
color:#fff;
border:0;
border-radius:3px;
padding:11px;
font-size:16px;
font-weight:bold;
margin-bottom:8px
}

.categories{
display:flex;
gap:5px;
overflow-x:auto;
padding:2px 0 7px
}

.categories button{
flex-shrink:0;
background:#fff;
color:#1f293d;
border:1px solid #8fa0b5;
border-radius:3px;
padding:7px 10px;
font-size:11px;
font-weight:bold
}

.categories button.active{
background:#1f293d;
color:#fff
}

.search{
width:100%;
padding:9px;
border:2px solid #8fa0b5;
border-radius:3px;
font-size:14px;
margin-bottom:8px;
outline:none
}

.card{
background:#fff;
border:2px solid #8fa0b5;
border-radius:3px;
padding:7px;
margin-bottom:7px;
display:flex;
gap:8px;
align-items:center
}

.pic{
width:82px;
height:82px;
flex-shrink:0;
border:1px solid #d0d7df;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
overflow:hidden
}

.pic img{
max-width:100%;
max-height:100%;
object-fit:contain;
user-select:none;
-webkit-user-drag:none
}

.info{
flex:1;
min-width:0
}

.name{
display:block;
font-size:13px;
font-weight:bold;
line-height:1.2;
margin-bottom:4px
}

.code{
display:inline-block;
font-size:10px;
font-weight:bold;
background:#f1f5f9;
padding:3px 5px;
border-radius:2px;
margin-bottom:4px
}

.vs{
display:flex;
gap:3px;
flex-wrap:wrap;
margin:3px 0
}

.v{
background:#f1f5f9;
border:1px solid #8fa0b5;
border-radius:3px;
padding:5px 7px;
font-size:10px;
font-weight:bold
}

.v.active{
background:#1f293d;
color:#fff
}

.q{
display:flex;
align-items:center;
gap:5px;
margin-top:4px
}

.q button{
width:28px;
height:25px;
border:0;
border-radius:3px;
background:#475569;
color:#fff;
font-size:17px;
font-weight:bold
}

.q b{
min-width:18px;
text-align:center;
font-size:13px
}

.no-items{
background:#fff;
border:2px solid #8fa0b5;
border-radius:3px;
padding:20px;
text-align:center;
font-weight:bold
}


/* =========================
   SEPARATE CART SCREEN
========================= */

#cartScreen{
display:none;
position:fixed;
left:0;
top:0;
right:0;
bottom:0;
background:#c8d3df;
z-index:99999;
overflow-y:auto
}

#cartScreen.open{
display:block
}

.cart-inner{
max-width:480px;
margin:auto;
padding:8px
}

.cart-header{
background:#fff;
border:2px solid #8fa0b5;
border-radius:3px;
padding:10px;
margin-bottom:8px;
display:flex;
align-items:center;
justify-content:space-between
}

.cart-header h2{
margin:0;
font-size:19px
}

.back-btn{
background:#1f293d;
color:#fff;
border:0;
border-radius:3px;
padding:8px 11px;
font-weight:bold
}

.cart-item{
background:#fff;
border:2px solid #8fa0b5;
border-radius:3px;
padding:9px;
margin-bottom:7px
}

.cart-item-name{
font-weight:bold;
font-size:14px
}

.cart-item-details{
font-size:12px;
margin-top:4px
}

.cart-controls{
display:flex;
align-items:center;
gap:6px;
margin-top:7px
}

.cart-controls button{
background:#475569;
color:#fff;
border:0;
border-radius:3px;
padding:5px 10px;
font-weight:bold
}

.cart-controls .remove{
background:#991b1b
}

.whatsapp{
width:100%;
background:#128c7e;
color:#fff;
border:0;
border-radius:3px;
padding:12px;
font-size:15px;
font-weight:bold;
margin-top:5px
}

.empty{
background:#fff;
border:2px solid #8fa0b5;
border-radius:3px;
padding:25px;
text-align:center;
font-weight:bold
}
</style>
</head>

<body>

<!-- =========================
     HOME / CATALOGUE
========================= -->

<div class="wrap" id="homeScreen">

<header>
<h2>BIN AMEEN TRADER</h2>
<div>Call: 03331390045</div>
</header>

<!-- صرف CART BUTTON -->
<button class="cart-top" onclick="openCart()">
View Cart (<span id="count">0</span>)
</button>

<!-- CATEGORIES -->
<div class="categories" id="categories"></div>

<!-- SEARCH -->
<input
class="search"
id="search"
placeholder="Search product name or SKU code..."
>

<!-- PRODUCTS -->
<div id="list"></div>

</div>


<!-- =========================
     الگ CART SCREEN
     HOME SCREEN سے باہر
========================= -->

<div id="cartScreen">

<div class="cart-inner">

<div class="cart-header">

<h2>Your Selected Items</h2>

<button class="back-btn" onclick="closeCart()">
← Back
</button>

</div>

<div id="cartItems"></div>

<button class="whatsapp" onclick="sendWhatsApp()">
Send Order on WhatsApp
</button>

</div>

</div>


<script>

let products=[];
let selectedVariant={};
let cart={};
let currentCategory="ALL";


/* =========================
   LOAD PRODUCTS
========================= */

async function loadProducts(){

try{

const response=await fetch("/api/products");

if(!response.ok){
throw new Error("Products API Error");
}

products=await response.json();

products.forEach(p=>{
selectedVariant[p.id]=0;
});

drawCategories();
renderProducts();

}catch(error){

console.error(error);

document.getElementById("list").innerHTML=
'<div class="no-items">Products load نہیں ہو سکے۔</div>';

}

}


/* =========================
   CATEGORIES
========================= */

function drawCategories(){

const box=document.getElementById("categories");

const categories=[
"ALL",
...new Set(
products
.map(p=>p.category)
.filter(c=>c && String(c).trim()!=="")
)
];

box.innerHTML=categories.map(category=>{

const active=
currentCategory===category
?"active"
:"";

const title=
category==="ALL"
?"ALL ITEMS"
:category;

return `
<button
class="${active}"
onclick="selectCategory(${JSON.stringify(category)})"
>
${escapeHtml(title)}
</button>
`;

}).join("");

}


/* =========================
   CHANGE CATEGORY
========================= */

function selectCategory(category){

currentCategory=category;

drawCategories();
renderProducts();

window.scrollTo({
top:0,
behavior:"smooth"
});

}


/* =========================
   RENDER PRODUCTS
========================= */

function renderProducts(){

const list=document.getElementById("list");

const query=
document.getElementById("search")
.value
.toLowerCase()
.trim();


const filtered=products.filter(p=>{

const categoryOK=
currentCategory==="ALL" ||
p.category===currentCategory;

const name=
String(p.name||"")
.toLowerCase();

const codeMatch=
Array.isArray(p.variants) &&
p.variants.some(v=>
String(v.code||"")
.toLowerCase()
.includes(query)
);

const nameMatch=
name.includes(query);

return categoryOK &&
(
query==="" ||
nameMatch ||
codeMatch
);

});


if(filtered.length===0){

list.innerHTML=
'<div class="no-items">No items found</div>';

return;

}


list.innerHTML="";

filtered.forEach(product=>{
createProduct(product,list);
});

}


/* =========================
   PRODUCT CARD
========================= */

function createProduct(product,list){

if(
!Array.isArray(product.variants) ||
product.variants.length===0
){
return;
}


let index=
selectedVariant[product.id]||0;


if(index>=product.variants.length){
index=0;
}


const variant=
product.variants[index];


const key=
product.id+"_"+variant.label;


const qty=
cart[key]?.qty||0;


const image=
variant.img ||
product.img ||
"";


const card=
document.createElement("div");

card.className="card";


card.innerHTML=`

<div
class="pic"
onclick="openProduct(${product.id})"
oncontextmenu="return false"
>

<img
src="${escapeAttribute(image)}"
draggable="false"
oncontextmenu="return false"
>

</div>


<div class="info">

<span class="name">
${escapeHtml(product.name||"")}
</span>

<span class="code">
CODE: ${escapeHtml(variant.code||"")}
</span>


<div class="vs">

${product.variants.map((v,i)=>`

<button
class="v ${i===index?"active":""}"
onclick="selectVariant(${product.id},${i})"
>
${escapeHtml(v.label||"")}
</button>

`).join("")}

</div>


<div class="q">

<button
onclick="changeQuantity(${product.id},-1)"
>
−
</button>

<b>${qty}</b>

<button
onclick="changeQuantity(${product.id},1)"
>
+
</button>

</div>

</div>
`;


list.appendChild(card);

}


/* =========================
   VARIANT
========================= */

function selectVariant(id,index){

selectedVariant[id]=index;

renderProducts();

}


/* =========================
   QUANTITY
========================= */

function changeQuantity(id,direction){

const product=
products.find(p=>p.id===id);

if(!product)return;


const index=
selectedVariant[id]||0;

const variant=
product.variants[index];


const key=
product.id+"_"+variant.label;


const newQty=
(cart[key]?.qty||0)+direction;


if(newQty<=0){

delete cart[key];

}else{

cart[key]={
name:product.name,
variant:variant.label,
code:variant.code,
img:variant.img||product.img||"",
qty:newQty
};

}


updateCount();

renderProducts();

}


/* =========================
   CART COUNT
========================= */

function updateCount(){

const total=
Object.values(cart)
.reduce(
(sum,item)=>sum+Number(item.qty||0),
0
);

document.getElementById("count").textContent=total;

}


/* =========================
   OPEN CART
========================= */

function openCart(){

/*
  صرف الگ Cart Screen دکھائیں
  Home screen میں Cart کبھی
  render نہیں ہوگا۔
*/

renderCart();

document
.getElementById("cartScreen")
.classList.add("open");

document.body.style.overflow="hidden";

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

document
.getElementById("cartScreen")
.classList.remove("open");

document.body.style.overflow="";

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

const box=
document.getElementById("cartItems");

const items=
Object.values(cart);


if(items.length===0){

box.innerHTML=
'<div class="empty">Cart is empty</div>';

return;

}


box.innerHTML=items.map((item,index)=>`

<div class="cart-item">

<div class="cart-item-name">
${index+1}. ${escapeHtml(item.name)}
</div>

<div class="cart-item-details">
${escapeHtml(item.variant)}
&nbsp; | &nbsp;
Code: ${escapeHtml(item.code)}
&nbsp; | &nbsp;
Qty: <b>${item.qty}</b>
</div>

<div class="cart-controls">

<button
onclick="cartChange('${escapeAttribute(item.name)}','${escapeAttribute(item.variant)}',-1)"
>
−
</button>

<b>${item.qty}</b>

<button
onclick="cartChange('${escapeAttribute(item.name)}','${escapeAttribute(item.variant)}',1)"
>
+
</button>

<button
class="remove"
onclick="removeCart('${escapeAttribute(item.name)}','${escapeAttribute(item.variant)}')"
>
Remove
</button>

</div>

</div>

`).join("");

}


/* =========================
   CART + / -
========================= */

function cartChange(name,variant,direction){

const key=
Object.keys(cart).find(k=>
cart[k].name===name &&
cart[k].variant===variant
);

if(!key)return;


cart[key].qty+=direction;


if(cart[key].qty<=0){
delete cart[key];
}


updateCount();
renderCart();
renderProducts();

}


/* =========================
   REMOVE CART
========================= */

function removeCart(name,variant){

const key=
Object.keys(cart).find(k=>
cart[k].name===name &&
cart[k].variant===variant
);

if(key){
delete cart[key];
}


updateCount();
renderCart();
renderProducts();

}


/* =========================
   WHATSAPP
========================= */

function sendWhatsApp(){

const items=
Object.values(cart);


if(items.length===0){

alert("Cart is empty");
return;

}


let message=
"*NEW ORDER - BIN AMEEN TRADER*\n\n";


items.forEach((item,index)=>{

message+=
`${index+1}. *${item.name}* (${item.variant})\n`+
`   Code: ${item.code} | Qty: *${item.qty}*\n\n`;

});


const url=
"https://wa.me/923331390045?text="+
encodeURIComponent(message);


window.open(url,"_blank");

}


/* =========================
   SEARCH
========================= */

document
.getElementById("search")
.addEventListener("input",renderProducts);


/* =========================
   PRODUCT IMAGE
   TEMPORARY FUNCTION
========================= */

function openProduct(id){

/*
  Product image popup کا existing
  feature یہاں بعد میں add کیا جا سکتا ہے۔
  ابھی image پر click کرنے سے
  کوئی download نہیں ہوگا۔
*/

}


/* =========================
   HELPERS
========================= */

function escapeHtml(value){

return String(value||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function escapeAttribute(value){

return escapeHtml(value)
.replace(/`/g,"&#096;");

}


/* =========================
   START
========================= */

loadProducts();

</script>

</body>
</html>
