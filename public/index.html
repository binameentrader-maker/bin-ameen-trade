<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIN AMEEN TRADER</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#c8d3df;
  font-family:Arial,Helvetica,sans-serif;
  color:#1f293d;
  -webkit-user-select:none;
  user-select:none;
}

body{
  padding:8px;
}

.wrap{
  width:100%;
  max-width:480px;
  margin:auto;
}

/* HEADER */
header{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:8px;
  margin-bottom:8px;
  border-radius:0;
}

header h2{
  text-align:center;
  font-size:23px;
  margin:2px 0 4px;
}

header div{
  text-align:center;
  font-size:14px;
}

/* BUTTONS */
button{
  border:0;
  border-radius:0;
  padding:7px 9px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

.main{
  background:#1f293d;
  color:white;
}

.cartTop{
  width:100%;
  margin-bottom:8px;
  padding:10px;
  font-size:15px;
}

/* CATEGORIES */
.cats{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin:7px 0;
  padding-bottom:2px;
}

.cats button{
  background:#fff;
  border:1px solid #8fa0b5;
  white-space:nowrap;
}

.cats .active{
  background:#1f293d;
  color:white;
}

/* SEARCH */
.search{
  width:100%;
  padding:9px;
  border:2px solid #8fa0b5;
  border-radius:0;
  background:white;
  font-size:14px;
  margin-bottom:8px;
}

/* PRODUCT CARD */
.card{
  background:#fff;
  border:2px solid #8fa0b5;
  border-radius:0;
  padding:7px;
  margin-bottom:7px;
  display:flex;
  gap:8px;
  align-items:center;
  min-height:105px;
}

/* IMAGE */
.pic{
  width:82px;
  height:82px;
  border:1px solid #8fa0b5;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  background:white;
  cursor:pointer;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-drag:none;
}

/* WATERMARK */
.pic:after{
  content:"BIN AMEEN";
  position:absolute;
  font-size:9px;
  font-weight:bold;
  color:rgba(31,41,61,.16);
  transform:rotate(-25deg);
  pointer-events:none;
}

/* INFO */
.info{
  flex:1;
  min-width:0;
}

.productName{
  display:block;
  font-size:13px;
  font-weight:bold;
  line-height:16px;
  margin:2px 0 5px;

  /* Keep home screen compact */
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.variantNav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  margin:3px 0 5px;
}

.variantNav button{
  background:#475569;
  color:white;
  width:30px;
  height:27px;
  padding:0;
  flex-shrink:0;
}

.variantCode{
  background:#f1f5f9;
  border:1px solid #cbd5e1;
  padding:5px 7px;
  font-size:11px;
  font-weight:bold;
  min-width:70px;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* QUANTITY */
.q{
  display:flex;
  align-items:center;
  gap:5px;
}

.q button{
  background:#475569;
  color:white;
  width:29px;
  height:27px;
  padding:0;
}

.q b{
  min-width:18px;
  text-align:center;
  font-size:13px;
}

/* CART */
.cartbox{
  display:none;
}

.cartbox.open{
  display:block;
}

.cartHeader{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:10px;
  margin-bottom:7px;
}

.cartHeader h3{
  margin:0;
  text-align:center;
}

.item{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:8px;
  margin-bottom:6px;
  font-size:13px;
}

.cartButtons{
  display:flex;
  gap:5px;
}

.cartButtons button{
  flex:1;
}

/* FULL PRODUCT VIEW */
.viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#fff;
  overflow:auto;
}

.viewer.open{
  display:block;
}

.viewerTop{
  height:48px;
  background:#1f293d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  position:sticky;
  top:0;
  z-index:5;
}

.viewerTop button{
  background:#fff;
  color:#1f293d;
  min-width:70px;
}

.viewerBody{
  max-width:600px;
  margin:auto;
  padding:12px;
  text-align:center;
}

.viewerImageBox{
  width:100%;
  height:min(68vh,650px);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#fff;
  border:1px solid #ddd;
  overflow:hidden;
}

.viewerImageBox img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-drag:none;
}

.viewerWatermark{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-25deg);
  font-size:30px;
  font-weight:bold;
  color:rgba(31,41,61,.13);
  pointer-events:none;
  white-space:nowrap;
}

/* FULL VIEW NAME */
.viewerName{
  font-size:19px;
  font-weight:bold;
  line-height:24px;
  margin:12px 4px 6px;
}

/* FULL VIEW VARIANT NAV */
.viewerNav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:8px 0;
}

.viewerNav button{
  background:#1f293d;
  color:#fff;
  width:45px;
  height:38px;
  font-size:20px;
}

.viewerCode{
  border:2px solid #8fa0b5;
  background:#f1f5f9;
  padding:9px 15px;
  min-width:110px;
  font-weight:bold;
  font-size:14px;
}

/* FULL VIEW CART */
.viewerQty{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.viewerQty button{
  background:#1f293d;
  color:#fff;
  width:42px;
  height:38px;
  font-size:20px;
}

.viewerQty b{
  min-width:35px;
  font-size:18px;
}

/* NO ITEMS */
.noItems{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:12px;
  text-align:center;
}

/* MOBILE */
@media(max-width:380px){
  body{padding:6px}

  header h2{
    font-size:20px;
  }

  .pic{
    width:72px;
    height:72px;
  }

  .card{
    min-height:91px;
    padding:6px;
  }

  .productName{
    font-size:12px;
    line-height:14px;
  }

  .viewerName{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h2>BIN AMEEN TRADER</h2>
  <div>Call: 03331390045</div>
</header>

<button class="main cartTop" onclick="showCart()">
  View Cart (<span id="count">0</span>)
</button>

<div class="cats" id="cats"></div>

<input
  class="search"
  id="search"
  placeholder="Search product name or SKU code..."
  autocomplete="off"
>

<div id="list"></div>

<!-- CART -->
<div class="cartbox" id="cart">

  <div class="cartHeader">
    <h3>Your Selected Items</h3>
  </div>

  <div id="cartItems"></div>

  <div class="cartButtons">
    <button class="main" onclick="closeCart()">Continue Shopping</button>
    <button class="main" onclick="wa()">WhatsApp Order</button>
  </div>

</div>

</div>


<!-- FULL PRODUCT VIEW -->
<div class="viewer" id="viewer">

  <div class="viewerTop">
    <button onclick="closeViewer()">← Back</button>
    <b>PRODUCT VIEW</b>
    <button onclick="showCartFromViewer()">Cart (<span id="viewerCount">0</span>)</button>
  </div>

  <div class="viewerBody">

    <div class="viewerImageBox">

      <img
        id="viewerImg"
        src=""
        alt=""
        draggable="false"
        oncontextmenu="return false"
      >

      <div class="viewerWatermark">
        BIN AMEEN TRADER
      </div>

    </div>

    <div class="viewerName" id="viewerName"></div>

    <div class="viewerNav">

      <button onclick="previousVariant()">←</button>

      <div class="viewerCode" id="viewerCode"></div>

      <button onclick="nextVariant()">→</button>

    </div>

    <div class="viewerQty">

      <button onclick="viewerChange(-1)">−</button>

      <b id="viewerQty">0</b>

      <button onclick="viewerChange(1)">+</button>

    </div>

  </div>

</div>


<script>

let products = [];
let sel = {};
let cart = {};
let category = "ALL";

let viewerProduct = null;
let viewerIndex = 0;


/* =========================
   LOAD PRODUCTS
========================= */

async function load(){

  try{

    const response = await fetch('/api/products');

    if(!response.ok){
      throw new Error("Products API error");
    }

    products = await response.json();

    if(!Array.isArray(products)){
      products = [];
    }

    products.forEach(p => {

      if(!Array.isArray(p.variants)){
        p.variants = [{
          label:"",
          code:p.code || "",
          img:p.img || ""
        }];
      }

      sel[p.id] = 0;

    });

    drawCats();
    render();

  }catch(error){

    console.error(error);

    document.getElementById("list").innerHTML =
      '<div class="noItems">Unable to load products.</div>';

  }

}


/* =========================
   CATEGORIES
========================= */

function drawCats(){

  const categories = [
    "ALL",
    ...new Set(
      products
        .map(p => p.category)
        .filter(Boolean)
    )
  ];

  document.getElementById("cats").innerHTML =
    categories.map(x => {

      const active =
        x === category ? "active" : "";

      const label =
        x === "ALL" ? "ALL ITEMS" : x;

      return `
        <button
          class="${active}"
          onclick="setCategory(${JSON.stringify(x)})"
        >
          ${escapeHTML(label)}
        </button>
      `;

    }).join("");

}


function setCategory(x){

  category = x;

  drawCats();
  render();

}


/* =========================
   HOME PRODUCTS
========================= */

function render(){

  const searchValue =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const list =
    document.getElementById("list");

  const filtered = products.filter(p => {

    const categoryOK =
      category === "ALL" ||
      p.category === category;

    const name =
      String(p.name || "").toLowerCase();

    const variantMatch =
      p.variants.some(v =>
        String(v.code || "")
          .toLowerCase()
          .includes(searchValue)
        ||
        String(v.label || "")
          .toLowerCase()
          .includes(searchValue)
      );

    return categoryOK &&
      (
        name.includes(searchValue) ||
        variantMatch
      );

  });


  if(!filtered.length){

    list.innerHTML =
      '<div class="noItems">No items found</div>';

    return;

  }


  list.innerHTML = "";

  filtered.forEach(p => {

    const index =
      Math.min(
        sel[p.id] || 0,
        p.variants.length - 1
      );

    sel[p.id] = index;

    const v = p.variants[index];

    const key =
      p.id + "_" + index;

    const qty =
      cart[key]?.qty || 0;


    const card =
      document.createElement("div");

    card.className = "card";


    const image =
      v.img ||
      p.img ||
      "";


    card.innerHTML = `

      <div
        class="pic"
        onclick="openViewer(${Number(p.id)},${index})"
      >

        <img
          src="${escapeAttr(image)}"
          alt=""
          draggable="false"
          oncontextmenu="return false"
        >

      </div>


      <div class="info">

        <span class="productName">
          ${escapeHTML(
            getVariantName(p,v)
          )}
        </span>


        <div class="variantNav">

          <button
            onclick="changeVariant(${Number(p.id)},-1)"
          >←</button>

          <div class="variantCode">
            ${escapeHTML(v.code || "CODE")}
          </div>

          <button
            onclick="changeVariant(${Number(p.id)},1)"
          >→</button>

        </div>


        <div class="q">

          <button
            onclick="change(${Number(p.id)},-1)"
          >−</button>

          <b>${qty}</b>

          <button
            onclick="change(${Number(p.id)},1)"
          >+</button>

        </div>

      </div>

    `;

    list.appendChild(card);

  });

}


/* =========================
   VARIANT NAME
========================= */

function getVariantName(product,variant){

  /*
    If variant has its own name,
    use that.

    Otherwise use product name.
  */

  if(variant && variant.name){
    return variant.name;
  }

  if(variant && variant.label){

    /*
      If product has multiple
      variants, show product name
      + variant label.

      Example:
      VASELINE HAIR TONIC 100ML
    */

    return (
      product.name +
      " " +
      variant.label
    );

  }

  return product.name || "";

}


/* =========================
   HOME VARIANT NEXT/PREVIOUS
========================= */

function changeVariant(id,d){

  const p =
    products.find(x => x.id === id);

  if(!p || !p.variants.length){
    return;
  }

  let i =
    sel[id] || 0;

  i += d;

  if(i < 0){
    i = p.variants.length - 1;
  }

  if(i >= p.variants.length){
    i = 0;
  }

  sel[id] = i;

  render();

}


/* =========================
   CHANGE QUANTITY
========================= */

function change(id,d){

  const p =
    products.find(x => x.id === id);

  if(!p){
    return;
  }

  const index =
    sel[id] || 0;

  const v =
    p.variants[index];

  const key =
    p.id + "_" + index;

  const newQty =
    (cart[key]?.qty || 0) + d;


  if(newQty <= 0){

    delete cart[key];

  }else{

    cart[key] = {

      name:
        getVariantName(p,v),

      productName:
        p.name || "",

      variant:
        v.label || "",

      code:
        v.code || "",

      qty:
        newQty,

      img:
        v.img || p.img || ""

    };

  }

  updateCartCount();

  render();

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

  const total =
    Object.values(cart)
      .reduce(
        (sum,x) =>
          sum + Number(x.qty || 0),
        0
      );

  document.getElementById("count")
    .textContent = total;

  document.getElementById("viewerCount")
    .textContent = total;

}


/* =========================
   CART OPEN
========================= */

function showCart(){

  renderCart();

  document
    .getElementById("cart")
    .classList.add("open");

  window.scrollTo({
    top:document.body.scrollHeight,
    behavior:"smooth"
  });

}


function closeCart(){

  document
    .getElementById("cart")
    .classList.remove("open");

}


/* =========================
   CART CONTENT
========================= */

function renderCart(){

  const box =
    document.getElementById("cartItems");

  const items =
    Object.values(cart);


  if(!items.length){

    box.innerHTML =
      '<div class="item">Cart is empty</div>';

    return;

  }


  box.innerHTML =
    items.map((x,i) => {

      return `

        <div class="item">

          <b>
            ${i + 1}.
            ${escapeHTML(x.productName || x.name)}
          </b>

          ${
            x.variant
              ? ` (${escapeHTML(x.variant)})`
              : ""
          }

          <br>

          Code:
          ${escapeHTML(x.code || "")}

          &nbsp; | &nbsp;

          Qty:
          <b>${x.qty}</b>

        </div>

      `;

    }).join("");

}


/* =========================
   FULL PRODUCT VIEW
========================= */

function openViewer(id,index){

  const p =
    products.find(x => x.id === id);

  if(!p){
    return;
  }

  viewerProduct = p;

  viewerIndex =
    Math.max(
      0,
      Math.min(
        index,
        p.variants.length - 1
      )
    );

  updateViewer();

  document
    .getElementById("viewer")
    .classList.add("open");

  document.body.style.overflow = "hidden";

}


function closeViewer(){

  document
    .getElementById("viewer")
    .classList.remove("open");

  document.body.style.overflow = "";

}


/* =========================
   UPDATE FULL VIEW
========================= */

function updateViewer(){

  if(!viewerProduct){
    return;
  }

  const v =
    viewerProduct.variants[viewerIndex];

  const image =
    v.img ||
    viewerProduct.img ||
    "";


  document.getElementById("viewerImg")
    .src = image;


  document.getElementById("viewerName")
    .textContent =
      getVariantName(
        viewerProduct,
        v
      );


  document.getElementById("viewerCode")
    .textContent =
      v.code || "CODE";


  const key =
    viewerProduct.id +
    "_" +
    viewerIndex;


  document.getElementById("viewerQty")
    .textContent =
      cart[key]?.qty || 0;

}


/* =========================
   FULL VIEW NEXT
========================= */

function nextVariant(){

  if(!viewerProduct){
    return;
  }

  viewerIndex++;

  if(
    viewerIndex >=
    viewerProduct.variants.length
  ){
    viewerIndex = 0;
  }

  updateViewer();

}


/* =========================
   FULL VIEW PREVIOUS
========================= */

function previousVariant(){

  if(!viewerProduct){
    return;
  }

  viewerIndex--;

  if(viewerIndex < 0){

    viewerIndex =
      viewerProduct.variants.length - 1;

  }

  updateViewer();

}


/* =========================
   FULL VIEW QUANTITY
========================= */

function viewerChange(d){

  if(!viewerProduct){
    return;
  }

  const id =
    viewerProduct.id;

  const index =
    viewerIndex;

  const v =
    viewerProduct.variants[index];

  const key =
    id + "_" + index;

  const newQty =
    (cart[key]?.qty || 0) + d;


  if(newQty <= 0){

    delete cart[key];

  }else{

    cart[key] = {

      name:
        getVariantName(
          viewerProduct,
          v
        ),

      productName:
        viewerProduct.name || "",

      variant:
        v.label || "",

      code:
        v.code || "",

      qty:
        newQty,

      img:
        v.img ||
        viewerProduct.img ||
        ""

    };

  }


  updateCartCount();

  updateViewer();

}


/* =========================
   CART FROM VIEWER
========================= */

function showCartFromViewer(){

  closeViewer();

  showCart();

}


/* =========================
   WHATSAPP
========================= */

function wa(){

  if(!Object.keys(cart).length){

    alert("Cart is empty");

    return;

  }


  let message =
    "*NEW ORDER - BIN AMEEN TRADER*\\n\\n";


  Object.values(cart)
    .forEach((x,i) => {

      message +=
        `${i + 1}. *${x.productName || x.name}*`;

      if(x.variant){

        message +=
          ` (${x.variant})`;

      }

      message +=
        `\\n   Code: ${x.code || ""} | Qty: *${x.qty}*\\n\\n`;

    });


  /*
    Convert the visible \\n
    into actual new lines.
  */

  message =
    message.replace(/\\n/g,"\n");


  const url =
    "https://wa.me/923331390045?text=" +
    encodeURIComponent(message);


  window.open(url,"_blank");

}


/* =========================
   SEARCH
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    render
  );


/* =========================
   IMAGE PROTECTION
========================= */

document.addEventListener(
  "contextmenu",
  function(e){

    if(
      e.target.tagName === "IMG"
    ){
      e.preventDefault();
    }

  }
);


document.addEventListener(
  "dragstart",
  function(e){

    if(
      e.target.tagName === "IMG"
    ){
      e.preventDefault();
    }

  }
);


/* =========================
   HTML SAFETY
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeAttr(value){

  return String(value ?? "")
    .replace(/"/g,"&quot;");

}


/* =========================
   START
========================= */

updateCartCount();

load();

</script>

</body>
</html>
