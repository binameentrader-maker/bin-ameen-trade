<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIN AMEEN TRADER</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:#c8d3df;
  font-family:Arial,Helvetica,sans-serif;
  color:#1f293d;
  -webkit-user-select:none;
  user-select:none;
}

body{
  padding:8px;
}

.wrap{
  width:100%;
  max-width:480px;
  margin:auto;
}

/* ================= HEADER ================= */

header{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:8px;
  margin-bottom:8px;
  border-radius:0;
}

header h2{
  text-align:center;
  font-size:23px;
  margin:2px 0 4px;
}

header div{
  text-align:center;
  font-size:14px;
}

/* ================= BUTTON ================= */

button{
  border:0;
  border-radius:0;
  padding:7px 9px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

.main{
  background:#1f293d;
  color:#fff;
}

.cartTop{
  width:100%;
  margin-bottom:8px;
  padding:10px;
  font-size:15px;
}

/* ================= CATEGORY ================= */

.cats{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin:7px 0;
  padding-bottom:2px;
}

.cats button{
  background:#fff;
  border:1px solid #8fa0b5;
  white-space:nowrap;
}

.cats .active{
  background:#1f293d;
  color:#fff;
}

/* ================= SEARCH ================= */

.search{
  width:100%;
  padding:9px;
  border:2px solid #8fa0b5;
  border-radius:0;
  background:#fff;
  font-size:14px;
  margin-bottom:8px;
  outline:none;
}

/* ================= PRODUCT CARD ================= */

.card{
  background:#fff;
  border:2px solid #8fa0b5;
  border-radius:0;
  padding:7px;
  margin-bottom:7px;
  display:flex;
  gap:8px;
  align-items:center;
  min-height:105px;
}

/* ================= IMAGE ================= */

.pic{
  width:82px;
  height:82px;
  border:1px solid #8fa0b5;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  background:#fff;
  cursor:pointer;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-drag:none;
}

/* WATERMARK */

.pic:after{
  content:"BIN AMEEN";
  position:absolute;
  font-size:9px;
  font-weight:bold;
  color:rgba(31,41,61,.16);
  transform:rotate(-25deg);
  pointer-events:none;
}

/* ================= INFO ================= */

.info{
  flex:1;
  min-width:0;
}

.productName{
  display:block;
  font-size:13px;
  font-weight:bold;
  line-height:16px;
  margin:2px 0 5px;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* ================= NEXT/PREV HOME ================= */

.variantNav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  margin:3px 0 5px;
}

.variantNav button{
  background:#475569;
  color:#fff;
  width:30px;
  height:27px;
  padding:0;
  flex-shrink:0;
}

.variantCode{
  background:#f1f5f9;
  border:1px solid #cbd5e1;
  padding:5px 7px;
  font-size:11px;
  font-weight:bold;
  min-width:70px;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* ================= QUANTITY ================= */

.q{
  display:flex;
  align-items:center;
  gap:5px;
}

.q button{
  background:#475569;
  color:white;
  width:29px;
  height:27px;
  padding:0;
}

.q b{
  min-width:18px;
  text-align:center;
  font-size:13px;
}

/* ================= CART SCREEN ================= */

.cartScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:10000;
  background:#c8d3df;
  overflow:auto;
}

.cartScreen.open{
  display:block;
}

.cartTopBar{
  height:50px;
  background:#1f293d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  position:sticky;
  top:0;
  z-index:5;
}

.cartTopBar button{
  background:#fff;
  color:#1f293d;
  min-width:70px;
}

.cartBody{
  max-width:480px;
  margin:auto;
  padding:10px;
}

.cartHeader{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:10px;
  margin-bottom:7px;
}

.cartHeader h3{
  margin:0;
  text-align:center;
}

.item{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:8px;
  margin-bottom:6px;
  font-size:13px;
}

.cartButtons{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.cartButtons button{
  flex:1;
}

/* ================= PRODUCT VIEW ================= */

.viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#fff;
  overflow:auto;
}

.viewer.open{
  display:block;
}

.viewerTop{
  height:48px;
  background:#1f293d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
  position:sticky;
  top:0;
  z-index:5;
}

.viewerTop button{
  background:#fff;
  color:#1f293d;
  min-width:65px;
}

.viewerBody{
  max-width:600px;
  margin:auto;
  padding:10px;
  text-align:center;
}

/* IMAGE */

.viewerImageBox{
  width:100%;
  height:min(64vh,620px);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#fff;
  border:1px solid #ddd;
  overflow:hidden;
}

.viewerImageBox img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-drag:none;
}

.viewerWatermark{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-25deg);
  font-size:30px;
  font-weight:bold;
  color:rgba(31,41,61,.13);
  pointer-events:none;
  white-space:nowrap;
}

/* FULL NAME */

.viewerName{
  font-size:19px;
  font-weight:bold;
  line-height:24px;
  margin:10px 4px 5px;
}

/* VARIANT NAV */

.viewerNav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin:7px 0;
}

.viewerNav button{
  background:#1f293d;
  color:#fff;
  width:44px;
  height:38px;
  font-size:20px;
}

.viewerCode{
  border:2px solid #8fa0b5;
  background:#f1f5f9;
  padding:9px 12px;
  min-width:105px;
  max-width:220px;
  font-weight:bold;
  font-size:14px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* VARIANT BUTTONS */

.viewerVariants{
  display:flex;
  justify-content:center;
  gap:5px;
  flex-wrap:wrap;
  margin:7px 0;
}

.viewerVariants button{
  background:#e2e8f0;
  border:1px solid #8fa0b5;
  color:#1f293d;
}

.viewerVariants button.active{
  background:#1f293d;
  color:#fff;
}

/* VIEWER QUANTITY */

.viewerQty{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:8px;
}

.viewerQty button{
  background:#1f293d;
  color:#fff;
  width:42px;
  height:38px;
  font-size:20px;
}

.viewerQty b{
  min-width:35px;
  font-size:18px;
}

/* ================= NO ITEMS ================= */

.noItems{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:12px;
  text-align:center;
}

/* ================= LOADING ================= */

.loading{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:20px;
  text-align:center;
  font-size:17px;
}

/* ================= FOOTER ================= */

.footer{
  background:#fff;
  border:2px solid #8fa0b5;
  margin-top:10px;
  padding:10px;
  text-align:center;
  font-size:13px;
}

.footer a{
  color:#1f293d;
  font-weight:bold;
  text-decoration:none;
}

/* ================= MOBILE ================= */

@media(max-width:380px){

  body{
    padding:6px;
  }

  header h2{
    font-size:20px;
  }

  .pic{
    width:72px;
    height:72px;
  }

  .card{
    min-height:91px;
    padding:6px;
  }

  .productName{
    font-size:12px;
    line-height:14px;
  }

  .viewerName{
    font-size:17px;
    line-height:22px;
  }

}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h2>BIN AMEEN TRADER</h2>
  <div>Call: 03331390045</div>
</header>

<button class="main cartTop" onclick="showCart()">
  View Cart (<span id="count">0</span>)
</button>

<div class="cats" id="cats"></div>

<input
  class="search"
  id="search"
  placeholder="Search product name or SKU code..."
  autocomplete="off"
>

<div id="list">
  <div class="loading">Loading products...</div>
</div>

<div class="footer">
  BIN AMEEN TRADER
</div>

</div>


<!-- ================= CART SCREEN ================= -->

<div class="cartScreen" id="cartScreen">

  <div class="cartTopBar">

    <button onclick="closeCart()">
      ← Back
    </button>

    <b>YOUR CART</b>

    <span>
      <span id="cartScreenCount">0</span>
    </span>

  </div>

  <div class="cartBody">

    <div class="cartHeader">
      <h3>Your Selected Items</h3>
    </div>

    <div id="cartItems"></div>

    <div class="cartButtons">

      <button
        class="main"
        onclick="closeCart()"
      >
        Continue Shopping
      </button>

      <button
        class="main"
        onclick="wa()"
      >
        WhatsApp Order
      </button>

    </div>

  </div>

</div>


<!-- ================= PRODUCT VIEW ================= -->

<div class="viewer" id="viewer">

  <div class="viewerTop">

    <button onclick="closeViewer()">
      ← Back
    </button>

    <b>PRODUCT VIEW</b>

    <button onclick="showCartFromViewer()">
      Cart (<span id="viewerCount">0</span>)
    </button>

  </div>

  <div class="viewerBody">

    <div class="viewerImageBox">

      <img
        id="viewerImg"
        src=""
        alt=""
        draggable="false"
        oncontextmenu="return false"
      >

      <div class="viewerWatermark">
        BIN AMEEN TRADER
      </div>

    </div>

    <div
      class="viewerName"
      id="viewerName"
    ></div>

    <div class="viewerNav">

      <button onclick="previousVariant()">
        ←
      </button>

      <div
        class="viewerCode"
        id="viewerCode"
      ></div>

      <button onclick="nextVariant()">
        →
      </button>

    </div>

    <div
      class="viewerVariants"
      id="viewerVariants"
    ></div>

    <div class="viewerQty">

      <button onclick="viewerChange(-1)">
        −
      </button>

      <b id="viewerQty">
        0
      </b>

      <button onclick="viewerChange(1)">
        +
      </button>

    </div>

  </div>

</div>


<script>

let products = [];
let sel = {};
let cart = {};
let category = "ALL";

let viewerProduct = null;
let viewerIndex = 0;


/* =========================
   LOAD PRODUCTS
========================= */

async function load(){

  const list = document.getElementById("list");

  list.innerHTML =
    '<div class="loading">Loading products...</div>';

  try{

    const response =
      await fetch("/api/products",{
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error(
        "API returned " + response.status
      );
    }

    const data =
      await response.json();

    /*
      Supports both:
      direct array
      and {products:[...]}
    */

    if(Array.isArray(data)){
      products = data;
    }
    else if(
      data &&
      Array.isArray(data.products)
    ){
      products = data.products;
    }
    else if(
      data &&
      Array.isArray(data.data)
    ){
      products = data.data;
    }
    else{
      products = [];
    }


    products.forEach((p,index)=>{

      /*
        Make sure every product
        has a usable ID.
      */

      if(
        p.id === undefined ||
        p.id === null
      ){
        p.id = "p_" + index;
      }


      /*
        Make sure variants exists.
      */

      if(!Array.isArray(p.variants)){

        p.variants = [{
          label:"",
          name:p.name || "",
          code:p.code || "",
          img:p.img || ""
        }];

      }


      /*
        Make sure each variant
        has usable values.
      */

      p.variants =
        p.variants.map(v => {

          return {
            label:
              v.label || "",

            name:
              v.name || "",

            code:
              v.code || "",

            img:
              v.img || p.img || ""
          };

        });


      sel[p.id] = 0;

    });


    drawCats();
    render();

    updateCartCount();


  }catch(error){

    console.error(
      "PRODUCT LOAD ERROR:",
      error
    );

    list.innerHTML = `
      <div class="noItems">
        Products could not be loaded.<br><br>
        Please refresh the page.
      </div>
    `;

  }

}


/* =========================
   CATEGORIES
========================= */

function drawCats(){

  const categories = [
    "ALL",
    ...new Set(
      products
        .map(p => p.category)
        .filter(Boolean)
    )
  ];


  document.getElementById("cats")
    .innerHTML = categories
      .map(x => {

        const active =
          x === category
            ? "active"
            : "";

        const label =
          x === "ALL"
            ? "ALL ITEMS"
            : x;


        return `
          <button
            class="${active}"
            onclick='setCategory(${JSON.stringify(x)})'
          >
            ${escapeHTML(label)}
          </button>
        `;

      })
      .join("");

}


function setCategory(x){

  category = x;

  drawCats();

  render();

}


/* =========================
   HOME RENDER
========================= */

function render(){

  const searchValue =
    document.getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const list =
    document.getElementById("list");


  const filtered =
    products.filter(p => {

      const categoryOK =
        category === "ALL" ||
        String(p.category || "") ===
        String(category);


      const name =
        String(p.name || "")
          .toLowerCase();


      const variantMatch =
        p.variants.some(v => {

          const code =
            String(v.code || "")
              .toLowerCase();

          const label =
            String(v.label || "")
              .toLowerCase();

          const vname =
            String(v.name || "")
              .toLowerCase();

          return (
            code.includes(searchValue) ||
            label.includes(searchValue) ||
            vname.includes(searchValue)
          );

        });


      return (
        categoryOK &&
        (
          name.includes(searchValue) ||
          variantMatch
        )
      );

    });


  if(!filtered.length){

    list.innerHTML =
      '<div class="noItems">No items found</div>';

    return;

  }


  list.innerHTML = "";


  filtered.forEach(p => {

    let index =
      Number(sel[p.id] || 0);


    if(index < 0){
      index = 0;
    }

    if(index >= p.variants.length){
      index = 0;
    }


    sel[p.id] = index;


    const v =
      p.variants[index];


    const key =
      getCartKey(p,index);


    const qty =
      cart[key]?.qty || 0;


    const image =
      v.img ||
      p.img ||
      "";


    const card =
      document.createElement("div");


    card.className =
      "card";


    card.innerHTML = `

      <div
        class="pic"
        onclick='openViewer(${JSON.stringify(p.id)},${index})'
      >

        <img
          src="${escapeAttr(image)}"
          alt=""
          draggable="false"
          oncontextmenu="return false"
        >

      </div>


      <div class="info">

        <span class="productName">
          ${escapeHTML(
            getVariantName(p,v)
          )}
        </span>


        <div class="variantNav">

          <button
            onclick='changeVariant(${JSON.stringify(p.id)},-1)'
          >
            ←
          </button>

          <div class="variantCode">
            ${escapeHTML(
              v.code || "CODE"
            )}
          </div>

          <button
            onclick='changeVariant(${JSON.stringify(p.id)},1)'
          >
            →
          </button>

        </div>


        <div class="q">

          <button
            onclick='change(${JSON.stringify(p.id)},-1)'
          >
            −
          </button>

          <b>${qty}</b>

          <button
            onclick='change(${JSON.stringify(p.id)},1)'
          >
            +
          </button>

        </div>

      </div>

    `;


    list.appendChild(card);

  });

}


/* =========================
   VARIANT NAME
========================= */

function getVariantName(product,variant){

  /*
    If variant has its own name,
    use it completely.
  */

  if(
    variant &&
    String(variant.name || "").trim()
  ){
    return variant.name;
  }


  /*
    Otherwise product name + label.
  */

  if(
    variant &&
    String(variant.label || "").trim()
  ){

    return (
      String(product.name || "") +
      " " +
      String(variant.label || "")
    );

  }


  return product.name || "";

}


/* =========================
   CART KEY
========================= */

function getCartKey(product,index){

  return String(product.id) +
    "_" +
    String(index);

}


/* =========================
   HOME NEXT/PREVIOUS
========================= */

function changeVariant(id,d){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );


  if(
    !p ||
    !p.variants ||
    !p.variants.length
  ){
    return;
  }


  let i =
    Number(sel[p.id] || 0);


  i += d;


  if(i < 0){
    i =
      p.variants.length - 1;
  }


  if(i >= p.variants.length){
    i = 0;
  }


  sel[p.id] = i;


  render();

}


/* =========================
   CHANGE QUANTITY
========================= */

function change(id,d){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );


  if(!p){
    return;
  }


  const index =
    Number(sel[p.id] || 0);


  const v =
    p.variants[index];


  const key =
    getCartKey(p,index);


  const newQty =
    Number(cart[key]?.qty || 0) + d;


  if(newQty <= 0){

    delete cart[key];

  }
  else{

    cart[key] = {

      name:
        getVariantName(p,v),

      productName:
        p.name || "",

      variant:
        v.label || "",

      code:
        v.code || "",

      qty:
        newQty,

      img:
        v.img ||
        p.img ||
        ""

    };

  }


  updateCartCount();

  render();

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

  const total =
    Object.values(cart)
      .reduce(
        (sum,x) =>
          sum + Number(x.qty || 0),
        0
      );


  document.getElementById("count")
    .textContent = total;


  document.getElementById("cartScreenCount")
    .textContent = total;


  document.getElementById("viewerCount")
    .textContent = total;

}


/* =========================
   OPEN CART
========================= */

function showCart(){

  renderCart();

  document
    .getElementById("cartScreen")
    .classList.add("open");

  document.body.style.overflow =
    "hidden";

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

  document
    .getElementById("cartScreen")
    .classList.remove("open");

  document.body.style.overflow =
    "";

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const box =
    document.getElementById("cartItems");


  const items =
    Object.values(cart);


  if(!items.length){

    box.innerHTML =
      '<div class="item">Cart is empty</div>';

    return;

  }


  box.innerHTML =
    items
      .map((x,i)=>{

        return `

          <div class="item">

            <b>
              ${i + 1}.
              ${escapeHTML(
                x.productName ||
                x.name ||
                ""
              )}
            </b>

            ${
              x.variant
                ? ` (${escapeHTML(x.variant)})`
                : ""
            }

            <br>

            Code:
            ${escapeHTML(
              x.code || ""
            )}

            &nbsp; | &nbsp;

            Qty:
            <b>
              ${x.qty}
            </b>

          </div>

        `;

      })
      .join("");

}


/* =========================
   OPEN PRODUCT VIEW
========================= */

function openViewer(id,index){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );


  if(!p){
