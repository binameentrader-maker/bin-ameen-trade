<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BIN AMEEN TRADER</title>

<style>
*{
box-sizing:border-box;
}

html,body{
margin:0;
padding:0;
background:#C5D0DA;
font-family:Arial,Helvetica,sans-serif;
color:#1B2A4A;
}

body{
padding:7px;
}

.wrap{
max-width:480px;
margin:auto;
}

/* HEADER */

header{
background:#fff;
border:2px solid #8fa0b5;
border-radius:0;
padding:8px;
margin-bottom:8px;
text-align:center;
}

.logoBox{
border:2px solid #8fa0b5;
border-radius:0;
padding:6px 4px;
font-size:23px;
font-weight:900;
letter-spacing:.4px;
}

.phoneRow{
display:flex;
align-items:center;
justify-content:center;
margin-top:10px;
position:relative;
}

.phoneLine{
height:2px;
background:#9aa7b9;
position:absolute;
left:35px;
right:35px;
top:50%;
}

.phoneBox{
position:relative;
background:#fff;
border:2px solid #8fa0b5;
border-radius:0;
padding:4px 12px;
font-size:15px;
font-weight:bold;
z-index:1;
}

/* BUTTONS */

button{
border:0;
border-radius:0;
padding:7px;
font-weight:bold;
cursor:pointer;
}

.main{
background:#1B2A4A!important;
color:#fff;
border-radius:0;
padding:11px;
font-size:16px;
font-weight:bold;
}

/* CATEGORIES */

.cats{
display:flex;
gap:5px;
overflow:auto;
margin:8px 0;
}

.cats button{
background:#fff;
border:2px solid #8fa0b5;
border-radius:0;
white-space:nowrap;
font-size:13px;
padding:7px 12px;
}

.cats button.active{
background:#1B2A4A;
color:#fff;
border-color:#1B2A4A;
}

/* SEARCH */

.searchWrap{
position:relative;
margin-bottom:8px;
}

.searchIcon{
position:absolute;
left:11px;
top:50%;
transform:translateY(-50%);
font-size:13px;
font-weight:700;
letter-spacing:0.5px;
text-transform:uppercase;
color:#1B2A4A;
pointer-events:none;
}

.search{
width:100%;
padding:10px 10px 10px 78px;
border:2px solid #8fa0b5;
border-radius:0;
font-size:14px;
outline:none;
background:#fff;
}

/* CATEGORY -> SEARCH TOOLBAR -> PRODUCTS */
.searchToolbar{display:flex;align-items:stretch;gap:6px;width:100%;margin:0 0 8px}
.searchToolbar .searchWrap{flex:3 1 0;min-width:0;margin:0}
.searchToolbar .search{display:block;width:100%;height:44px}
.viewSwitch{flex:1 1 0;min-width:0;height:44px;padding:0;display:flex;align-items:center;justify-content:center;background:#fff;color:#1B2A4A;border:2px solid #8fa0b5;border-radius:0}
.viewSwitch svg{width:25px;height:25px;display:block}
.viewSwitch:focus-visible{outline:2px solid #1B2A4A;outline-offset:2px}

/* LIST / GRID VIEW */
#list.view-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
#list.view-grid .card{min-width:0;width:100%;margin:0;padding:7px;display:flex;flex-direction:column;align-items:stretch;gap:7px}
#list.view-grid .pic{width:100%;height:auto;aspect-ratio:1/1;flex:none}
#list.view-grid .info{width:100%;min-width:0;display:flex;flex-direction:column;align-items:stretch}
#list.view-grid .name,#list.view-list .name{width:100%;text-align:center;overflow-wrap:anywhere;word-break:normal}
#list.view-grid .q,#list.view-grid .twoVariant,#list.view-grid .variantRow,#list.view-grid .variantText{display:none!important}
#list.view-list .info{display:flex;flex-direction:column;align-items:center;text-align:center}
#list.view-list .name{align-self:stretch;text-align:center}
#list.view-list .q.singleProductQty{justify-content:center;width:100%;margin-left:auto;margin-right:auto}
#list.view-list .q.singleProductQty .arrowBtn{display:none!important}
.gridAddCart{width:100%;max-width:100%;min-height:38px;margin-top:7px;padding:8px 5px;background:#1B2A4A;color:#fff;border:0;border-radius:0;font-size:12px;font-weight:800;white-space:normal;overflow-wrap:anywhere}
@media(max-width:360px){#list.view-grid{gap:6px}#list.view-grid .card{padding:5px}.searchToolbar{gap:5px}.searchToolbar .search,.viewSwitch{height:42px}}


/* MODEL 3 PAGINATION */
.paginationBar{display:flex;align-items:center;justify-content:center;gap:9px;padding:14px 2px;flex-wrap:nowrap;text-align:center}
.paginationBar button{background:#1A2B4A;color:#fff;border:1px solid #1A2B4A;min-width:105px;padding:10px 8px;font-size:12px;font-weight:800}
.paginationBar button:disabled{background:#CBD3E0;color:#667085;border-color:#CBD3E0;cursor:not-allowed}
@media(max-width:360px){.paginationBar{gap:8px}.paginationBar button{min-width:120px;padding:10px 8px;font-size:11px}}

/* PRODUCT CARD */

.card{
background:#fff;
border:2px solid #8fa0b5;
border-radius:0;
padding:7px;
margin-bottom:8px;
display:flex;
gap:9px;
align-items:center;
box-shadow:none;
}

.pic{
pointer-events:auto !important;
touch-action:manipulation;
width:92px;
height:92px;
border:1px solid #8fa0b5;
border-radius:0;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
position:relative;
overflow:hidden;
background:#fff;
cursor:pointer;
user-select:none;
}

.pic img{
max-width:100%;
max-height:100%;
width:100%;
height:100%;
object-fit:contain;
pointer-events:none;
user-select:none;
-webkit-user-drag:none;
}


/* WATERMARK */

.pic:after{
content:"BIN AMEEN";
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:11px;
font-weight:bold;
color:rgba(31,41,61,.15);
pointer-events:none;
white-space:nowrap;
}

/* INFO */

.info{
flex:1;
min-width:0;
}

/* CODE */

.code{
display:inline-block;
font-size:11px;
font-weight:bold;
background:#f1f5f9;
border:1px solid #8fa0b5;
padding:3px 5px;
border-radius:0;
color:#475569;
}

/* NAME */

.name{
display:block;
font-size:14px;
font-weight:900;
margin-top:4px;
line-height:1.15;
}

/* LIST VIEW item badges: RETAIL first, CATEGORY second */
#list.view-list .listItemBadges{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  gap:4px;
  width:100%;
  max-width:100%;
  margin:0 0 4px;
}
#list.view-list .listItemBadge{
  display:inline-block;
  box-sizing:border-box;
  max-width:100%;
  padding:2px 5px;
  border:1px solid #1A2B4A;
  background:#ffffff;
  color:#1A2B4A;
  font-size:10px;
  line-height:1.25;
  font-weight:800;
  text-align:center;
  overflow-wrap:anywhere;
  white-space:normal;
}
@media(max-width:420px){
  #list.view-list .listItemBadges{gap:3px;margin-bottom:3px}
  #list.view-list .listItemBadge{font-size:9px;padding:2px 4px}
}


/* VARIANT NAME (own line, wraps, no truncation) */

.variantText{
display:block;
font-size:12px;
font-weight:600;
color:#475569;
margin-top:3px;
line-height:1.25;
white-space:normal;
overflow-wrap:break-word;
word-break:break-word;
}

/* TWO VARIANTS */

.twoVariant{
display:flex;
gap:5px;
flex-wrap:wrap;
margin:5px 0;
}

.variantBtn{
background:#fff;
border:2px solid #8fa0b5;
color:#475569;
font-size:12px;
padding:5px 9px;
border-radius:0;
white-space:normal;
word-break:break-word;
text-align:center;
max-width:100%;
}

.variantBtn.selected{
background:#1B2A4A;
color:#fff;
border-color:#1B2A4A;
}

/* 3+ VARIANTS */

.variantRow{
display:flex;
align-items:center;
gap:4px;
margin:5px 0;
}

.arrowBtn{
background:#475569;
color:#fff;
font-size:17px;
width:34px;
height:31px;
padding:0;
border-radius:0;
}

.variantLabel{
flex:1;
text-align:center;
font-size:12px;
font-weight:bold;
background:#f8fafc;
border:2px solid #8fa0b5;
border-radius:0;
padding:6px 3px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

/* QUANTITY */

.q{
display:flex;
gap:4px;
align-items:center;
}

.q button{
background:#475569;
color:#fff;
font-size:17px;
width:32px;
height:30px;
padding:0;
border-radius:0;
}

.q .arrowBtn{
width:34px;
height:31px;
font-size:17px;
}

.qtyBox{
min-width:40px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border:2px solid #8fa0b5;
border-radius:0;
font-size:15px;
color:#111;
cursor:pointer;
}

.qtyInput{
min-width:40px;
width:46px;
height:30px;
text-align:center;
background:#fff;
border:2px solid #1B2A4A;
border-radius:0;
font-size:15px;
color:#111;
padding:0;
}

/* CART */

.cartOverlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:9000;
padding:8px;
overflow:auto;
align-items:center;
justify-content:center;
}

.cartOverlay.open{
display:flex;
}

.cartbox{
width:min(100%,470px);
max-height:90vh;
overflow:auto;
background:#fff;
border:2px solid #8fa0b5;
border-radius:0;
padding:10px;
}

.cartHeader{
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #d1d5db;
padding-bottom:7px;
margin-bottom:7px;
}

.cartHeader h3{
margin:0;
font-size:18px;
}

.cartClose{
background:#475569;
color:#fff;
width:35px;
height:35px;
font-size:18px;
padding:0;
border-radius:0;
}

.item{
padding:8px;
border:1px solid #8fa0b5;
border-radius:0;
margin:5px 0;
background:#f8fafc;
}

.itemName{
font-weight:bold;
font-size:14px;
}

.itemInfo{
font-size:12px;
margin-top:4px;
}

.cartControls{
display:flex;
gap:5px;
align-items:center;
margin-top:7px;
}

.cartControls button{
background:#475569;
color:#fff;
padding:6px 10px;
}

.removeBtn{
margin-left:auto;
background:#9b2226!important;
}

.total{
font-weight:bold;
margin:10px 0;
padding-top:7px;
border-top:1px solid #d1d5db;
font-size:14px;
}

/* EMAIL */

.emailFooter{
background:#fff;
border:2px solid #8fa0b5;
border-radius:0;
padding:9px 5px;
margin-top:6px;
margin-bottom:7px;
text-align:center;
font-size:15px;
font-weight:bold;
color:#475569;
}

/* IMAGE VIEWER - full screen */

.viewer{
display:none;
position:fixed;
z-index:99999;
inset:0;
background:#000;
align-items:center;
justify-content:center;
padding:0;
user-select:none;
}

.viewer.open{
display:flex;
}

.viewerBox{
position:relative;
width:100%;
height:100%;
background:#fff;
border-radius:0;
padding:16px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.viewerBox img{
max-width:100%;
max-height:100%;
object-fit:contain;
pointer-events:none;
user-select:none;
-webkit-user-drag:none;
}

.closeViewer{
position:absolute;
left:10px;
top:10px;
height:40px;
width:auto;
padding:0 16px;
background:#1B2A4A;
color:#fff;
font-size:15px;
font-weight:bold;
border-radius:0;
z-index:3;
letter-spacing:.3px;
}

.viewerWatermark{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:26px;
font-weight:bold;
color:rgba(31,41,61,.18);
white-space:nowrap;
pointer-events:none;
z-index:1;
}

/* VIEWER PREV/NEXT ARROWS */

.viewerArrow{
position:absolute;display:none!important;
top:50%;
transform:translateY(-50%);
background:#475569;
color:#fff;
font-size:26px;
width:44px;
height:56px;
padding:0;
border-radius:0;
z-index:3;
}

.viewerArrowLeft{
left:8px;
}

.viewerArrowRight{
right:8px;
}

/* VIEWER VARIANT/CODE/QTY INFO */

.viewerInfo{
position:absolute;
left:50%;
bottom:14px;
transform:translateX(-50%);
display:flex;
flex-direction:column;
align-items:center;
gap:7px;
z-index:3;
background:transparent;
border:0;
padding:9px 4px;
max-width:96%;
}

.viewerVariantText{
font-size:14px;
font-weight:900;
color:#1B2A4A;
text-align:center;
}
.viewerBadges{display:flex;flex-wrap:nowrap;justify-content:center;align-items:center;gap:4px;width:100%;max-width:100%;white-space:nowrap}
.viewerBadge{display:inline-block;box-sizing:border-box;max-width:none;white-space:nowrap;padding:2px 5px;border:1px solid #1A2B4A;background:#fff;color:#1A2B4A;font-size:10px;line-height:1.25;font-weight:800;text-align:center;overflow-wrap:anywhere;white-space:normal}

/* VIEWER ADD TO CART BUTTON */

.viewerAddCart{
background:#1B2A4A;
color:#fff;
border-radius:0;
padding:9px 18px;
font-size:14px;
font-weight:bold;
white-space:nowrap;
}

/* LOADING */

.loading{
text-align:center;
padding:15px;
background:#fff;
border:2px solid #8fa0b5;
border-radius:0;
font-size:14px;
}

/* ERROR */

.errorBox{
background:#fff;
border:2px solid #9b2226;
padding:14px;
font-size:13px;
line-height:20px;
word-break:break-word;
}

/* PASSWORD GATE */

.gate{
display:none;
position:fixed;
inset:0;
z-index:999999;
background:#C5D0DA;
align-items:center;
justify-content:center;
padding:12px;
}

.gate.open{
display:flex;
}

.gateBox{
width:min(100%,420px);
background:#fff;
border:2px solid #8fa0b5;
border-radius:0;
padding:18px;
text-align:center;
}

.gateLogo{
font-size:22px;
font-weight:900;
letter-spacing:.4px;
margin-bottom:14px;
}

.gateLabel{
font-size:14px;
font-weight:bold;
margin-bottom:8px;
}

.gateInput{
width:100%;
padding:11px;
border:2px solid #8fa0b5;
border-radius:0;
font-size:15px;
outline:none;
background:#fff;
margin-bottom:10px;
text-align:center;
}

.gateBtn{
width:100%;
background:#1B2A4A;
color:#fff;
padding:11px;
font-size:15px;
font-weight:bold;
border-radius:0;
}

.gateError{
display:none;
margin-top:10px;
color:#9b2226;
font-weight:bold;
font-size:13px;
}

.gateChecking{
text-align:center;
padding:20px;
font-size:14px;
color:#475569;
}

/* MOBILE */

}

.logoBox{

.phoneRow{

}

.card{

}

}

.name{

}

.arrowBtn{

}

/* PREVENT IMAGE SAVE */

img{
-webkit-touch-callout:none;
-webkit-user-select:none;
user-select:none;
}
/* BIN AMEEN DESIGN SETTINGS */

:root{
 --design-page-bg:#C5D0DA;
 --design-header-bg:#fff;
 --design-primary:#1B2A4A;
 --design-text:#1B2A4A;
 --design-card-bg:#fff;
 --design-border:#8fa0b5;
 --design-radius:0px;
 --design-image-size:92px;
 --design-card-padding:7px;
}
html,body{background:var(--design-page-bg);color:var(--design-text)}
.wrap{max-width:var(--design-content-width,480px)}

header{background:var(--design-header-bg);border-color:var(--design-border);border-radius:var(--design-radius)}
.logoBox,.phoneBox{border-color:var(--design-border);border-radius:var(--design-radius)}
.main,.cats button.active{background:var(--design-primary)!important;border-color:var(--design-primary)!important}
.card{background:var(--design-card-bg);border-color:var(--design-border);border-radius:var(--design-radius);padding:var(--design-card-padding)}
.pic{width:var(--design-image-size);height:var(--design-image-size);border-color:var(--design-border);border-radius:var(--design-radius)}
.search,.cats button,.variantBtn,.variantLabel,.code,.qtyBox,.qtyInput{border-color:var(--design-border);border-radius:var(--design-radius)}



/* BIN AMEEN - FLOATING WHATSAPP CONTACT BUTTON */
.ba-whatsapp-float{
  position:fixed;
  right:22px;
  bottom:22px;
  z-index:99999;
  width:66px;
  height:66px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:#25D366;
  color:#fff;
  text-decoration:none;
  box-shadow:0 5px 18px rgba(0,0,0,.22);
  -webkit-tap-highlight-color:transparent;
  transition:transform .2s ease, box-shadow .2s ease;
}
.ba-whatsapp-float:hover,
.ba-whatsapp-float:focus-visible{
  transform:translateY(-3px) scale(1.04);
  box-shadow:0 8px 22px rgba(0,0,0,.28);
  outline:none;
}
.ba-whatsapp-float::before{
  content:"";
  position:absolute;
  inset:-5px;
  border:2px solid #25D366;
  border-radius:50%;
  animation:baWhatsappPulse 2s infinite;
  pointer-events:none;
}
.ba-whatsapp-float svg{
  display:block;
  width:36px;
  height:36px;
  fill:#fff;
  position:relative;
  z-index:1;
}
@keyframes baWhatsappPulse{
  0%{transform:scale(.92);opacity:.8}
  70%{transform:scale(1.28);opacity:0}
  100%{transform:scale(1.28);opacity:0}
}
@media(max-width:600px){
  .ba-whatsapp-float{
    width:56px;
    height:56px;
    right:16px;
    bottom:16px;
  }
  .ba-whatsapp-float svg{width:30px;height:30px}
}
@media(prefers-reduced-motion:reduce){
  .ba-whatsapp-float::before{animation:none}
  .ba-whatsapp-float{transition:none}
}


/* NATURAL PAGE FLOW: HEADER, CAROUSEL, THEN CATALOGUE */
html{scroll-behavior:smooth;scroll-padding-top:0}
body{overflow-x:hidden}
#siteWrap{max-width:none;width:100%;margin:0 auto;padding:0}
.snap-scroll{height:auto;min-height:0;overflow:visible;overflow-x:clip;overscroll-behavior-y:auto;scroll-snap-type:none;scroll-behavior:auto;-webkit-overflow-scrolling:touch}
.snap-panel{width:min(100%,900px);margin:0 auto;padding:7px;}
.carousel-panel.snap-panel{padding:0!important;margin:0!important;width:100vw;max-width:100vw}
.header-panel,.carousel-panel{min-height:0;height:auto;display:flex;flex-direction:column;justify-content:flex-start}
.header-panel header{width:100%;margin-bottom:0}
.carousel-panel{padding:0!important;margin:0!important;width:100vw;max-width:100vw;position:relative;left:50%;transform:translateX(-50%)}
.banner-carousel{position:relative;width:100%;height:clamp(170px,28vh,260px);overflow:hidden;background:transparent;border:0;padding:0;margin:0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.banner-empty{height:100%;display:grid;place-items:center;font-size:clamp(20px,5vw,34px);font-weight:900;color:#1B2A4A}
.ba-slide{position:absolute;inset:0;display:block;color:inherit;text-decoration:none;opacity:0;pointer-events:none;transition:opacity .45s ease}
.ba-slide.active{opacity:1;pointer-events:auto}
.ba-slide.ba-image-error{background:#f1f5f9}
.ba-slide img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}

.header-panel,.carousel-panel{overflow:visible;max-height:none;opacity:1;transition:none;overflow-anchor:auto}

/* Fixed floating controls; touch scrolling does not drag them */
body:has(.viewer.open) .ba-whatsapp-float,body:has(.viewer.open) .ba-cart-float{display:none!important}
.ba-whatsapp-float,.ba-cart-float{position:fixed;z-index:100001;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.ba-whatsapp-float{right:16px;bottom:16px}
.ba-cart-float{right:16px;bottom:88px;width:56px;height:56px;border:0;border-radius:50%;background:#1B2A4A;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 5px 18px rgba(0,0,0,.24);padding:0}
.ba-cart-float svg{width:28px;height:28px;fill:#fff;pointer-events:none}
.ba-cart-count{position:absolute;right:-3px;top:-4px;min-width:21px;height:21px;padding:0 5px;border-radius:20px;background:#e53935;color:#fff;font:bold 12px Arial;display:grid;place-items:center;border:2px solid #fff}
.ba-whatsapp-float.is-draggable,.ba-cart-float.is-draggable{box-shadow:0 0 0 5px rgba(37,211,102,.22),0 8px 24px rgba(0,0,0,.3);transform:scale(1.06)}

.ba-trash-zone{display:none;position:fixed;z-index:100000;left:50%;bottom:18px;transform:translateX(-50%);padding:12px 22px 12px 48px;border:2px dashed #e53935;border-radius:10px;background:#fff;color:#b42318;font:bold 12px Arial;box-shadow:0 4px 18px rgba(0,0,0,.2);white-space:nowrap}.ba-trash-zone::before{content:"\1F5D1";position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:25px}
.ba-trash-zone.visible{display:block}
.ba-trash-zone.over{background:#fee2e2;border-color:#b42318}

@media(min-width:700px){.snap-panel{padding:12px}.banner-carousel{height:clamp(230px,42vh,390px)}.ba-whatsapp-float{right:26px;bottom:24px;width:66px;height:66px}.ba-whatsapp-float svg{width:38px;height:38px}.ba-cart-float{right:26px;bottom:108px;width:62px;height:62px}}

<script>

let products=[];
let sel={};
let cartData={};
let category="ALL";
let editingQty={};
let viewerEditingQty=false;

const catsEl=document.getElementById("cats");
const searchEl=document.getElementById("search");
const listEl=document.getElementById("list");

const viewSwitchEl=document.getElementById("viewSwitch");
let catalogueView="list";
let currentPage=1;
const PAGE_SIZE=20;
let remoteTotalItems=0;
let remotePaging=false;
let allCategoryNames=[];
async function fetchCataloguePage(page){
 const params=new URLSearchParams({page:String(page),limit:String(PAGE_SIZE),category:category,q:searchEl.value.trim()});
 const response=await fetch('/api/products?'+params.toString(),{cache:'no-store'});
 if(!response.ok)throw new Error('Catalogue page load failed: '+response.status);
 const result=await response.json();
 if(!result||!Array.isArray(result.items))throw new Error('Invalid paginated catalogue response');
 products=result.items;remoteTotalItems=result.total;currentPage=result.page;remotePaging=true;
 products.forEach(function(p){p._hasVariants=Array.isArray(p.variants)&&p.variants.length>0;if(!p._hasVariants)p.variants=[{name:'',label:'',size:'',code:p.code||'',img:p.img||'',mrp:p.mrp??null,salePrice:p.salePrice??p.sale_price??null,_singleProduct:true}];sel[p.id]=sel[p.id]||0;});
 render();
}
async function loadCategoryNames(){try{const r=await fetch('/api/categories',{cache:'no-store'});if(r.ok){const v=await r.json();if(Array.isArray(v))allCategoryNames=v;}}catch(e){}}

try{catalogueView=localStorage.getItem("binAmeenCatalogueView")==="grid"?"grid":"list";}catch(e){}
function updateViewSwitcher(){
  if(!viewSwitchEl)return;
  if(catalogueView==="grid"){
    viewSwitchEl.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><rect x="3" y="3" width="6" height="6"/><rect x="15" y="3" width="6" height="6"/><rect x="3" y="15" width="6" height="6"/><rect x="15" y="15" width="6" height="6"/></svg>';
    viewSwitchEl.setAttribute("aria-label","Switch to list view");
  }else{
    viewSwitchEl.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="square"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
    viewSwitchEl.setAttribute("aria-label","Switch to grid view");
  }
  listEl.classList.toggle("view-grid",catalogueView==="grid");
  listEl.classList.toggle("view-list",catalogueView==="list");
}
viewSwitchEl.addEventListener("click",function(){
  catalogueView=catalogueView==="list"?"grid":"list";
  try{localStorage.setItem("binAmeenCatalogueView",catalogueView);}catch(e){}
  updateViewSwitcher();
  render();
});
updateViewSwitcher();


const cartOverlay=document.getElementById("cartOverlay");
const cartItemsEl=document.getElementById("cartItems");
const countEl=document.getElementById("count");
const cartTotalEl=document.getElementById("cartTotal");

const viewerEl=document.getElementById("viewer");
const viewerImgEl=document.getElementById("viewerImg");
const viewerVariantTextEl=document.getElementById("viewerVariantText");
const viewerBadgesEl=document.getElementById("viewerBadges");
const viewerCodeTextEl=document.getElementById("viewerCodeText");
const viewerArrowLeftEl=document.querySelector(".viewerArrowLeft");
const viewerArrowRightEl=document.querySelector(".viewerArrowRight");
const viewerAddCartBtn=document.getElementById("viewerAddCartBtn");
const viewerQtyRow=document.getElementById("viewerQtyRow");

let viewerHistoryPushed=false;
let viewerProductId=null;
let viewerIndex=0;

const gateEl=document.getElementById("gate");
const gateCheckingEl=document.getElementById("gateChecking");
const gateFormEl=document.getElementById("gateForm");
const gatePasswordEl=document.getElementById("gatePassword");
const gateErrorEl=document.getElementById("gateError");
const siteWrapEl=document.getElementById("siteWrap");


/* ================= PASSWORD GATE ================= */

async function checkGate(){

gateEl.classList.add("open");

gateCheckingEl.style.display="";

gateFormEl.style.display="none";

try{

const response=await fetch("/api/public-status",{
method:"GET",
cache:"no-store"
});

const result=await response.json();

if(!result.protectionOn||result.authenticated){

unlockSite();

return;

}

gateCheckingEl.style.display="none";

gateFormEl.style.display="";

gatePasswordEl.focus();

}catch(error){

console.error("GATE STATUS ERROR:",error);

gateCheckingEl.style.display="none";

gateFormEl.style.display="";

}

}


function unlockSite(){

gateEl.classList.remove("open");

siteWrapEl.style.display="";

updateCartCount();

load();

}


async function submitGatePassword(){

const password=gatePasswordEl.value;

gateErrorEl.style.display="none";

if(!password){

return;

}

try{

const response=await fetch("/api/public-login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({
password:password
})

});

if(!response.ok){

gateErrorEl.style.display="";

gatePasswordEl.value="";

gatePasswordEl.focus();

return;

}

unlockSite();

}catch(error){

console.error("GATE LOGIN ERROR:",error);

gateErrorEl.textContent="Connection error. Please try again.";

gateErrorEl.style.display="";

}

}


gatePasswordEl.addEventListener(
"keydown",
function(e){

if(e.key==="Enter"){

submitGatePassword();

}

}
);


/* ================= LOAD PRODUCTS ================= */

async function load(){

listEl.innerHTML=
'<div class="loading">Loading products...</div>';

try{

const response=await fetch("/api/products?page=1&limit=20",{
method:"GET",cache:"no-store"
});

if(!response.ok){

const text=await response.text();

throw new Error(
"API Error "+response.status+
": "+text.substring(0,300)
);

}

const result=await response.json();
if(!result||!Array.isArray(result.items))throw new Error("Invalid products data");
products=result.items;remoteTotalItems=result.total;remotePaging=true;currentPage=1;
products.forEach(function(p){p._hasVariants=Array.isArray(p.variants)&&p.variants.length>0;if(!p._hasVariants)p.variants=[{name:"",label:"",size:"",code:p.code||"",img:p.img||"",mrp:p.mrp??null,salePrice:p.salePrice??p.sale_price??null,_singleProduct:true}];sel[p.id]=0;});
await loadCategoryNames();drawCats();render();

}catch(error){

console.error(error);

listEl.innerHTML=
'<div class="errorBox">'+
'<b>Products Load Error</b><br><br>'+
escapeHTML(error.message)+
'</div>';

}

}


/* ================= ESCAPE HTML ================= */

function escapeHTML(str){

return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* ================= CATEGORIES ================= */

function drawCats(){

const categorySet=new Set();

products.forEach(function(p){

const values=Array.isArray(p.categories)?p.categories:(Array.isArray(p.category)?p.category:String(p.category||"").split(",").map(x=>x.trim()).filter(Boolean));
values.forEach(function(value){if(value)categorySet.add(value);});

});

const categories=["ALL",...(allCategoryNames.length?allCategoryNames:[...categorySet])];

catsEl.innerHTML="";

categories.forEach(function(x){

const btn=document.createElement("button");

btn.textContent=
x==="ALL"?"ALL ITEMS":x;

if(x===category){

btn.className="active";

}

btn.onclick=function(){

category=x;
currentPage=1;

drawCats();
if(remotePaging)fetchCataloguePage(1).catch(e=>{console.error(e);});else render();

};

catsEl.appendChild(btn);

});

}

      /* ================= RENDER ================= */

function scrollToProductList(){const el=document.getElementById("list");if(el)el.scrollIntoView({behavior:"smooth",block:"start"});}

function render(){

const q=
searchEl.value
.toLowerCase()
.trim();

const filtered=
products.filter(function(p){
if(p.visible===false || p.disabled===true) return false;
const name=
String(p.name||"")
.toLowerCase();

const variants=
Array.isArray(p.variants)
?p.variants:[];

const codeMatch=
variants.some(function(v){

return String(v.code||"")
.toLowerCase()
.includes(q);

});

return(
(category==="ALL"||(Array.isArray(p.categories)?p.categories:(Array.isArray(p.category)?p.category:String(p.category||"").split(",").map(x=>x.trim()))).includes(category))
&&
(
name.includes(q)||
codeMatch
)
);

});


listEl.innerHTML="";
const totalItems=remotePaging?remoteTotalItems:filtered.length;
const totalPages=Math.max(1,Math.ceil(totalItems/PAGE_SIZE));
currentPage=Math.min(Math.max(1,currentPage),totalPages);
const pageItems=remotePaging?filtered:filtered.slice((currentPage-1)*PAGE_SIZE,currentPage*PAGE_SIZE);
const paginationEl=document.getElementById("pagination");
if(paginationEl){
 paginationEl.style.display=totalItems>0?"flex":"none";
 paginationEl.innerHTML=`<button type="button" id="prevPage" aria-label="Previous page" ${currentPage===1?'disabled':''}>‹ PREVIOUS</button><button type="button" id="nextPage" aria-label="Next page" ${currentPage===totalPages?'disabled':''}>NEXT ›</button>`;
 paginationEl.querySelector('#prevPage').onclick=()=>{if(currentPage>1){if(remotePaging)fetchCataloguePage(currentPage-1).then(scrollToProductList).catch(console.error);else{currentPage--;render();scrollToProductList();}}};
 paginationEl.querySelector('#nextPage').onclick=()=>{if(currentPage<totalPages){if(remotePaging)fetchCataloguePage(currentPage+1).then(scrollToProductList).catch(console.error);else{currentPage++;render();scrollToProductList();}}};
}
if(!filtered.length){

listEl.innerHTML=
'<div class="card">No items found</div>';

return;

}


pageItems.forEach(function(p){

if(!Array.isArray(p.variants)||!p.variants.length){ return; }

let index=
sel[p.id]||0;

if(index>=p.variants.length){

index=0;
sel[p.id]=0;

}

const v=
p.variants[index];

const key=
p.id+"_"+index;

const quantity=
cartData[key]
?cartData[key].qty
:0;

const card=
document.createElement("div");

card.className="card";
card.dataset.productId=String(p.id);

const pic=
document.createElement("div");

pic.className="pic";

pic.setAttribute("role","button");
pic.setAttribute("tabindex","0");
pic.setAttribute("aria-label","View product details: "+String(p.name||"product"));
pic.style.cursor="pointer";
pic.addEventListener("click",function(e){
 e.preventDefault();
 e.stopPropagation();
 openViewer(p.id,index);
});
pic.addEventListener("keydown",function(e){
 if(e.key==="Enter"||e.key===" "){
  e.preventDefault();
  openViewer(p.id,index);
 }
});

const img=
document.createElement("img");

img.src=
v.img||
p.img||
"";

img.alt=
p.name||"";
img.width=400;
img.height=400;
img.loading="lazy";
img.decoding="async";
img.fetchPriority="low";
img.draggable=false;

pic.appendChild(img);

const info=
document.createElement("div");

info.className="info";

const name=
document.createElement("b");

name.className="name";

const selectedVariantName=(v.name||v.label||v.size||"").trim();
name.textContent=catalogueView==="grid" ? (p.name||"") : (p._hasVariants ? selectedVariantName : (p.name||""));

/* LIST VIEW ONLY: item-level RETAIL/MRP and CATEGORY badges */
if(catalogueView==="list"){
  const badges=document.createElement("div");
  badges.className="listItemBadges";

  const categoryValues=Array.isArray(p.categories)?p.categories:(Array.isArray(p.category)?p.category:String(p.category||"").split(",").map(x=>x.trim()).filter(Boolean));
  const categoryValue=String(categoryValues[0]||"").trim();
  if(categoryValue){const categoryBadge=document.createElement("span");categoryBadge.className="listItemBadge";categoryBadge.textContent=categoryValue;badges.appendChild(categoryBadge);}
  const variantRetail=(v && v.mrp!==undefined && v.mrp!==null && String(v.mrp).trim()!=="")?v.mrp:null;
  const productRetail=(p && p.mrp!==undefined && p.mrp!==null && String(p.mrp).trim()!=="")?p.mrp:null;
  const retailValue=variantRetail!==null?variantRetail:productRetail;
  if(retailValue!==null){const retailBadge=document.createElement("span");retailBadge.className="listItemBadge";retailBadge.textContent="RETAIL: "+String(retailValue);badges.appendChild(retailBadge);}

  if(badges.childElementCount){
    info.appendChild(badges);
  }
}

const variantText=
document.createElement("div");
variantText.className="variantText";
variantText.style.display="none";
variantText.textContent="";

const qbox=
document.createElement("div");

qbox.className="q";
if(!p._hasVariants) qbox.classList.add("singleProductQty");

if(p._hasVariants && p.variants.length>1){

const left=
document.createElement("button");

left.className=
"arrowBtn";

left.textContent="‹";

left.onclick=function(e){

e.stopPropagation();

prevVariant(p.id);

};

qbox.appendChild(left);

}

const minus=
document.createElement("button");

minus.textContent="−";

minus.onclick=function(e){

e.stopPropagation();

change(p.id,-1);

};

let qtyEl;

if(editingQty[p.id]){

qtyEl=
document.createElement("input");

qtyEl.className=
"qtyInput";

qtyEl.type=
"tel";

qtyEl.inputMode=
"numeric";

qtyEl.pattern=
"[0-9]*";

qtyEl.value=
quantity||"";

qtyEl.onclick=function(e){

e.stopPropagation();

};

qtyEl.onkeydown=function(e){

/* ================= DESIGN SETTINGS ================= */
function applyCatalogueDesign(design){
    if(!design || typeof design!=='object') return;
    const root=document.documentElement;
    const map={
        pageBg:'--design-page-bg', headerBg:'--design-header-bg',
        primaryColor:'--design-primary', textColor:'--design-text',
        cardBg:'--design-card-bg', borderColor:'--design-border'
    };
    Object.keys(map).forEach(key=>{
        if(typeof design[key]==='string' && /^#[0-9a-fA-F]{6}$/.test(design[key])){
            root.style.setProperty(map[key],design[key]);
        }
    });
    if(Number.isFinite(Number(design.borderRadius))) root.style.setProperty('--design-radius',Math.max(0,Math.min(24,Number(design.borderRadius)))+'px');
    if(Number.isFinite(Number(design.productImageSize))) root.style.setProperty('--design-image-size',Math.max(56,Math.min(160,Number(design.productImageSize)))+'px');
    if(Number.isFinite(Number(design.cardPadding))) root.style.setProperty('--design-card-padding',Math.max(3,Math.min(24,Number(design.cardPadding)))+'px');
    if(Number.isFinite(Number(design.desktopContentWidth))) root.style.setProperty('--design-content-width',Math.max(480,Math.min(1400,Number(design.desktopContentWidth)))+'px');
    if(Number.isFinite(Number(design.desktopColumns))) root.style.setProperty('--design-desktop-columns',String(Math.max(1,Math.min(3,Math.round(Number(design.desktopColumns))))));
    if(typeof design.siteTitle==='string' && design.siteTitle.trim()){
        const logo=document.querySelector('.logoBox');
        if(logo) logo.textContent=design.siteTitle.trim();
    }
}
async function loadCatalogueDesign(){
    try{
        const response=await fetch('/api/design',{cache:'no-store'});
        if(!response.ok) return;
        const result=await response.json();
        applyCatalogueDesign(result.published || result);
    }catch(error){console.warn('DESIGN SETTINGS LOAD:',error);}
}

   (s.subtitle?'<span>'+escapeHTML(s.subtitle)+'</span>':'')+'</div></div>';
 }).join('')+(slides.length>1?'<div class="ba-carousel-counter"><button type="button" aria-label="Previous slide" onclick="baCarouselPrev(event)">‹</button><span>'+ (baCarouselIndex+1)+' / '+slides.length+'</span><button type="button" aria-label="Next slide" onclick="baCarouselNext(event)">›</button></div>':'');
 if(baCarouselSettings.autoplay&&slides.length>1){
  baCarouselTimer=setInterval(()=>{
   baCarouselIndex=(baCarouselIndex+1)%slides.length;
   renderPublicCarousel();
  },Math.max(2000,Number(baCarouselSettings.interval)||5000));
 }
}
function baCarouselGo(direction){
 const slides=baCarouselSlides.map(baNormalizeCarouselSlide).filter(x=>x&&x.enabled&&x.imageUrl).sort((a,b)=>(Number(a.order)||0)-(Number(b.order)||0));
 if(slides.length<2)return;
 baCarouselIndex=(baCarouselIndex+direction+slides.length)%slides.length;
 renderPublicCarousel();
}
function baCarouselPrev(e){if(e)e.stopPropagation();baCarouselGo(-1);}
function baCarouselNext(e){if(e)e.stopPropagation();baCarouselGo(1);}

async function loadPublicCarousel(){
 const host=document.getElementById('bannerCarousel');
 try{
  const r=await fetch('/api/carousel?_='+Date.now(),{cache:'no-store',headers:{'Accept':'application/json'}});
  const d=await r.json();
  if(!r.ok)throw new Error((d&&d.error)||('HTTP '+r.status));
  const payload=d.data||d.carousel||d;
  const raw=Array.isArray(payload)?payload:(Array.isArray(payload.slides)?payload.slides:[]);
  baCarouselSlides=raw;
  baCarouselSettings={autoplay:payload.autoplay!==false,interval:Number(payload.interval)||5000};
  renderPublicCarousel();
 }catch(e){
  console.warn('Carousel load failed:',e);
  baCarouselSlides=[];
  if(host)host.innerHTML='';
  baSetCarouselVisibility(false);
 }
}
