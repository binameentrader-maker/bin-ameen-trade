<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BIN AMEEN TRADER</title>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
}

body{
  background:#c8d3df;
  font-family:Arial,sans-serif;
  color:#1f293d;
  padding:12px;
  -webkit-user-select:none;
  user-select:none;
}

.wrap{
  max-width:480px;
  margin:auto;
}

header,.card{
  background:#fff;
  border:2px solid #8fa0b5;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

h2{
  text-align:center;
  margin:4px;
}

/* CART BUTTON */

.cart-open-btn{
  width:100%;
  background:#1f293d;
  color:#fff;
  border:0;
  border-radius:7px;
  padding:11px;
  font-weight:bold;
  cursor:pointer;
  margin-bottom:10px;
}

/* CATEGORIES */

.cats{
  display:flex;
  gap:6px;
  overflow:auto;
  margin:10px 0;
  padding-bottom:3px;
  scrollbar-width:none;
}

.cats::-webkit-scrollbar{
  display:none;
}

button{
  border:0;
  border-radius:7px;
  padding:9px;
  font-weight:bold;
  cursor:pointer;
  -webkit-user-select:none;
  user-select:none;
}

.cats button{
  background:#fff;
  border:1px solid #8fa0b5;
  white-space:nowrap;
}

.active,.main{
  background:#1f293d!important;
  color:#fff;
}

/* SEARCH */

.search{
  width:100%;
  padding:10px;
  border:2px solid #8fa0b5;
  border-radius:8px;
  margin-bottom:12px;
  background:#fff;
  color:#1f293d;
  -webkit-user-select:text;
  user-select:text;
}

/* PRODUCT CARD */

.card{
  display:flex;
  gap:10px;
  align-items:center;
}

.pic{
  width:100px;
  height:110px;
  border:1px solid #8fa0b5;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  background:#fff;
  cursor:zoom-in;

  -webkit-touch-callout:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

.pic img{
  width:100%;
  height:100%;
  max-width:100%;
  max-height:100%;
  object-fit:contain;

  pointer-events:none;
  -webkit-user-drag:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

.watermark{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-25deg);
  font-size:9px;
  font-weight:bold;
  color:rgba(31,41,61,.18);
  white-space:nowrap;
  pointer-events:none;
  user-select:none;
}

.info{
  flex:1;
  min-width:0;
}

.code,.v{
  font-size:12px;
  font-weight:bold;
  background:#f1f5f9;
  padding:4px 7px;
  border-radius:5px;
}

.name{
  display:block;
  margin-top:5px;
}

.variant-control{
  display:flex;
  align-items:center;
  gap:4px;
  margin:7px 0;
}

.variant-control button{
  padding:6px 9px;
  background:#475569;
  color:#fff;
}

.variant-label{
  flex:1;
  text-align:center;
  font-size:12px;
  font-weight:bold;
  background:#f1f5f9;
  padding:6px;
  border-radius:5px;
}

.q{
  display:flex;
  gap:5px;
  align-items:center;
}

.q button{
  background:#475569;
  color:white;
  min-width:32px;
}

/* CART MODAL */

.cart-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:9990;
  background:rgba(0,0,0,.65);
  padding:15px;
  align-items:center;
  justify-content:center;
}

.cart-overlay.open{
  display:flex;
}

.cartbox{
  width:min(100%,480px);
  max-height:90vh;
  background:#fff;
  border:2px solid #8fa0b5;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background:#1f293d;
  color:#fff;
  flex-shrink:0;
}

.cart-header h3{
  margin:0;
  font-size:17px;
}

.cart-close{
  width:34px;
  height:34px;
  padding:0;
  border-radius:50%;
  background:#fff;
  color:#1f293d;
  font-size:19px;
  font-weight:bold;
}

.cart-scroll{
  overflow-y:auto;
  padding:10px;
}

.item{
  padding:10px;
  border:1px solid #8fa0b5;
  border-radius:8px;
  margin:7px 0;
  background:#f8fafc;
}

.item-name{
  font-weight:bold;
  line-height:1.35;
}

.item-info{
  font-size:13px;
  margin:4px 0;
  color:#475569;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:7px;
}

.cart-controls button{
  background:#475569;
  color:#fff;
  min-width:32px;
}

.remove{
  margin-left:auto;
  background:#991b1b!important;
}

.cart-footer{
  border-top:1px solid #8fa0b5;
  padding:10px;
  background:#fff;
  flex-shrink:0;
}

.cart-total{
  font-weight:bold;
  padding:5px 0 9px;
}

.whatsapp-btn{
  width:100%;
  background:#16a34a;
  color:#fff;
  padding:12px;
  border-radius:8px;
  font-weight:bold;
  border:0;
}

.empty-cart{
  text-align:center;
  padding:25px 10px;
  color:#64748b;
}

/* IMAGE VIEWER */

.viewer{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.82);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;

  -webkit-user-select:none;
  user-select:none;
}

.viewer.open{
  display:flex;
}

.viewer-box{
  width:min(95vw,500px);
  max-height:90vh;
  background:#fff;
  border-radius:12px;
  padding:15px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}

.viewer-box img{
  max-width:100%;
  max-height:80vh;
  object-fit:contain;

  pointer-events:none;
  -webkit-user-drag:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

.viewer-watermark{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-25deg);
  font-size:20px;
  font-weight:bold;
  color:rgba(31,41,61,.18);
  white-space:nowrap;
  pointer-events:none;
  user-select:none;
}

.close-viewer{
  position:absolute;
  right:8px;
  top:8px;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#1f293d;
  color:#fff;
  font-size:20px;
  padding:0;
  z-index:5;
}

/* MOBILE */

@media(max-width:380px){

  .pic{
    width:85px;
    height:95px;
  }

  .card{
    gap:7px;
  }

  .variant-label{
    font-size:11px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h2>BIN AMEEN TRADER</h2>
  <div style="text-align:center">
    Call: 03331390045
  </div>
</header>

<button
  id="viewCartButton"
  class="cart-open-btn"
  type="button"
>
  View Cart (<span id="count">0</span>)
</button>

<div class="cats" id="cats"></div>

<input
  class="search"
  id="search"
  type="search"
  placeholder="Search product name or SKU code..."
  autocomplete="off"
>

<div id="list"></div>

</div>


<!-- ================= CART MODAL ================= -->

<div
  class="cart-overlay"
  id="cartOverlay"
  role="dialog"
  aria-modal="true"
  aria-hidden="true"
>

  <div
    class="cartbox"
    onclick="event.stopPropagation()"
  >

    <div class="cart-header">

      <h3>Your Selected Items</h3>

      <button
        id="cartCloseButton"
        class="cart-close"
        type="button"
        aria-label="Close Cart"
      >
        ✕
      </button>

    </div>

    <div class="cart-scroll">

      <div id="cartItems"></div>

    </div>

    <div class="cart-footer">

      <div class="cart-total">
        Total Items:
        <span id="cartTotal">0</span>
      </div>

      <button
        id="whatsappButton"
        class="whatsapp-btn"
        type="button"
      >
        Send Order on WhatsApp
      </button>

    </div>

  </div>

</div>


<!-- ================= IMAGE VIEWER ================= -->

<div
  class="viewer"
  id="viewer"
  role="dialog"
  aria-modal="true"
  aria-hidden="true"
>

  <div
    class="viewer-box"
    id="viewerBox"
  >

    <button
      id="closeViewerButton"
      class="close-viewer"
      type="button"
      aria-label="Close Image"
    >
      ✕
    </button>

    <img
      id="viewerImg"
      src=""
      alt="Product"
      draggable="false"
    >

    <div class="viewer-watermark">
      BIN AMEEN TRADER
    </div>

  </div>

</div>


<script>

/* =========================================================
   DATA
========================================================= */

let products = [];
let selectedVariant = {};
let cartData = {};
let category = "ALL";


/* =========================================================
   DOM ELEMENTS
========================================================= */

const list = document.getElementById("list");
const cats = document.getElementById("cats");
const search = document.getElementById("search");

const count = document.getElementById("count");
const cartTotal = document.getElementById("cartTotal");

const cartOverlay = document.getElementById("cartOverlay");
const cartItems = document.getElementById("cartItems");

const viewCartButton =
  document.getElementById("viewCartButton");

const cartCloseButton =
  document.getElementById("cartCloseButton");

const whatsappButton =
  document.getElementById("whatsappButton");

const viewer =
  document.getElementById("viewer");

const viewerBox =
  document.getElementById("viewerBox");

const viewerImg =
  document.getElementById("viewerImg");

const closeViewerButton =
  document.getElementById("closeViewerButton");


/* =========================================================
   LOAD PRODUCTS
========================================================= */

async function load(){

  try{

    const response =
      await fetch("/api/products", {
        cache:"no-store"
      });

    if(!response.ok){
      throw new Error(
        "Products API returned " +
        response.status
      );
    }

    products = await response.json();

    if(!Array.isArray(products)){
      products=[];
    }

    products.forEach(function(product){

      selectedVariant[product.id]=0;

    });

    drawCats();

    render();

    updateCartCount();

  }catch(error){

    console.error(error);

    list.innerHTML =
      '<div class="card">' +
      'Unable to load products.' +
      '</div>';

  }

}


/* =========================================================
   CATEGORIES
========================================================= */

function drawCats(){

  const categories = [
    "ALL",
    ...new Set(
      products
        .map(function(product){
          return product.category;
        })
        .filter(Boolean)
    )
  ];

  cats.innerHTML = categories
    .map(function(item){

      return `
        <button
          type="button"
          class="${item === category ? "active" : ""}"
          data-category="${escapeHtml(item)}"
        >
          ${item === "ALL"
            ? "ALL ITEMS"
            : escapeHtml(item)}
        </button>
      `;

    })
    .join("");

  cats
    .querySelectorAll("button")
    .forEach(function(button){

      button.addEventListener("click",function(){

        category =
          button.dataset.category;

        drawCats();
        render();

      });

    });

}


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function render(){

  const q =
    search.value
      .toLowerCase()
      .trim();

  const filtered =
    products.filter(function(product){

      const name =
        String(product.name || "")
          .toLowerCase();

      const variants =
        Array.isArray(product.variants)
          ? product.variants
          : [];

      const codeMatch =
        variants.some(function(variant){

          return String(
            variant.code || ""
          )
          .toLowerCase()
          .includes(q);

        });

      const skuMatch =
        variants.some(function(variant){

          return String(
            variant.sku || ""
          )
          .toLowerCase()
          .includes(q);

        });

      const categoryMatch =
        category === "ALL" ||
        product.category === category;

      return (
        categoryMatch &&
        (
          name.includes(q) ||
          codeMatch ||
          skuMatch
        )
      );

    });

  list.innerHTML = "";

  if(!filtered.length){

    list.innerHTML =
      '<div class="card">' +
      'No items found' +
      '</div>';

    return;
  }

  filtered.forEach(function(product){

    if(
      !Array.isArray(product.variants) ||
      !product.variants.length
    ){
      return;
    }

    let index =
      selectedVariant[product.id] || 0;

    if(index >= product.variants.length){
      index=0;
      selectedVariant[product.id]=0;
    }

    const variant =
      product.variants[index];

    const variantKey =
      getVariantKey(variant,index);

    const cartKey =
      String(product.id) +
      "_" +
      variantKey;

    const quantity =
      cartData[cartKey]?.qty || 0;

    const image =
      variant.img ||
      variant.image ||
      product.img ||
      product.image ||
      "";

    const card =
      document.createElement("div");

    card.className="card";


    /* IMAGE */

    const picture =
      document.createElement("div");

    picture.className="pic";

    picture.setAttribute(
      "aria-label",
      "View product image"
    );

    const img =
      document.createElement("img");

    img.src=image;

    img.alt =
      product.name || "Product";

    img.draggable=false;

    img.setAttribute(
      "draggable",
      "false"
    );

    img.addEventListener(
      "error",
      function(){
        img.style.display="none";
      }
    );

    const watermark =
      document.createElement("div");

    watermark.className="watermark";

    watermark.textContent =
      "BIN AMEEN TRADER";

    picture.appendChild(img);
    picture.appendChild(watermark);


    /* IMPORTANT:
       Image viewer event is attached to parent,
       while actual IMG has pointer-events:none.
    */

    picture.addEventListener(
      "click",
      function(event){

        event.preventDefault();
        event.stopPropagation();

        openViewer(image);

      }
    );


    /* PRODUCT INFO */

    const info =
      document.createElement("div");

    info.className="info";

    const code =
      document.createElement("span");

    code.className="code";

    code.textContent =
      "CODE: " +
      (variant.code ||
       variant.sku ||
       "");

    const name =
      document.createElement("b");

    name.className="name";

    name.textContent =
      product.name || "";


    /* VARIANT CONTROL */

    const variantControl =
      document.createElement("div");

    variantControl.className =
      "variant-control";

    const previousButton =
      document.createElement("button");

    previousButton.type="button";

    previousButton.textContent="‹";

    previousButton.addEventListener(
      "click",
      function(event){

        event.preventDefault();
        event.stopPropagation();

        prevVariant(product.id);

      }
    );

    const variantLabel =
      document.createElement("div");

    variantLabel.className =
      "variant-label";

    variantLabel.textContent =
      variant.label ||
      variant.size ||
      "";


    const nextButton =
      document.createElement("button");

    nextButton.type="button";

    nextButton.textContent="›";

    nextButton.addEventListener(
      "click",
      function(event){

        event.preventDefault();
        event.stopPropagation();

        nextVariant(product.id);

      }
    );

    variantControl.appendChild(
      previousButton
    );

    variantControl.appendChild(
      variantLabel
    );

    variantControl.appendChild(
      nextButton
    );


    /* QUANTITY */

    const quantityBox =
      document.createElement("div");

    quantityBox.className="q";

    const minus =
      document.createElement("button");

    minus.type="button";
    minus.textContent="−";

    minus.addEventListener(
      "click",
      function(){

        change(product.id,-1);

      }
    );

    const number =
      document.createElement("b");

    number.textContent =
      quantity;


    const plus =
      document.createElement("button");

    plus.type="button";
    plus.textContent="+";

    plus.addEventListener(
      "click",
      function(){

        change(product.id,1);

      }
    );

    quantityBox.appendChild(minus);
    quantityBox.appendChild(number);
    quantityBox.appendChild(plus);


    info.appendChild(code);
    info.appendChild(name);
    info.appendChild(variantControl);
    info.appendChild(quantityBox);

    card.appendChild(picture);
    card.appendChild(info);

    list.appendChild(card);

  });

}


/* =========================================================
   VARIANT KEY
========================================================= */

function getVariantKey(variant,index){

  return String(
    variant.label ||
    variant.size ||
    variant.code ||
    variant.sku ||
    index
  );

}


/* =========================================================
   PREVIOUS VARIANT
========================================================= */

function prevVariant(id){

  const product =
    products.find(function(item){

      return String(item.id) === String(id);

    });

  if(
    !product ||
    !Array.isArray(product.variants) ||
    !product.variants.length
  ){
    return;
  }

  let index =
    selectedVariant[product.id] || 0;

  index--;

  if(index < 0){
    index =
      product.variants.length - 1;
  }

  selectedVariant[product.id]=index;

  render();

}


/* =========================================================
   NEXT VARIANT
========================================================= */

function nextVariant(id){

  const product =
    products.find(function(item){

      return String(item.id) === String(id);

    });

  if(
    !product ||
    !Array.isArray(product.variants) ||
    !product.variants.length
  ){
    return;
  }

  let index =
    selectedVariant[product.id] || 0;

  index++;

  if(index >= product.variants.length){
    index=0;
  }

  selectedVariant[product.id]=index;

  render();

}


/* =========================================================
   CHANGE PRODUCT QUANTITY
========================================================= */

function change(id,d){

  const product =
    products.find(function(item){

      return String(item.id) === String(id);

    });

  if(
    !product ||
    !Array.isArray(product.variants) ||
    !product.variants.length
  ){
    return;
  }

  const index =
    selectedVariant[product.id] || 0;

  const variant =
    product.variants[index];

  const variantKey =
    getVariantKey(variant,index);

  const cartKey =
    String(product.id) +
    "_" +
    variantKey;

  let quantity =
    cartData[cartKey]?.qty || 0;

  quantity += d;

  if(quantity <= 0){

    delete cartData[cartKey];

  }else{

    cartData[cartKey]={

      id:product.id,

      name:
        product.name || "",

      variant:
        variant.label ||
        variant.size ||
        "",

      code:
        variant.code ||
        variant.sku ||
        "",

      img:
        variant.img ||
        variant.image ||
        product.img ||
        product.image ||
        "",

      qty:quantity

    };

  }

  saveCart();

  updateCartCount();

  render();

  if(
    cartOverlay.classList.contains("open")
  ){
    renderCart();
  }

}


/* =========================================================
   CART COUNT
========================================================= */

function updateCartCount(){

  const total =
    Object.values(cartData)
      .reduce(
        function(sum,item){

          return sum +
            Number(item.qty || 0);

        },
        0
      );

  count.textContent=total;

  cartTotal.textContent=total;

}


/* =========================================================
   OPEN CART
========================================================= */

function showCart(){

  renderCart();

  cartOverlay.classList.add("open");

  cartOverlay.setAttribute(
    "aria-hidden",
    "false"
  );

  document.body.style.overflow="hidden";

}


/* =========================================================
   CLOSE CART
==============
