<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BIN AMEEN TRADER</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#c8d3df;
  font-family:Arial,sans-serif;
  color:#1f293d;
  padding:12px;
}

.wrap{
  max-width:480px;
  margin:auto;
}

header,.card{
  background:#fff;
  border:2px solid #8fa0b5;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
}

h2{
  text-align:center;
  margin:4px;
}

button{
  border:0;
  border-radius:7px;
  padding:9px;
  font-weight:bold;
  cursor:pointer;
}

.main{
  background:#1f293d;
  color:#fff;
}

.cart-button{
  width:100%;
  margin-bottom:10px;
}

.cats{
  display:flex;
  gap:6px;
  overflow:auto;
  margin:10px 0;
  padding-bottom:3px;
}

.cats button{
  background:#fff;
  border:1px solid #8fa0b5;
  white-space:nowrap;
}

.active{
  background:#1f293d!important;
  color:#fff;
}

.search{
  width:100%;
  padding:10px;
  border:2px solid #8fa0b5;
  border-radius:8px;
  margin-bottom:12px;
}

.card{
  display:flex;
  gap:10px;
  align-items:center;
}

.pic{
  width:100px;
  height:110px;
  border:1px solid #8fa0b5;
  border-radius:7px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  background:#fff;
  cursor:pointer;

  /* IMAGE PROTECTION */
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

.pic img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;

  /* IMAGE PROTECTION */
  pointer-events:none;
  -webkit-user-drag:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

.watermark{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-25deg);
  font-size:9px;
  font-weight:bold;
  color:rgba(31,41,61,.18);
  white-space:nowrap;
  pointer-events:none;
  user-select:none;
}

.info{
  flex:1;
  min-width:0;
}

.code,.v{
  font-size:12px;
  font-weight:bold;
  background:#f1f5f9;
  padding:4px 7px;
  border-radius:5px;
}

.name{
  display:block;
  margin-top:5px;
}

.variant-control{
  display:flex;
  align-items:center;
  gap:4px;
  margin:7px 0;
}

.variant-control button{
  padding:6px 9px;
  background:#475569;
  color:#fff;
}

.variant-label{
  flex:1;
  text-align:center;
  font-size:12px;
  font-weight:bold;
  background:#f1f5f9;
  padding:6px;
  border-radius:5px;
}

.q{
  display:flex;
  gap:5px;
  align-items:center;
}

.q button{
  background:#475569;
  color:white;
  min-width:32px;
}


/* =========================
   CART MODAL
========================= */

.cart-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:9990;
  background:rgba(0,0,0,.65);
  padding:15px;
  align-items:center;
  justify-content:center;
}

.cart-overlay.open{
  display:flex;
}

.cartbox{
  width:min(100%,480px);
  max-height:90vh;
  background:#fff;
  border:2px solid #8fa0b5;
  border-radius:12px;
  overflow:hidden;
  box-shadow:0 15px 50px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
}

.cart-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  background:#1f293d;
  color:#fff;
}

.cart-header h3{
  margin:0;
}

.cart-close{
  width:34px;
  height:34px;
  padding:0;
  border-radius:50%;
  background:#fff;
  color:#1f293d;
  font-size:18px;
}

.cart-items{
  overflow-y:auto;
  padding:10px;
}

.item{
  padding:10px;
  border:1px solid #8fa0b5;
  border-radius:8px;
  margin:7px 0;
  background:#f8fafc;
}

.item-name{
  font-weight:bold;
}

.item-info{
  font-size:13px;
  margin:4px 0;
}

.cart-controls{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:7px;
}

.cart-controls button{
  background:#475569;
  color:#fff;
}

.remove{
  margin-left:auto;
  background:#991b1b!important;
}

.cart-footer{
  border-top:1px solid #8fa0b5;
  padding:10px;
  background:#fff;
}

.cart-total{
  font-weight:bold;
  padding:5px 0 9px;
}

.whatsapp-btn{
  width:100%;
  background:#16a34a;
  color:#fff;
  padding:12px;
}


/* =========================
   IMAGE VIEWER
========================= */

.viewer{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:9999;
  align-items:center;
  justify-content:center;
  padding:20px;

  -webkit-user-select:none;
  user-select:none;
}

.viewer.open{
  display:flex;
}

.viewer-box{
  width:min(95vw,500px);
  max-height:90vh;
  background:#fff;
  border-radius:12px;
  padding:15px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.viewer-box img{
  max-width:100%;
  max-height:80vh;
  object-fit:contain;

  pointer-events:none;
  -webkit-user-drag:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}

.viewer-watermark{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-25deg);
  font-size:20px;
  font-weight:bold;
  color:rgba(31,41,61,.18);
  white-space:nowrap;
  pointer-events:none;
}

.close-viewer{
  position:absolute;
  right:8px;
  top:8px;
  width:36px;
  height:36px;
  border-radius:50%;
  background:#1f293d;
  color:#fff;
  font-size:20px;
  padding:0;
  z-index:5;
}

.empty-cart{
  text-align:center;
  padding:25px 10px;
  color:#64748b;
}

@media(max-width:380px){

  .pic{
    width:85px;
    height:95px;
  }

  .card{
    gap:7px;
  }

  .variant-label{
    font-size:11px;
  }

}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h2>BIN AMEEN TRADER</h2>
  <div style="text-align:center">
    Call: 03331390045
  </div>
</header>


<!-- CART BUTTON -->

<button
  id="viewCartBtn"
  class="main cart-button"
  type="button"
>
  View Cart (<span id="count">0</span>)
</button>


<!-- CATEGORIES -->

<div class="cats" id="cats"></div>


<!-- SEARCH -->

<input
  class="search"
  id="search"
  placeholder="Search product name or SKU code..."
>


<!-- PRODUCTS -->

<div id="list"></div>

</div>


<!-- =========================
     CART MODAL
========================= -->

<div
  class="cart-overlay"
  id="cartOverlay"
>

  <div
    class="cartbox"
    onclick="event.stopPropagation()"
  >

    <div class="cart-header">

      <h3>Your Selected Items</h3>

      <button
        id="cartCloseBtn"
        class="cart-close"
        type="button"
      >
        ✕
      </button>

    </div>


    <div class="cart-items">

      <div id="cartItems"></div>

    </div>


    <div class="cart-footer">

      <div class="cart-total">
        Total Items:
        <span id="cartTotal">0</span>
      </div>

      <button
        id="whatsappBtn"
        class="whatsapp-btn"
        type="button"
      >
        Send Order on WhatsApp
      </button>

    </div>

  </div>

</div>


<!-- =========================
     IMAGE VIEWER
========================= -->

<div
  class="viewer"
  id="viewer"
>

  <div class="viewer-box">

    <button
      id="closeViewerBtn"
      class="close-viewer"
      type="button"
    >
      ✕
    </button>

    <img
      id="viewerImg"
      src=""
      alt="Product"
      draggable="false"
    >

    <div class="viewer-watermark">
      BIN AMEEN TRADER
    </div>

  </div>

</div>


<script>

/* =========================
   DATA
========================= */

let products=[];
let sel={};
let cartData={};
let category="ALL";


/* =========================
   DOM
========================= */

const list =
  document.getElementById("list");

const cats =
  document.getElementById("cats");

const search =
  document.getElementById("search");

const count =
  document.getElementById("count");

const cartTotal =
  document.getElementById("cartTotal");

const cartOverlay =
  document.getElementById("cartOverlay");

const cartItems =
  document.getElementById("cartItems");

const viewCartBtn =
  document.getElementById("viewCartBtn");

const cartCloseBtn =
  document.getElementById("cartCloseBtn");

const whatsappBtn =
  document.getElementById("whatsappBtn");

const viewer =
  document.getElementById("viewer");

const viewerImg =
  document.getElementById("viewerImg");

const closeViewerBtn =
  document.getElementById("closeViewerBtn");


/* =========================
   LOAD PRODUCTS
========================= */

async function load(){

  try{

    const r =
      await fetch('/api/products');

    products =
      await r.json();

    products.forEach(p=>{

      sel[p.id]=0;

    });

    drawCats();

    render();

    updateCartCount();

  }catch(e){

    list.innerHTML =
      '<div class="card">' +
      'Unable to load products.' +
      '</div>';

    console.error(e);

  }

}


/* =========================
   CATEGORIES
========================= */

function drawCats(){

  const a=[
    'ALL',
    ...new Set(
      products
        .map(p=>p.category)
        .filter(Boolean)
    )
  ];

  cats.innerHTML=a.map(x=>`

    <button
      class="${x==category?'active':''}"
      data-category="${escapeHtml(x)}"
      type="button"
    >
      ${x==='ALL'
        ?'ALL ITEMS'
        :escapeHtml(x)}
    </button>

  `).join('');


  cats
    .querySelectorAll("button")
    .forEach(btn=>{

      btn.addEventListener(
        "click",
        function(){

          category =
            btn.dataset.category;

          drawCats();

          render();

        }
      );

    });

}


/* =========================
   CATEGORY
========================= */

function setCategory(x){

  category=x;

  drawCats();

  render();

}


/* =========================
   RENDER PRODUCTS
========================= */

function render(){

  const q =
    search.value
      .toLowerCase()
      .trim();


  const a =
    products.filter(p=>{

      const name =
        (p.name||'')
        .toLowerCase();


      const variants =
        Array.isArray(p.variants)
          ?p.variants
          :[];


      const code =
        variants.some(v=>

          (v.code||'')
            .toLowerCase()
            .includes(q)

        );


      return (

        (category==='ALL' ||
         p.category===category)

        &&

        (
          name.includes(q) ||
          code
        )

      );

    });


  list.innerHTML='';


  if(!a.length){

    list.innerHTML =
      '<div class="card">' +
      'No items found' +
      '</div>';

    return;

  }


  a.forEach(p=>{

    if(
      !Array.isArray(p.variants) ||
      !p.variants.length
    ){

      return;

    }


    let i =
      sel[p.id]||0;


    if(i>=p.variants.length){

      i=0;

    }


    const v =
      p.variants[i];


    const k =
      p.id+'_'+v.label;


    const n =
      cartData[k]?.qty||0;


    const d =
      document.createElement('div');


    d.className='card';


    const image =
      v.img ||
      p.img ||
      '';


    /* =====================
       IMAGE
    ===================== */

    const pic =
      document.createElement("div");

    pic.className="pic";


    const img =
      document.createElement("img");

    img.src=image;

    img.alt=
      p.name||'Product';

    img.draggable=false;


    img.addEventListener(
      "error",
      function(){

        img.style.display='none';

      }
    );


    const watermark =
      document.createElement("div");

    watermark.className=
      "watermark";

    watermark.textContent=
      "BIN AMEEN TRADER";


    pic.appendChild(img);

    pic.appendChild(watermark);


    /*
      IMPORTANT:
      صرف pic پر click event ہے۔
      IMG پر pointer-events:none ہے۔
      اس طرح image tap کرنے پر
      viewer کھلے گا۔
    */

    pic.addEventListener(
      "click",
      function(e){

        e.preventDefault();

        e.stopPropagation();

        openViewer(image);

      }
    );


    /* =====================
       INFO
    ===================== */

    const info =
      document.createElement("div");

    info.className="info";


    const code =
      document.createElement("span");

    code.className="code";

    code.textContent=
      "CODE: " +
      (v.code||'');


    const name =
      document.createElement("b");

    name.className="name";

    name.textContent=
      p.name||'';


    /* =====================
       VARIANTS
    ===================== */

    const variantControl =
      document.createElement("div");

    variantControl.className=
      "variant-control";


    const prev =
      document.createElement("button");

    prev.type="button";

    prev.textContent="‹";


    prev.addEventListener(
      "click",
      function(e){

        e.preventDefault();

        e.stopPropagation();

        prevVariant(p.id);

      }
    );


    const label =
      document.createElement("div");

    label.className=
      "variant-label";

    label.textContent=
      v.label||'';


    const next =
      document.createElement("button");

    next.type="button";

    next.textContent="›";


    next.addEventListener(
      "click",
      function(e){

        e.preventDefault();

        e.stopPropagation();

        nextVariant(p.id);

      }
    );


    variantControl.appendChild(prev);

    variantControl.appendChild(label);

    variantControl.appendChild(next);


    /* =====================
       QUANTITY
    ===================== */

    const qbox =
      document.createElement("div");

    qbox.className="q";


    const minus =
      document.createElement("button");

    minus.type="button";

    minus.textContent="−";


    minus.addEventListener(
      "click",
      function(){

        change(p.id,-1);

      }
    );


    const number =
      document.createElement("b");

    number.textContent=n;


    const plus =
      document.createElement("button");

    plus.type="button";

    plus.textContent="+";


    plus.addEventListener(
      "click",
      function(){

        change(p.id,1);

      }
    );


    qbox.appendChild(minus);

    qbox.appendChild(number);

    qbox.appendChild(plus);


    info.appendChild(code);

    info.appendChild(name);

    info.appendChild(variantControl);

    info.appendChild(qbox);


    d.appendChild(pic);

    d.appendChild(info);


    list.appendChild(d);

  });

}


/* =========================
   PREVIOUS VARIANT
========================= */

function prevVariant(id){

  const p =
    products.find(x=>x.id===id);


  if(
    !p ||
    !p.variants?.length
  ){

    return;

  }


  let i =
    sel[id]||0;


  i--;


  if(i<0){

    i=
      p.variants.length-1;

  }


  sel[id]=i;

  render();

}


/* =========================
   NEXT VARIANT
========================= */

function nextVariant(id){

  const p =
    products.find(x=>x.id===id);


  if(
    !p ||
    !p.variants?.length
  ){

    return;

  }


  let i =
    sel[id]||0;


  i++;


  if(i>=p.variants.length){

    i=0;

  }


  sel[id]=i;

  render();

}


/* =========================
   CHANGE QUANTITY
========================= */

function change(id,d){

  const p =
    products.find(x=>x.id===id);


  if(
    !p ||
    !p.variants?.length
  ){

    return;

  }


  const v =
    p.variants[
      sel[id]||0
    ];


  const k =
    p.id+'_'+v.label;


  let n =
    (cartData[k]?.qty||0)+d;


  if(n<=0){

    delete cartData[k];

  }else{

    cartData[k]={

      id:p.id,

      name:p.name,

      variant:v.label,

      code:v.code||'',

      img:v.img||p.img||'',

      qty:n

    };

  }


  updateCartCount();

  render();


  if(
    cartOverlay.classList.contains('open')
  ){

    renderCart();

  }

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

  const total =
    Object.values(cartData)
      .reduce(
        (s,x)=>
          s+Number(x.qty||0),
        0
      );


  count.textContent=total;

  cartTotal.textContent=total;

}


/* =========================
   SHOW CART
========================= */

function showCart(){

  renderCart();

  cartOverlay.classList.add('open');

  document.body.style.overflow=
    'hidden';

}


/* =========================
   CLOSE CART
========================= */

function closeCart(){

  cartOverlay.classList.remove('open');

  document.body.style.overflow='';

}


/* =========================
   RENDER CART
========================= */

function renderCart(){

  const keys =
    Object.keys(cartData);


  if(!keys.length){

    cartItems.innerHTML =
      '<div class="empty-cart">' +
      'Cart is empty' +
      '</div>';

    updateCartCount();

    return;

  }


  cartItems.innerHTML='';


  keys.forEach(k=>{

    const x =
      cartData[k];


    const item =
      document.createElement("div");

    item.className="item";


    const itemName =
      document.createElement("div");

    itemName.className=
      "item-name";

    itemName.textContent=
      x.name;


    const itemInfo =
      document.createElement("div");

    itemInfo.className=
      "item-info";

    itemInfo.textContent=
      x.variant+
      " | Code: "+
      x.code;


    const controls =
      document.createElement("div");

    controls.className=
      "cart-controls";


    const minus =
      document.createElement("button");

    minus.type="button";

    minus.textContent="−";


    minus.addEventListener(
      "click",
      function(){

        cartChange(k,-1);

      }
    );


    const qty =
      document.createElement("b");

    qty.textContent=
      x.qty;


    const plus =
      document.createElement("button");

    plus.type="button";

    plus.textContent="+";


    plus.addEventListener(
      "click",
      function(){

        cartChange(k,1);

      }
    );


    const remove =
      document.createElement("button");

    remove.type="button";

    remove.className="remove";

    remove.textContent=
      "Remove";


    remove.addEventListener(
      "click",
      function(){

        removeCart(k);

      }
    );


    controls.appendChild(minus);

    controls.appendChild(qty);

    controls.appendChild(plus);

    controls.appendChild(remove);


    item.appendChild(itemName);

    item.appendChild(itemInfo);

    item.appendChild(controls);


    cartItems.appendChild(item);

  });


  updateCartCount();

}


/* =========================
   CART CHANGE
========================= */

function cartChange(k,d){

  if(!cartData[k]){

    return;

  }


  cartData[k].qty += d;


  if(cartData[k].qty<=0){

    delete cartData[k];

  }


  renderCart();

  render();

}


/* =========================
   REMOVE
========================= */

function removeCart(k){

  delete cartData[k];

  renderCart();

  render();

}


/* =========================
   IMAGE VIEWER
========================= */

function openViewer(src){

  if(!src){

    return;

  }


  viewerImg.src=src;

  viewer.classList.add('open');

  document.body.style.overflow=
    'hidden';

}


/* =========================
   CLOSE VIEWER
========================= */

function closeViewer(){

  viewer.classList.remove('open');

  viewerImg.src='';

  document.body.style.overflow='';

}


/* =========================
   WHATSAPP
========================= */

function wa(){

  const keys =
    Object.keys(cartData);


  if(!keys.length){

    alert('Cart is empty');

    return;

  }


  let m =
    '*NEW ORDER - BIN AMEEN TRADER*\\n\\n';


  keys.forEach((k,i)=>{

    const x =
      cartData[k];


    m +=
      `${i+1}. *${x.name}*\\n`+
      `Variant: ${x.variant}\\n`+
      `Code: ${x.code} | Qty: *${x.qty}*\\n\\n`;

  });


  window.open(
    'https://wa.me/923331390045?text='+
    encodeURIComponent(m),
    '_blank'
  );

}


/* =========================
   BASIC HTML SAFETY
========================= */

function escapeHtml(str){

  return String(str??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');

}


/* =========================
   SEARCH
========================= */

search.oninput=render;


/* =========================
   CART BUTTON EVENTS
