<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIN AMEEN TRADER</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#c8d3df;
  font-family:Arial,Helvetica,sans-serif;
  color:#1f293d;
  -webkit-user-select:none;
  user-select:none;
}

body{padding:7px}

.wrap{
  width:100%;
  max-width:480px;
  margin:auto;
}

/* HEADER */
header{
  background:#fff;
  border:2px solid #8fa0b5;
  border-radius:0;
  padding:7px;
  margin-bottom:7px;
}

header h2{
  text-align:center;
  font-size:22px;
  margin:2px 0 3px;
}

header div{
  text-align:center;
  font-size:14px;
}

/* BUTTONS */
button{
  border:0;
  border-radius:0;
  padding:7px 9px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

.main{
  background:#1f293d;
  color:white;
}

.cartTop{
  width:100%;
  margin-bottom:7px;
  padding:10px;
  font-size:15px;
}

/* CATEGORIES */
.cats{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin:7px 0;
  padding-bottom:2px;
}

.cats button{
  background:#fff;
  color:#1f293d;
  border:1px solid #8fa0b5;
  white-space:nowrap;
}

.cats .active{
  background:#1f293d;
  color:white;
}

/* SEARCH */
.search{
  width:100%;
  padding:9px;
  border:2px solid #8fa0b5;
  border-radius:0;
  background:white;
  font-size:14px;
  margin-bottom:7px;
}

/* PRODUCT CARD */
.card{
  background:#fff;
  border:2px solid #8fa0b5;
  border-radius:0;
  padding:6px;
  margin-bottom:6px;
  display:flex;
  gap:7px;
  align-items:center;
  min-height:98px;
}

/* IMAGE */
.pic{
  width:78px;
  height:78px;
  border:1px solid #8fa0b5;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  background:white;
  cursor:pointer;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-drag:none;
}

/* WATERMARK */
.pic:after{
  content:"BIN AMEEN";
  position:absolute;
  font-size:8px;
  font-weight:bold;
  color:rgba(31,41,61,.16);
  transform:rotate(-25deg);
  pointer-events:none;
}

/* INFO */
.info{
  flex:1;
  min-width:0;
}

.productName{
  display:block;
  font-size:12px;
  font-weight:bold;
  line-height:15px;
  margin:1px 0 4px;

  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* VARIANT NAV */
.variantNav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  margin:3px 0 4px;
}

.variantNav button{
  background:#475569;
  color:white;
  width:28px;
  height:25px;
  padding:0;
}

.variantCode{
  background:#f1f5f9;
  border:1px solid #cbd5e1;
  padding:4px 6px;
  font-size:10px;
  font-weight:bold;
  min-width:65px;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* QUANTITY */
.q{
  display:flex;
  align-items:center;
  gap:4px;
}

.q button{
  background:#475569;
  color:white;
  width:27px;
  height:25px;
  padding:0;
}

.q b{
  min-width:17px;
  text-align:center;
  font-size:12px;
}

/* ERROR / EMPTY */
.noItems{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:12px;
  text-align:center;
  font-size:13px;
}

/* =========================
   CART FULL SCREEN
========================= */

.cartScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:9000;
  background:#c8d3df;
  overflow-y:auto;
}

.cartScreen.open{
  display:block;
}

.cartInner{
  width:100%;
  max-width:480px;
  margin:auto;
  padding:7px;
}

.cartTopBar{
  background:#1f293d;
  color:white;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
  margin-bottom:7px;
}

.cartTopBar button{
  background:white;
  color:#1f293d;
}

.cartTitle{
  background:white;
  border:2px solid #8fa0b5;
  padding:10px;
  text-align:center;
  margin-bottom:7px;
}

.cartTitle h3{
  margin:0;
}

.cartItem{
  background:white;
  border:2px solid #8fa0b5;
  padding:8px;
  margin-bottom:6px;
  font-size:13px;
}

.cartItemQty{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:6px;
}

.cartItemQty button{
  background:#475569;
  color:white;
  width:27px;
  height:25px;
  padding:0;
}

.cartButtons{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.cartButtons button{
  flex:1;
}

/* =========================
   FULL PRODUCT VIEW
========================= */

.viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#fff;
  overflow:auto;
}

.viewer.open{
  display:block;
}

.viewerTop{
  height:48px;
  background:#1f293d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 8px;
  position:sticky;
  top:0;
  z-index:5;
}

.viewerTop button{
  background:#fff;
  color:#1f293d;
  min-width:65px;
}

.viewerBody{
  max-width:600px;
  margin:auto;
  padding:10px;
  text-align:center;
}

.viewerImageBox{
  width:100%;
  height:min(64vh,620px);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#fff;
  border:1px solid #ddd;
  overflow:hidden;
}

.viewerImageBox img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-drag:none;
}

.viewerWatermark{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-25deg);
  font-size:30px;
  font-weight:bold;
  color:rgba(31,41,61,.13);
  pointer-events:none;
  white-space:nowrap;
}

.viewerName{
  font-size:18px;
  font-weight:bold;
  line-height:23px;
  margin:10px 4px 5px;
}

.viewerNav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  margin:7px 0;
}

.viewerNav button{
  background:#1f293d;
  color:#fff;
  width:42px;
  height:36px;
  font-size:19px;
  padding:0;
}

.viewerCode{
  border:2px solid #8fa0b5;
  background:#f1f5f9;
  padding:8px 12px;
  min-width:100px;
  font-weight:bold;
  font-size:13px;
}

.viewerQty{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  margin-top:8px;
}

.viewerQty button{
  background:#1f293d;
  color:#fff;
  width:40px;
  height:36px;
  font-size:20px;
  padding:0;
}

.viewerQty b{
  min-width:32px;
  font-size:17px;
}

/* LOADING */
.loading{
  background:white;
  border:2px solid #8fa0b5;
  padding:15px;
  text-align:center;
}

/* MOBILE */
@media(max-width:380px){

  body{padding:5px}

  header h2{
    font-size:20px;
  }

  .pic{
    width:70px;
    height:70px;
  }

  .card{
    min-height:88px;
    padding:5px;
  }

  .productName{
    font-size:11px;
    line-height:14px;
  }

  .viewerName{
    font-size:17px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<header>
  <h2>BIN AMEEN TRADER</h2>
  <div>Call: 03331390045</div>
</header>

<button class="main cartTop" onclick="showCart()">
  View Cart (<span id="count">0</span>)
</button>

<div class="cats" id="cats"></div>

<input
  class="search"
  id="search"
  placeholder="Search product name or SKU code..."
  autocomplete="off"
>

<div id="list">
  <div class="loading">Loading products...</div>
</div>

</div>


<!-- =========================
     CART SCREEN
========================= -->

<div class="cartScreen" id="cartScreen">

  <div class="cartInner">

    <div class="cartTopBar">

      <button onclick="closeCart()">← Back</button>

      <b>YOUR CART</b>

      <span>
        <span id="cartScreenCount">0</span>
      </span>

    </div>

    <div class="cartTitle">
      <h3>Your Selected Items</h3>
    </div>

    <div id="cartItems"></div>

    <div class="cartButtons">

      <button
        class="main"
        onclick="closeCart()"
      >
        Continue Shopping
      </button>

      <button
        class="main"
        onclick="wa()"
      >
        WhatsApp Order
      </button>

    </div>

  </div>

</div>


<!-- =========================
     FULL PRODUCT VIEW
========================= -->

<div class="viewer" id="viewer">

  <div class="viewerTop">

    <button onclick="closeViewer()">
      ← Back
    </button>

    <b>PRODUCT VIEW</b>

    <button onclick="showCartFromViewer()">
      Cart (<span id="viewerCount">0</span>)
    </button>

  </div>

  <div class="viewerBody">

    <div class="viewerImageBox">

      <img
        id="viewerImg"
        src=""
        alt=""
        draggable="false"
        oncontextmenu="return false"
      >

      <div class="viewerWatermark">
        BIN AMEEN TRADER
      </div>

    </div>

    <div
      class="viewerName"
      id="viewerName"
    ></div>

    <div class="viewerNav">

      <button onclick="previousVariant()">←</button>

      <div
        class="viewerCode"
        id="viewerCode"
      ></div>

      <button onclick="nextVariant()">→</button>

    </div>

    <div class="viewerQty">

      <button onclick="viewerChange(-1)">−</button>

      <b id="viewerQty">0</b>

      <button onclick="viewerChange(1)">+</button>

    </div>

  </div>

</div>


<script>

let products = [];
let sel = {};
let cart = {};
let category = "ALL";

let viewerProduct = null;
let viewerIndex = 0;


/* =========================
   LOAD
========================= */

async function load(){

  const list =
    document.getElementById("list");

  try{

    const response =
      await fetch("/api/products",{
        cache:"no-store"
      });

    if(!response.ok){

      throw new Error(
        "API returned " +
        response.status
      );

    }

    const data =
      await response.json();

    /*
      Support both:
      [
        {...}
      ]

      and

      {
        products:[...]
      }
    */

    if(Array.isArray(data)){

      products = data;

    }else if(
      data &&
      Array.isArray(data.products)
    ){

      products = data.products;

    }else{

      throw new Error(
        "Invalid products data"
      );

    }


    products.forEach((p,index)=>{

      /*
        Make sure every product
        has an ID.
      */

      if(
        p.id === undefined ||
        p.id === null
      ){

        p.id = "p_" + index;

      }


      /*
        Make sure variants exist.
      */

      if(
        !Array.isArray(p.variants) ||
        p.variants.length === 0
      ){

        p.variants = [{
          label:"",
          code:p.code || "",
          img:p.img || "",
          name:p.name || ""
        }];

      }


      /*
        Clean variants.
      */

      p.variants =
        p.variants.map(v => {

          return {

            label:
              v && v.label != null
                ? String(v.label)
                : "",

            code:
              v && v.code != null
                ? String(v.code)
                : "",

            img:
              v && v.img
                ? String(v.img)
                : "",

            name:
              v && v.name
                ? String(v.name)
                : ""

          };

        });


      sel[p.id] = 0;

    });


    /*
      NOW categories are created
      only after products are loaded.
    */

    category = "ALL";

    drawCats();
    render();


  }catch(error){

    console.error(
      "PRODUCT LOAD ERROR:",
      error
    );

    list.innerHTML = `
      <div class="noItems">
        <b>Products could not be loaded.</b>
        <br><br>
        Please refresh the page.
      </div>
    `;

  }

}


/* =========================
   CATEGORIES
========================= */

function drawCats(){

  const cats =
    document.getElementById("cats");

  const categoryList = [
    "ALL",
    ...new Set(
      products
        .map(p => String(p.category || "").trim())
        .filter(Boolean)
    )
  ];


  cats.innerHTML =
    categoryList.map(x => {

      const active =
        x === category
          ? "active"
          : "";

      const label =
        x === "ALL"
          ? "ALL ITEMS"
          : x;

      return `
        <button
          class="${active}"
          onclick='setCategory(${JSON.stringify(x)})'
        >
          ${escapeHTML(label)}
        </button>
      `;

    }).join("");

}


function setCategory(x){

  category = x;

  drawCats();
  render();

}


/* =========================
   HOME PRODUCTS
========================= */

function render(){

  const search =
    document.getElementById("search");

  const list =
    document.getElementById("list");

  const searchValue =
    String(search.value || "")
      .toLowerCase()
      .trim();


  const filtered =
    products.filter(p => {

      const categoryOK =
        category === "ALL" ||
        String(p.category || "").trim() === category;


      const productName =
        String(p.name || "")
          .toLowerCase();


      const variantMatch =
        p.variants.some(v => {

          const code =
            String(v.code || "")
              .toLowerCase();

          const label =
            String(v.label || "")
              .toLowerCase();

          const name =
            String(v.name || "")
              .toLowerCase();

          return (
            code.includes(searchValue) ||
            label.includes(searchValue) ||
            name.includes(searchValue)
          );

        });


      return (
        categoryOK &&
        (
          productName.includes(searchValue) ||
          variantMatch
        )
      );

    });


  if(!filtered.length){

    list.innerHTML =
      '<div class="noItems">No items found</div>';

    return;

  }


  list.innerHTML = "";


  filtered.forEach(p => {

    let index =
      Number(sel[p.id] || 0);


    if(
      index < 0 ||
      index >= p.variants.length
    ){

      index = 0;

    }


    sel[p.id] = index;


    const v =
      p.variants[index];


    const key =
      String(p.id) +
      "_" +
      String(index);


    const qty =
      cart[key]
        ? cart[key].qty
        : 0;


    const image =
      v.img ||
      p.img ||
      "";


    const card =
      document.createElement("div");

    card.className = "card";


    card.innerHTML = `

      <div
        class="pic"
        onclick='openViewer(${JSON.stringify(p.id)},${index})'
      >

        <img
          src="${escapeAttr(image)}"
          alt=""
          draggable="false"
          oncontextmenu="return false"
        >

      </div>


      <div class="info">

        <span class="productName">
          ${escapeHTML(
            getVariantName(p,v)
          )}
        </span>


        <div class="variantNav">

          <button
            onclick='changeVariant(${JSON.stringify(p.id)},-1)'
          >
            ←
          </button>

          <div class="variantCode">
            ${escapeHTML(
              v.code || "CODE"
            )}
          </div>

          <button
            onclick='changeVariant(${JSON.stringify(p.id)},1)'
          >
            →
          </button>

        </div>


        <div class="q">

          <button
            onclick='change(${JSON.stringify(p.id)},-1)'
          >
            −
          </button>

          <b>${qty}</b>

          <button
            onclick='change(${JSON.stringify(p.id)},1)'
          >
            +
          </button>

        </div>

      </div>

    `;


    list.appendChild(card);

  });

}


/* =========================
   VARIANT NAME
========================= */

function getVariantName(product,variant){

  /*
    For variants with their own name:
    use that name.

    Example:
    PERT PLUS ANTI HAIR FALL SHAMPOO 400ML
  */

  if(
    variant &&
    String(variant.name || "").trim()
  ){

    return variant.name;

  }


  /*
    Normal products:
    Product Name + Size
  */

  if(
    variant &&
    String(variant.label || "").trim()
  ){

    return (
      String(product.name || "") +
      " " +
      String(variant.label)
    );

  }


  return String(product.name || "");

}


/* =========================
   HOME VARIANT
========================= */

function changeVariant(id,d){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );


  if(
    !p ||
    !p.variants ||
    !p.variants.length
  ){

    return;

  }


  let i =
    Number(sel[p.id] || 0);


  i += d;


  if(i < 0){

    i =
      p.variants.length - 1;

  }


  if(
    i >= p.variants.length
  ){

    i = 0;

  }


  sel[p.id] = i;

  render();

}


/* =========================
   ADD / REMOVE CART
========================= */

function change(id,d){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );


  if(!p){
    return;
  }


  const index =
    Number(sel[p.id] || 0);


  const v =
    p.variants[index];


  const key =
    String(p.id) +
    "_" +
    String(index);


  const newQty =
    Number(
      cart[key]?.qty || 0
    ) + d;


  if(newQty <= 0){

    delete cart[key];

  }else{

    cart[key] = {

      productName:
        String(p.name || ""),

      name:
        getVariantName(p,v),

      variant:
        String(v.label || ""),

      code:
        String(v.code || ""),

      qty:newQty,

      img:
        v.img ||
        p.img ||
        ""

    };

  }


  updateCartCount();

  render();

}


/* =========================
   CART COUNT
========================= */

function updateCartCount(){

  const total =
    Object.values(cart)
      .reduce(
        (sum,x) =>
          sum +
          Number(x.qty || 0),
        0
      );


  document.getElementById("count")
    .textContent = total;


  document.getElementById("cartScreenCount")
    .textContent = total;


  document.getElementById("viewerCount")
    .textContent = total;

}


/* =========================
   CART OPEN
========================= */

function showCart(){

  renderCart();

  document
    .getElementById("cartScreen")
    .classList.add("open");

  document.body.style.overflow =
    "hidden";

}


function closeCart(){

  document
    .getElementById("cartScreen")
    .classList.remove("open");

  document.body.style.overflow =
    "";

}


/* =========================
   CART CONTENT
========================= */

function renderCart(){

  const box =
    document.getElementById("cartItems");


  const items =
    Object.entries(cart);


  if(!items.length){

    box.innerHTML =
      '<div class="cartItem">Cart is empty</div>';

    return;

  }


  box.innerHTML =
    items.map(([key,x]) => {

      return `

        <div class="cartItem">

          <b>
            ${escapeHTML(
              x.productName ||
              x.name ||
              ""
            )}
          </b>

          ${
            x.variant
              ? ` (${escapeHTML(x.variant)})`
              : ""
          }

          <br>

          Code:
          ${escapeHTML(x.code || "")}

          &nbsp; | &nbsp;

          Qty:
          <b>${x.qty}</b>

          <div class="cartItemQty">

            <button
              onclick='cartChange(${JSON.stringify(key)},-1)'
            >
              −
            </button>

            <b>${x.qty}</b>

            <button
              onclick='cartChange(${JSON.stringify(key)},1)'
            >
              +
            </button>

          </div>

        </div>

      `;

    }).join("");

}


function cartChange(key,d){

  if(!cart[key]){
    return;
  }


  const newQty =
    Number(cart[key].qty || 0) + d;


  if(newQty <= 0){

    delete cart[key];

  }else{

    cart[key].qty =
      newQty;

  }


  updateCartCount();

  renderCart();

}


/* =========================
   FULL PRODUCT VIEW
========================= */

function openViewer(id,index){

  const p =
    products.find(
      x => String(x.id) === String(id)
    );


  if(!p){
    return;
  }


  viewerProduct = p;


  viewerIndex =
    Math.max(
      0,
      Math.min(
        Number(index) || 0,
        p.variants.length - 1
      )
    );


  updateViewer();


  document
    .getElementById("viewer")
    .classList.add("open");


  document.body.style.overflow =
    "hidden";

}


function closeViewer(){

  document
    .getElementById("viewer")
    .classList.remove("open");


  document.b
