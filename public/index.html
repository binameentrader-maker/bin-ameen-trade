<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>BIN AMEEN TRADER</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
padding:0;
background:#c8d3df;
font-family:Arial,Helvetica,sans-serif;
color:#1f293d;
}

body{padding:7px}

.wrap{
max-width:480px;
margin:auto;
}

header{
background:#fff;
border:2px solid #8fa0b5;
padding:8px;
margin-bottom:8px;
text-align:center;
}

.logoBox{
border:2px solid #8fa0b5;
padding:6px 4px;
font-size:23px;
font-weight:900;
}

.phoneRow{
display:flex;
align-items:center;
justify-content:center;
margin-top:10px;
position:relative;
}

.phoneLine{
height:2px;
background:#9aa7b9;
position:absolute;
left:35px;
right:35px;
top:50%;
}

.phoneBox{
position:relative;
background:#fff;
border:2px solid #8fa0b5;
padding:4px 12px;
font-size:15px;
font-weight:bold;
z-index:1;
}

button{
border:0;
border-radius:0;
padding:7px;
font-weight:bold;
cursor:pointer;
}

.main{
background:#1f293d!important;
color:#fff;
padding:11px;
font-size:16px;
font-weight:bold;
}

.cats{
display:flex;
gap:5px;
overflow:auto;
margin:8px 0;
}

.cats button{
background:#fff;
border:2px solid #8fa0b5;
white-space:nowrap;
font-size:13px;
padding:7px 12px;
}

.cats button.active{
background:#1f293d;
color:#fff;
}

.search{
width:100%;
padding:10px;
border:2px solid #8fa0b5;
font-size:14px;
margin-bottom:8px;
outline:none;
background:#fff;
}

.card{
background:#fff;
border:2px solid #8fa0b5;
padding:7px;
margin-bottom:8px;
display:flex;
gap:9px;
align-items:center;
}

.pic{
width:92px;
height:92px;
border:1px solid #8fa0b5;
display:flex;
align-items:center;
justify-content:center;
flex-shrink:0;
position:relative;
overflow:hidden;
background:#fff;
cursor:pointer;
}

.pic img{
width:100%;
height:100%;
object-fit:contain;
pointer-events:none;
}

.info{
flex:1;
min-width:0;
}

.code{
display:inline-block;
font-size:11px;
font-weight:bold;
background:#f1f5f9;
border:1px solid #8fa0b5;
padding:3px 5px;
color:#475569;
}

.name{
display:block;
font-size:14px;
font-weight:900;
margin-top:4px;
line-height:1.15;
}

/* SELECTION BUTTONS */

.twoVariant{
display:flex;
gap:5px;
flex-wrap:wrap;
margin:6px 0;
}

.variantBtn{
background:#fff;
border:2px solid #8fa0b5;
color:#475569;
font-size:12px;
padding:6px 9px;
}

.variantBtn.selected{
background:#1f293d;
color:#fff;
border-color:#1f293d;
}

.variantRow{
display:flex;
align-items:center;
gap:4px;
margin:6px 0;
}

.arrowBtn{
background:#475569;
color:#fff;
font-size:18px;
width:34px;
height:31px;
padding:0;
}

.variantLabel{
flex:1;
text-align:center;
font-size:12px;
font-weight:bold;
background:#f8fafc;
border:2px solid #8fa0b5;
padding:6px 3px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.q{
display:flex;
gap:4px;
align-items:center;
}

.q button{
background:#475569;
color:#fff;
font-size:17px;
width:32px;
height:30px;
padding:0;
}

.qtyBox{
min-width:40px;
height:30px;
display:flex;
align-items:center;
justify-content:center;
background:#fff;
border:2px solid #8fa0b5;
font-size:15px;
color:#111;
}

.emailFooter{
background:#fff;
border:2px solid #8fa0b5;
padding:9px 5px;
margin-top:6px;
margin-bottom:7px;
text-align:center;
font-size:15px;
font-weight:bold;
color:#475569;
}

.loading{
text-align:center;
padding:15px;
background:#fff;
border:2px solid #8fa0b5;
}

.errorBox{
background:#fff;
border:2px solid #9b2226;
padding:14px;
font-size:13px;
line-height:20px;
word-break:break-word;
}

/* CART */

.cartOverlay{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.65);
z-index:9000;
padding:8px;
align-items:center;
justify-content:center;
}

.cartOverlay.open{
display:flex;
}

.cartbox{
width:min(100%,470px);
max-height:90vh;
overflow:auto;
background:#fff;
border:2px solid #8fa0b5;
padding:10px;
}

.cartHeader{
display:flex;
align-items:center;
justify-content:space-between;
border-bottom:1px solid #d1d5db;
padding-bottom:7px;
margin-bottom:7px;
}

.cartHeader h3{
margin:0;
font-size:18px;
}

.cartClose{
background:#475569;
color:#fff;
width:35px;
height:35px;
font-size:18px;
padding:0;
}

.item{
padding:8px;
border:1px solid #8fa0b5;
margin:5px 0;
background:#f8fafc;
}

.itemName{
font-weight:bold;
font-size:14px;
}

.itemInfo{
font-size:12px;
margin-top:4px;
}

.cartControls{
display:flex;
gap:5px;
align-items:center;
margin-top:7px;
}

.cartControls button{
background:#475569;
color:#fff;
padding:6px 10px;
}

.removeBtn{
margin-left:auto;
background:#9b2226!important;
}

.total{
font-weight:bold;
margin:10px 0;
padding-top:7px;
border-top:1px solid #d1d5db;
font-size:14px;
}

/* IMAGE VIEWER */

.viewer{
display:none;
position:fixed;
z-index:99999;
inset:0;
background:rgba(0,0,0,.82);
align-items:center;
justify-content:center;
padding:10px;
}

.viewer.open{
display:flex;
}

.viewerBox{
position:relative;
width:min(95vw,480px);
height:min(85vh,600px);
background:#fff;
padding:12px;
display:flex;
align-items:center;
justify-content:center;
overflow:hidden;
}

.viewerBox img{
max-width:100%;
max-height:100%;
object-fit:contain;
}

.closeViewer{
position:absolute;
right:5px;
top:5px;
width:35px;
height:35px;
background:#1f293d;
color:#fff;
font-size:18px;
padding:0;
}

.viewerWatermark{
position:absolute;
left:50%;
top:50%;
transform:translate(-50%,-50%) rotate(-25deg);
font-size:20px;
font-weight:bold;
color:rgba(31,41,61,.16);
white-space:nowrap;
pointer-events:none;
}

@media(max-width:420px){

body{padding:5px}

.logoBox{font-size:21px}

.phoneBox{
font-size:14px;
padding:4px 10px;
}

.card{
padding:6px;
gap:8px;
}

.pic{
width:88px;
height:88px;
}

.name{font-size:13px}

.code{font-size:10px}

.variantBtn{
font-size:11px;
padding:5px 7px;
}

.arrowBtn{
width:31px;
height:29px;
}

.variantLabel{
font-size:11px;
}

.q button{
width:30px;
height:28px;
}

.qtyBox{
height:28px;
min-width:36px;
}

.emailFooter{
font-size:14px;
}

}
</style>
</head>

<body>

<div class="wrap">

<header>

<div class="logoBox">
BIN AMEEN TRADER
</div>

<div class="phoneRow">
<div class="phoneLine"></div>

<div class="phoneBox">
☎ 03331390045
</div>
</div>

</header>

<button class="main" style="width:100%" onclick="showCart()">
🛒 View Cart (<span id="count">0</span>)
</button>

<div class="cats" id="cats"></div>

<input
class="search"
id="search"
placeholder="Search product name or SKU code..."
autocomplete="off"
>

<div id="list">
<div class="loading">Loading products...</div>
</div>

<div class="emailFooter">
✉ binameentrader@gmail.com
</div>

</div>


<!-- CART -->

<div class="cartOverlay" id="cartOverlay">

<div class="cartbox">

<div class="cartHeader">

<h3>Your Selected Items</h3>

<button class="cartClose" onclick="closeCart()">
✕
</button>

</div>

<div id="cartItems"></div>

<div class="total">
Total Items: <span id="cartTotal">0</span>
</div>

<button
class="main"
style="width:100%"
onclick="wa()"
>
Send Order on WhatsApp
</button>

</div>
</div>


<!-- IMAGE VIEWER -->

<div class="viewer" id="viewer">

<div class="viewerBox">

<button
class="closeViewer"
onclick="closeViewer()"
>
✕
</button>

<img
id="viewerImg"
src=""
alt="Product"
draggable="false"
>

<div class="viewerWatermark">
BIN AMEEN TRADER
</div>

</div>
</div>


<script>

let products=[];
let sel={};
let cartData={};
let category="ALL";

const catsEl=document.getElementById("cats");
const searchEl=document.getElementById("search");
const listEl=document.getElementById("list");

const cartOverlay=document.getElementById("cartOverlay");
const cartItemsEl=document.getElementById("cartItems");
const countEl=document.getElementById("count");
const cartTotalEl=document.getElementById("cartTotal");

const viewerEl=document.getElementById("viewer");
const viewerImgEl=document.getElementById("viewerImg");


/* LOAD PRODUCTS */

async function load(){

listEl.innerHTML=
'<div class="loading">Loading products...</div>';

try{

const response=await fetch("/api/products?"+Date.now(),{
method:"GET",
cache:"no-store",
headers:{
"Accept":"application/json"
}
});

const text=await response.text();

if(!response.ok){

throw new Error(
"API ERROR "+response.status+
": "+text.substring(0,300)
);

}

let data;

try{
data=JSON.parse(text);
}catch(e){
throw new Error(
"API نے JSON نہیں دیا: "+text.substring(0,300)
);
}

if(!Array.isArray(data)){
throw new Error("Products data درست array نہیں ہے۔");
}

products=data;

products.forEach(function(p){

if(!Array.isArray(p.variants)){

p.variants=[{
label:p.label||"",
code:p.code||"",
img:p.img||""
}];

}

sel[p.id]=0;

});

drawCats();
render();

}catch(error){

console.error(error);

listEl.innerHTML=
'<div class="errorBox">'+
'<b>Products Load Error</b><br><br>'+
escapeHTML(error.message)+
'<br><br>'+
'اگر یہاں API ERROR 404/500 دکھائی دے تو مسئلہ index.html کا نہیں بلکہ server/API کا ہے۔'+
'</div>';

}

}


/* ESCAPE */

function escapeHTML(str){

return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* CATEGORIES */

function drawCats(){

const set=new Set();

products.forEach(function(p){

if(p.category){
set.add(p.category);
}

});

const categories=["ALL",...set];

catsEl.innerHTML="";

categories.forEach(function(x){

const btn=document.createElement("button");

btn.textContent=
x==="ALL"?"ALL ITEMS":x;

if(x===category){
btn.className="active";
}

btn.onclick=function(){

category=x;

drawCats();
render();

};

catsEl.appendChild(btn);

});

}


/* RENDER */

function render(){

const q=
searchEl.value.toLowerCase().trim();

const filtered=products.filter(function(p){

const name=
String(p.name||"").toLowerCase();

const variants=
Array.isArray(p.variants)
?p.variants:[];

const codeMatch=
variants.some(function(v){

return String(v.code||"")
.toLowerCase()
.includes(q);

});

return(
(category==="ALL"||p.category===category)
&&
(
name.includes(q)||
codeMatch
)
);

});

listEl.innerHTML="";

if(!filtered.length){

listEl.innerHTML=
'<div class="card">No items found</div>';

return;

}


filtered.forEach(function(p){

if(!p.variants||!p.variants.length){
return;
}

let index=sel[p.id]||0;

if(index>=p.variants.length){
index=0;
sel[p.id]=0;
}

const v=p.variants[index];

const key=p.id+"_"+index;

const quantity=
cartData[key]
?cartData[key].qty
:0;


/* CARD */

const card=document.createElement("div");

card.className="card";


/* IMAGE */

const pic=document.createElement("div");

pic.className="pic";

pic.onclick=function(){

openViewer(
v.img||p.img||""
);

};


const img=document.createElement("img");

img.src=v.img||p.img||"";
img.alt=p.name||"";
img.draggable=false;

pic.appendChild(img);


/* INFO */

const info=document.createElement("div");

info.className="info";


/* CODE */

const code=document.createElement("span");

code.className="code";

code.textContent=
"CODE: "+(v.code||"");


/* NAME */

const name=document.createElement("b");

name.className="name";

name.textContent=p.name||"";


/* VARIANT SELECTION */

const variantArea=document.createElement("div");


if(p.variants.length===2){

variantArea.className="twoVariant";

p.variants.forEach(function(item,j){

const btn=document.createElement("button");

btn.className="variantBtn";

if(j===index){
btn.classList.add("selected");
}

btn.textContent=
item.label||("Option "+(j+1));

btn.onclick=function(e){

e.stopPropagation();

sel[p.id]=j;

render();

};

variantArea.appendChild(btn);

});

}else{

variantArea.className="variantRow";


const left=document.createElement("button");

left.className="arrowBtn";
left.textContent="‹";

left.onclick=function(e){

e.stopPropagation();

prevVariant(p.id);

};


const label=document.createElement("div");

label.className="variantLabel";

label.textContent=
v.label||"Select";


const right=document.createElement("button");

right.className="arrowBtn";
right.textContent="›";

right.onclick=function(e){

e.stopPropagation();

nextVariant(p.id);

};

variantArea.appendChild(left);
variantArea.appendChild(label);
variantArea.appendChild(right);

}


/* QUANTITY */

const qbox=document.createElement("div");

qbox.className="q";


const minus=document.createElement("button");

minus.textContent="−";

minus.onclick=function(e){

e.stopPropagation();

change(p.id,-1);

};


const qty=document.createElement("div");

qty.className="qtyBox";

qty.textContent=quantity;


const plus=document.createElement("button");

plus.textContent="+";

plus.onclick=function(e){

e.stopPropagation();

change(p.id,1);

};


qbox.appendChild(minus);
qbox.appendChild(qty);
qbox.appendChild(plus);


info.appendChild(code);
info.appendChild(name);
info.appendChild(variantArea);
info.appendChild(qbox);

card.appendChild(pic);
card.appendChild(info);

listEl.appendChild(card);

});

}


/* VARIANT PREVIOUS */

function prevVariant(id){

const p=products.find(function(x){
return String(x.id)===String(id);
});

if(!p||!p.variants.length)return;

let i=sel[p.id]||0;

i--;

if(i<0){
i=p.variants.length-1;
}

sel[p.id]=i;

render();

}


/* VARIANT NEXT */

function nextVariant(id){

const p=products.find(function(x){
return String(x.id)===String(id);
});

if(!p||!p.variants.length)return;

let i=sel[p.id]||0;

i++;

if(i>=p.variants.length){
i=0;
}

sel[p.id]=i;

render();

}


/* QUANTITY */

function change(id,d){

const p=products.find(function(x){
return String(x.id)===String(id);
});

if(!p||!p.variants.length)return;

const index=sel[p.id]||0;

const v=p.variants[index];

const key=p.id+"_"+index;

const newQty=
(cartData[key]?.qty||0)+d;

if(newQty<=0){

delete cartData[key];

}else{

cartData[key]={
name:p.name||"",
variant:v.label||"",
code:v.code||"",
img:v.img||p.img||"",
qty:newQty
};

}

updateCartCount();
render();

if(cartOverlay.classList.contains("open")){
renderCart();
}

}


/* CART COUNT */

function updateCartCount(){

const total=
Object.values(cartData)
.reduce(function(sum,item){

return sum+Number(item.qty||0);

},0);

countEl.textContent=total;
cartTotalEl.textContent=total;

}


/* SHOW CART */

function showCart(){

renderCart();

cartOverlay.classList.add("open");

document.body.style.overflow="hidden";

}


/* CLOSE CART */

function closeCart(){

cartOverlay.classList.remove("open");

document.body.style.overflow="";

}


/* CART */

function renderCart(){

const keys=Object.keys(cartData);

if(!keys.length){

cartItemsEl.innerHTML=
'<div class="item">Cart is empty</div>';

updateCartCount();

return;

}

cartItemsEl.innerHTML="";

keys.forEach(function(key,index){

const x=cartData[key];

const item=document.createElement("div");

item.className="item";


const name=document.createElement("div");

name.className="itemName";

name.textContent=
(index+1)+". "+x.name;


const info=document.createElement("div");

info.className="itemInfo";

info.textContent=
"("+x.variant+") | Code: "+x.code;


const controls=document.createElement("div");

controls.className="cartControls";


const minus=document.createElement("button");

minus.textContent="−";

minus.onclick=function(){
cartChange(key,-1);
};


const qty=document.createElement("b");

qty.textContent=x.qty;


const plus=document.createElement("button");

plus.textContent="+";

plus.onclick=function(){
cartChange(key,1);
};


const remove=document.createElement("button");

remove.className="removeBtn";
remove.textContent="Remove";

remove.onclick=function(){
removeCart(key);
};


controls.appendChild(minus);
controls.appendChild(qty);
controls.appendChild(plus);
controls.appendChild(remove);

item.appendChild(name);
item.appendChild(info);
item.appendChild(controls);

cartItemsEl.appendChild(item);

});

updateCartCount();

}


/* CART CHANGE */

function cartChange(key,d){

if(!cartData[key])return;

cartData[key].qty+=d;

if(cartData[key].qty<=0){
delete cartData[key];
}

renderCart();
render();

}


/* REMOVE */

function removeCart(key){

delete cartData[key];

renderCart();
render();

}


/* IMAGE VIEWER */

function openViewer(src){

if(!src)return;

viewerImgEl.src=src;

viewerEl.classList.add("open");

document.body.style.overflow="hidden";

}


function closeViewer(){

viewerEl.classList.remove("open");

viewerImgEl.src="";

document.body.style.overflow="";

}


/* WHATSAPP */

function wa(){

const keys=Object.keys(cartData);

if(!keys.length){

alert("Cart is empty");
return;

}

let message=
"*NEW ORDER - BIN AMEEN TRADER*\n\n";

keys.forEach(function(key,index){

const x=cartData[key];

message+=
(index+1)+
". *"+x.name+
"* ("+x.variant+
")\nCode: "+
x.code+
" | Qty: *"+
x.qty+
"*\n\n";

});

window.open(
"https://wa.me/923331390045?text="+
encodeURIComponent(message),
"_blank"
);

}


/* SEARCH */

searchEl.addEventListener(
"input",
render
);


/* OUTSIDE CART */

cartOverlay.addEventListener(
"click",
function(e){

if(e.target===cartOverlay){
closeCart();
}

});


/* OUTSIDE VIEWER */

viewerEl.addEventListener(
"click",
function(e){

if(e.target===viewerEl){
closeViewer();
}

});


/* PROTECTION */

document.addEventListener(
"contextmenu",
function(e){

if(
e.target.tagName==="IMG"||
e.target.closest(".pic")||
e.target.closest(".viewerBox")
){

e.preventDefault();

}

});

document.addEventListener(
"dragstart",
function(e){

if(e.target.tagName==="IMG"){
e.preventDefault();
}

});


/* START */

updateCartCount();

load();

</script>

</body>
</html>
