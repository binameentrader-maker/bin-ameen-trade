<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIN AMEEN TRADER</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  padding:0;
  background:#c8d3df;
  font-family:Arial,Helvetica,sans-serif;
  color:#1f293d;
  -webkit-user-select:none;
  user-select:none;
}

body{padding:8px}

.wrap{
  width:100%;
  max-width:480px;
  margin:auto;
}

/* HEADER */

header{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:8px;
  margin-bottom:8px;
  border-radius:0;
}

header h2{
  text-align:center;
  font-size:23px;
  margin:2px 0 4px;
}

header div{
  text-align:center;
  font-size:14px;
}

/* BUTTONS */

button{
  border:0;
  border-radius:0;
  padding:7px 9px;
  font-weight:bold;
  cursor:pointer;
  font-size:13px;
}

.main{
  background:#1f293d;
  color:white;
}

.cartTop{
  width:100%;
  margin-bottom:8px;
  padding:10px;
  font-size:15px;
}

/* CATEGORIES */

.cats{
  display:flex;
  gap:5px;
  overflow-x:auto;
  margin:7px 0;
  padding-bottom:2px;
}

.cats button{
  background:#fff;
  border:1px solid #8fa0b5;
  white-space:nowrap;
}

.cats .active{
  background:#1f293d;
  color:white;
}

/* SEARCH */

.search{
  width:100%;
  padding:9px;
  border:2px solid #8fa0b5;
  border-radius:0;
  background:white;
  font-size:14px;
  margin-bottom:8px;
}

/* PRODUCT CARD */

.card{
  background:#fff;
  border:2px solid #8fa0b5;
  border-radius:0;
  padding:7px;
  margin-bottom:7px;
  display:flex;
  gap:8px;
  align-items:center;
  min-height:105px;
}

/* IMAGE */

.pic{
  width:82px;
  height:82px;
  border:1px solid #8fa0b5;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  position:relative;
  overflow:hidden;
  background:white;
  cursor:pointer;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-drag:none;
}

/* WATERMARK */

.pic:after{
  content:"BIN AMEEN";
  position:absolute;
  font-size:9px;
  font-weight:bold;
  color:rgba(31,41,61,.16);
  transform:rotate(-25deg);
  pointer-events:none;
}

/* INFO */

.info{
  flex:1;
  min-width:0;
}

.productName{
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;

  font-size:13px;
  font-weight:bold;
  line-height:16px;
  margin:2px 0 5px;
}

/* VARIANT NAV */

.variantNav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:3px;
  margin:3px 0 5px;
}

.variantNav button{
  background:#475569;
  color:white;
  width:30px;
  height:27px;
  padding:0;
  flex-shrink:0;
}

.variantCode{
  background:#f1f5f9;
  border:1px solid #cbd5e1;
  padding:5px 7px;
  font-size:11px;
  font-weight:bold;
  min-width:70px;
  text-align:center;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

/* QUANTITY */

.q{
  display:flex;
  align-items:center;
  gap:5px;
}

.q button{
  background:#475569;
  color:white;
  width:29px;
  height:27px;
  padding:0;
}

.q b{
  min-width:18px;
  text-align:center;
  font-size:13px;
}

/* =================================================
   SEPARATE CART SCREEN
================================================= */

.cartScreen{
  display:none;
  position:fixed;
  inset:0;
  z-index:9998;
  background:#c8d3df;
  overflow:auto;
}

.cartScreen.open{
  display:block;
}

.cartPage{
  width:100%;
  max-width:480px;
  margin:auto;
  padding:8px;
}

.cartHeader{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:10px;
  margin-bottom:7px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.cartHeader h3{
  margin:0;
  font-size:18px;
}

.cartBack{
  background:#1f293d;
  color:white;
  padding:8px 12px;
}

.item{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:8px;
  margin-bottom:6px;
  font-size:13px;
}

.cartQty{
  display:flex;
  align-items:center;
  gap:5px;
  margin-top:7px;
}

.cartQty button{
  background:#475569;
  color:white;
  min-width:30px;
  height:28px;
  padding:0;
}

.cartQty .remove{
  background:#991b1b;
  padding:0 9px;
}

.cartBottom{
  display:flex;
  gap:5px;
  margin-top:8px;
}

.cartBottom button{
  flex:1;
  padding:11px 5px;
}

.whatsapp{
  background:#128c7e;
  color:white;
}

.emptyCart{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:20px;
  text-align:center;
}

/* =================================================
   FULL PRODUCT VIEW
================================================= */

.viewer{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#fff;
  overflow:auto;
}

.viewer.open{
  display:block;
}

.viewerTop{
  height:48px;
  background:#1f293d;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 10px;
  position:sticky;
  top:0;
  z-index:5;
}

.viewerTop button{
  background:#fff;
  color:#1f293d;
  min-width:70px;
}

.viewerBody{
  max-width:600px;
  margin:auto;
  padding:12px;
  text-align:center;
}

.viewerImageBox{
  width:100%;
  height:min(68vh,650px);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#fff;
  border:1px solid #ddd;
  overflow:hidden;
}

.viewerImageBox img{
  max-width:100%;
  max-height:100%;
  object-fit:contain;
  pointer-events:none;
  -webkit-user-drag:none;
}

.viewerWatermark{
  position:absolute;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) rotate(-25deg);
  font-size:30px;
  font-weight:bold;
  color:rgba(31,41,61,.13);
  pointer-events:none;
  white-space:nowrap;
}

.viewerName{
  font-size:19px;
  font-weight:bold;
  line-height:24px;
  margin:12px 4px 6px;
}

.viewerNav{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  margin:8px 0;
}

.viewerNav button{
  background:#1f293d;
  color:#fff;
  width:45px;
  height:38px;
  font-size:20px;
}

.viewerCode{
  border:2px solid #8fa0b5;
  background:#f1f5f9;
  padding:9px 15px;
  min-width:110px;
  font-weight:bold;
  font-size:14px;
}

.viewerQty{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
  margin-top:10px;
}

.viewerQty button{
  background:#1f293d;
  color:#fff;
  width:42px;
  height:38px;
  font-size:20px;
}

.viewerQty b{
  min-width:35px;
  font-size:18px;
}

.noItems{
  background:#fff;
  border:2px solid #8fa0b5;
  padding:12px;
  text-align:center;
}

@media(max-width:380px){

  body{padding:6px}

  header h2{font-size:20px}

  .pic{
    width:72px;
    height:72px;
  }

  .card{
    min-height:91px;
    padding:6px;
  }

  .productName{
    font-size:12px;
    line-height:14px;
  }

  .viewerName{
    font-size:17px;
  }

}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<div class="wrap" id="home">

<header>
  <h2>BIN AMEEN TRADER</h2>
  <div>Call: 03331390045</div>
</header>

<button class="main cartTop" onclick="openCart()">
  View Cart (<span id="count">0</span>)
</button>

<div class="cats" id="cats"></div>

<input
  class="search"
  id="search"
  placeholder="Search product name or SKU code..."
  autocomplete="off"
>

<div id="list"></div>

</div>


<!-- ================= SEPARATE CART ================= -->

<div class="cartScreen" id="cartScreen">

  <div class="cartPage">

    <div class="cartHeader">

      <h3>Your Selected Items</h3>

      <button
        class="cartBack"
        onclick="closeCart()"
      >
        ← Back
      </button>

    </div>

    <div id="cartItems"></div>

    <div class="cartBottom">

      <button
        class="main"
        onclick="closeCart()"
      >
        Continue Shopping
      </button>

      <button
        class="whatsapp"
        onclick="wa()"
      >
        WhatsApp Order
      </button>

    </div>

  </div>

</div>


<!-- ================= PRODUCT VIEW ================= -->

<div class="viewer" id="viewer">

  <div class="viewerTop">

    <button onclick="closeViewer()">
      ← Back
    </button>

    <b>PRODUCT VIEW</b>

    <button onclick="cartFromViewer()">
      Cart (<span id="viewerCount">0</span>)
    </button>

  </div>

  <div class="viewerBody">

    <div class="viewerImageBox">

      <img
        id="viewerImg"
        src=""
        alt=""
        draggable="false"
        oncontextmenu="return false"
      >

      <div class="viewerWatermark">
        BIN AMEEN TRADER
      </div>

    </div>

    <div
      class="viewerName"
      id="viewerName">
    </div>

    <div class="viewerNav">

      <button onclick="previousVariant()">
        ←
      </button>

      <div
        class="viewerCode"
        id="viewerCode">
      </div>

      <button onclick="nextVariant()">
        →
      </button>

    </div>

    <div class="viewerQty">

      <button onclick="viewerChange(-1)">
        −
      </button>

      <b id="viewerQty">0</b>

      <button onclick="viewerChange(1)">
        +
      </button>

    </div>

  </div>

</div>


<script>

/* =================================================
   DATA
================================================= */

let products=[];
let sel={};
let cart={};

let category="ALL";

let viewerProduct=null;
let viewerIndex=0;


/* =================================================
   LOAD
================================================= */

async function load(){

  try{

    const response=
      await fetch("/api/products");

    if(!response.ok){
      throw new Error("API error");
    }

    const data=
      await response.json();

    products=
      Array.isArray(data)
      ? data
      : [];

    products.forEach(p=>{

      if(!Array.isArray(p.variants)){
        p.variants=[];
      }

      if(p.variants.length===0){

        p.variants=[{
          label:"",
          code:p.code||"",
          img:p.img||""
        }];

      }

      sel[p.id]=0;

    });

    drawCats();
    render();

  }catch(error){

    console.error(error);

    document.getElementById("list").innerHTML=
      '<div class="noItems">Unable to load products.</div>';

  }

}


/* =================================================
   CATEGORY NORMALIZATION
   یہ category filtering کو مضبوط کرتا ہے
================================================= */

function cleanCategory(value){

  return String(value||"")
    .trim()
    .toLowerCase();

}


/* =================================================
   DRAW CATEGORIES
================================================= */

function drawCats(){

  const seen=new Set();

  const categories=[];

  products.forEach(p=>{

    const original=
      String(p.category||"").trim();

    if(!original)return;

    const key=
      cleanCategory(original);

    if(!seen.has(key)){

      seen.add(key);

      categories.push(original);

    }

  });


  const allCategories=[
    "ALL",
    ...categories
  ];


  document.getElementById("cats").innerHTML=

    allCategories.map(x=>{

      const active=
        cleanCategory(x)===
        cleanCategory(category)
        ? "active"
        : "";

      const label=
        x==="ALL"
        ? "ALL ITEMS"
        : x;


      return `

        <button
          class="${active}"
          onclick='setCategory(${JSON.stringify(x)})'
        >

          ${escapeHTML(label)}

        </button>

      `;

    }).join("");

}


/* =================================================
   SET CATEGORY
================================================= */

function setCategory(x){

  category=x;

  drawCats();

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =================================================
   RENDER
================================================= */

function render(){

  const searchValue=
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const list=
    document.getElementById("list");


  const selectedCategory=
    cleanCategory(category);


  const filtered=
    products.filter(p=>{

      const productCategory=
        cleanCategory(p.category);


      const categoryOK=
        selectedCategory==="all" ||
        productCategory===selectedCategory;


      const name=
        String(p.name||"")
          .toLowerCase();


      const variantMatch=
        p.variants.some(v=>{

          const code=
            String(v.code||"")
              .toLowerCase();

          const label=
            String(v.label||"")
              .toLowerCase();

          const variantName=
            String(v.name||"")
              .toLowerCase();

          return(
            code.includes(searchValue) ||
            label.includes(searchValue) ||
            variantName.includes(searchValue)
          );

        });


      return(
        categoryOK &&
        (
          searchValue==="" ||
          name.includes(searchValue) ||
          variantMatch
        )
      );

    });


  if(!filtered.length){

    list.innerHTML=
      '<div class="noItems">No items found</div>';

    return;

  }


  list.innerHTML="";


  filtered.forEach(p=>{

    let index=
      Number(sel[p.id]||0);


    if(index<0)index=0;

    if(index>=p.variants.length){
      index=0;
    }

    sel[p.id]=index;


    const v=
      p.variants[index];


    const key=
      p.id+"_"+index;


    const qty=
      cart[key]?.qty||0;


    const image=
      v.img ||
      p.img ||
      "";


    const card=
      document.createElement("div");


    card.className="card";


    card.innerHTML=`

      <div
        class="pic"
        onclick="openViewer(${Number(p.id)},${index})"
      >

        <img
          src="${escapeAttr(image)}"
          alt=""
          draggable="false"
          oncontextmenu="return false"
        >

      </div>


      <div class="info">

        <span class="productName">
          ${escapeHTML(
            getVariantName(p,v)
          )}
        </span>


        <div class="variantNav">

          <button
            onclick="changeVariant(${Number(p.id)},-1)"
          >
            ←
          </button>


          <div class="variantCode">

            ${escapeHTML(
              v.code||"CODE"
            )}

          </div>


          <button
            onclick="changeVariant(${Number(p.id)},1)"
          >
            →
          </button>

        </div>


        <div class="q">

          <button
            onclick="change(${Number(p.id)},-1)"
          >
            −
          </button>

          <b>${qty}</b>

          <button
            onclick="change(${Number(p.id)},1)"
          >
            +
          </button>

        </div>

      </div>

    `;


    list.appendChild(card);

  });

}


/* =================================================
   VARIANT NAME
================================================= */

function getVariantName(product,variant){

  if(variant && variant.name){
    return variant.name;
  }

  if(
    variant &&
    variant.label
  ){

    return(
      product.name+
      " "+
      variant.label
    );

  }

  return product.name||"";

}


/* =================================================
   CHANGE VARIANT
================================================= */

function changeVariant(id,d){

  const p=
    products.find(x=>x.id===id);

  if(
    !p ||
    !p.variants ||
    !p.variants.length
  ){
    return;
  }


  let i=
    Number(sel[id]||0);


  i+=d;


  if(i<0){
    i=p.variants.length-1;
  }

  if(i>=p.variants.length){
    i=0;
  }


  sel[id]=i;

  render();

}


/* =================================================
   CHANGE QUANTITY
================================================= */

function change(id,d){

  const p=
    products.find(x=>x.id===id);

  if(!p)return;


  const index=
    Number(sel[id]||0);


  const v=
    p.variants[index];


  const key=
    p.id+"_"+index;


  const newQty=
    (cart[key]?.qty||0)+d;


  if(newQty<=0){

    delete cart[key];

  }else{

    cart[key]={

      name:
        getVariantName(p,v),

      productName:
        p.name||"",

      variant:
        v.label||"",

      code:
        v.code||"",

      qty:newQty,

      img:
        v.img||
        p.img||
        ""

    };

  }


  updateCartCount();

  render();

}


/* =================================================
   CART COUNT
================================================= */

function updateCartCount(){

  const total=
    Object.values(cart)
      .reduce(
        (sum,x)=>
          sum+Number(x.qty||0),
        0
      );


  document.getElementById("count")
    .textContent=total;


  document.getElementById("viewerCount")
    .textContent=total;

}


/* =================================================
   OPEN SEPARATE CART
================================================= */

function openCart(){

  renderCart();

  document
    .getElementById("cartScreen")
    .classList.add("open");

  document.body.style.overflow="hidden";

}


/* =================================================
   CLOSE CART
================================================= */

function closeCart(){

  document
    .getElementById("cartScreen")
    .classList.remove("open");

  document.body.style.overflow="";

}


/* =================================================
   RENDER CART
================================================= */

function renderCart(){

  const box=
    document.getElementById("cartItems");


  const items=
    Object.values(cart);


  if(!items.length){

    box.innerHTML=
      '<div class="emptyCart">Cart is empty</div>';

    return;

  }


  box.innerHTML=

    items.map((x,i)=>{

      return`

        <div class="item">

          <b>
            ${i+1}.
            ${escapeHTML(
              x.productName||x.name
            )}
          </b>

          ${
            x.variant
            ? ` (${escapeHTML(x.variant)})`
            : ""
          }

          <br>

          Code:
          ${escapeHTML(x.code||"")}

          &nbsp; | &nbsp;

          Qty:
          <b>${x.qty}</b>


          <div class="cartQty">

            <button
              onclick="cartChange(${i},-1)"
            >
              −
            </button>

            <b>${x.qty}</b>

            <button
              onclick="cartChange(${i},1)"
            >
              +
            </button>

            <button
              class="remove"
              onclick="cartRemove(${i})"
            >
              Remove
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =================================================
   CART CHANGE
================================================= */

function cartChange(index,d){

  const keys=
    Object.keys(cart);

  const key=
    keys[index];


  if(!key)return;


  cart[key].qty+=d;


  if(cart[key].qty<=0){

    delete cart[key];

  }


  updateCartCount();

  renderCart();

  render();

}


/* =================================================
   CART REMOVE
================================================= */

function cartRemove(index){

  const keys=
    Object.keys(cart);

  const key=
    keys[index];


  if(key){

    delete cart[key];

  }


  updateCartCount();

  renderCart();

  render();

}


/* =================================================
   PRODUCT VIEW
================================================= */

function openViewer(id,index){

  const p=
    products.find(x=>x.id===id);

  if(!p)return;


  viewerProduct=p;

  viewerIndex=
    Math.max(
      0,
      Math.min(
        index,
        p.variants.length-1
      )
    );


  updateViewer();


  document
    .getElementById("viewer")
    .classList.add("open");


  document.body.style.overflow="hidden";

}


/* =================================================
   CLOSE VIEWER
================================================= */

function closeViewer(){

  document
    .getElementById("viewer")
    .classList.remove("open");

  document.body.style.overflow="";

}


/* =================================================
   UPDATE VIEWER
================================================= */

function updateViewer(){

  if(!viewerPr
